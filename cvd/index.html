/* ============================================================
   STAGE 1 — IMPACT ANALYSIS
   ============================================================ */
function screenImpact(c){
  const matches = matchProducts(c);
  const misses = S.products.filter(p=>!matches.find(m=>m.product.id===p.id));
  return title('02','Impact analysis','The SBOM match tells you where the component lives. You decide which products are genuinely in scope — presence in a build is not the same as exposure in the field.')
  + (matches.length
      ? '<div class="note"><span class="ic">◆</span><div><b>'+matches.length+' product'+(matches.length===1?'':'s')+' matched.</b> Products are pre-selected. Remove any that carry the component but never reach the vulnerable code — you will be asked for a justification, which becomes the VEX statement.</div></div>'
      : '<div class="note warn"><span class="ic">!</span><div><b>No product SBOM matched this component and version range.</b> Check the component name and range on the intake screen. If the match is genuinely empty, close the case with a "not affected" VEX statement.</div></div>')
  + stageTools()
  + (matches.length ? panel({key:'impact-matched', need:true, tone:'accent-crit', title:'Matched products',
      sub:'Version in the SBOM falls inside the affected range.',
      actions:'<button class="btn sm" id="btnSelectAll">Select all</button><button class="btn sm" id="btnSelectNone">Clear</button>',
      body:'<div class="tbl-wrap"><table class="tbl">'
        + '<thead><tr><th style="width:42px"></th><th>Product</th><th>Component in SBOM</th><th>How it is used</th><th>Installed base</th><th>Patient exposure</th></tr></thead><tbody>'
        + matches.map(m=>{
            const p=m.product, on=c.impacted.includes(p.id);
            return '<tr><td><input type="checkbox" data-scope="'+p.id+'" '+(on?'checked':'')+' aria-label="Include '+esc(p.short)+'"></td>'
            + '<td><b>'+esc(p.short)+'</b><div class="tiny muted">'+esc(p.version)+' · '+esc(p.devClass)+'</div></td>'
            + '<td>'+m.hits.map(h=>'<code class="inl">'+esc(h.comp.n)+' '+esc(h.comp.v)+'</code>'+(h.comp.use==='optional'?' <span class="badge b-neutral">not shipped</span>':'')).join('<br>')+'</td>'
            + '<td class="tiny">'+m.hits.map(h=>esc(h.comp.role)).join('<br>')+'</td>'
            + '<td class="num">'+Number(p.units).toLocaleString()+'</td>'
            + '<td>'+(p.lifeSustaining?'<span class="badge b-crit">life-sustaining</span>':p.patientConnected?'<span class="badge b-med">patient-connected</span>':'<span class="badge b-neutral">not patient-connected</span>')+'</td></tr>';
          }).join('')
        + '</tbody></table></div>',
      foot:'<button class="btn primary big" id="btnToRisk" '+(c.impacted.length?'':'disabled')+'>Validate risk on '+(c.impacted.length||'0')+' product'+(c.impacted.length===1?'':'s')+' →</button>'
        + '<button class="btn" id="btnNoImpact">No product is affected — close the case</button>'
        + '<div class="pop"><button class="btn ghost sm" data-goto="0">← Back to intake</button></div>'}) : '')

  + (c.excluded.length ? panel({key:'impact-excluded', tone:'accent-warn', title:'Excluded from scope',
      sub:'These justifications become your VEX statements.',
      body:c.excluded.map(x=>{
          const p=S.products.find(y=>y.id===x.pid)||{};
          return '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f5"><div><b>'+esc(p.short||x.pid)+'</b><div class="tiny muted">'+esc(x.reason)+'</div></div>'
          + '<button class="btn ghost xs" data-unexclude="'+esc(x.pid)+'">Put back in scope</button></div>';
        }).join('')}) : '')

  + panel({key:'impact-misses', title:'Not matched',
      sub:misses.length+' products where the component is absent or already on a fixed version. No action needed, but the record matters if a customer asks.',
      body:'<div class="row">'+misses.map(p=>'<span class="chip">'+esc(p.short)+'</span>').join('')+'</div>'});
}

/* ============================================================
   STAGE 2 — RISK VALIDATION  (Gate A)
   ============================================================ */
function screenRisk(c){
  c.impacted.forEach(pid=>{ if(!c.assess[pid]) c.assess[pid] = blankAssessment(pid); });
  const rec = recommendation(c);
  const done = allAssessed(c);

  return title('03','Risk validation','Security and Product work the same screen. Decide whether the vulnerable code is actually reachable, what it would mean for a patient, and what risk is left after the mitigations you can realistically ship.')
  + modeBanner(c) + stageTools()
  + c.impacted.map(pid=> assessCard(c, pid)).join('')

  + panel({key:'risk-rec', need:done && !c.decision, tone:'accent'+(rec.verdict==='disclose'?'-crit':'-ok'),
      title:'Recommendation',
      sub:'Calculated from the values above. The score is arithmetic, not a model output — the same inputs always give the same answer.',
      badge:'<span class="badge '+(rec.verdict==='disclose'?'b-crit':'b-low')+'">'+(rec.verdict==='disclose'?'Escalate to disclosure':'Eligible to close')+'</span>',
      body:'<ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.7">'
        + rec.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>'})

  + panel({key:'risk-gate', need:done, tone:'accent', title:'Gate A — decision and sign-off',
      sub:'Both paths need the same two signatures. Closing a case is a decision of record, not an absence of one.',
      body:'<div class="grid g2">'
        + '<button class="choice" data-tone="stop" data-decide="close" aria-pressed="'+(c.decision==='close')+'" '+(done?'':'disabled')+'>'
        +   '<b>Close — risk accepted or already mitigated</b>'
        +   '<span>Residual risk is low, patient impact is minor, and the fix rides the normal release train. You still publish a VEX statement and keep the record.</span></button>'
        + '<button class="choice" data-tone="go" data-decide="escalate" aria-pressed="'+(c.decision==='escalate')+'" '+(done?'':'disabled')+'>'
        +   '<b>Escalate — proceed to disclosure</b>'
        +   '<span>The case moves to a drafted advisory, cross-functional review, and a communication plan with named recipients and dates.</span></button>'
        + '</div>'
        + (done?'':'<div class="note warn" style="margin:14px 0 0"><span class="ic">!</span><div>Finish reachability, attack path, patient impact and at least one mitigation choice on every product before deciding.'
            + (c.mode==='sim'?' In Simulation mode, use <b>Fill with a sample assessment</b> in the bar above to do this in one step.':'')+'</div></div>')
        + (c.decision && c.decision!==rec.verdict.replace('disclose','escalate')
            ? '<div class="note crit" style="margin:14px 0 0"><span class="ic">!</span><div><b>Your decision differs from the calculated recommendation.</b> Record why — this is the line an auditor or a regulator will read first.</div></div>'
              + fArea('Rationale for departing from the recommendation','decisionRationale',c.decisionRationale,'Be specific about the clinical or technical reasoning. "Accepted by management" is not a rationale.')
            : '')
        + (c.decision ? gateBlock(c,'gateA','Gate A — Security and Product sign-off',
            'The Product Security representative and the Product Owner both attest to this decision. Approve everything at once from the bar above, or sign row by row here.') : ''),
      foot: (c.decision
        ? '<button class="btn primary big" id="btnGateA">'
          + (gateComplete(c,'gateA') ? (c.decision==='close'?'Close the case →':'Continue to disclosure draft →')
             : (c.mode==='sim'?'Approve all and continue →':'Approve as '+esc(me().name.split(' ')[0])+' and continue →'))+'</button>'
        : '<button class="btn primary big" disabled>Choose a decision to continue</button>')
        + '<div class="pop"><button class="btn ghost sm" data-goto="1">← Back to impact</button></div>'});
}
function assessComplete(a){
  return !!(a && a.reach && a.reach!=='unknown' && a.path && a.safety && (a.mitigations||[]).length);
}
function assessCard(c, pid){
  const p = S.products.find(x=>x.id===pid); if(!p) return '';
  const a = c.assess[pid];
  const s = scoreAssessment(c, a);
  const m = matchProducts(c).find(x=>x.product.id===pid);
  const comps = m ? m.hits.map(h=>h.comp) : [];
  const ok = assessComplete(a);
  const body =
    '<div class="note"><span class="ic">▣</span><div><b>Where the component actually sits.</b> '
  +   comps.map(x=>esc(x.n)+' '+esc(x.v)+' — '+esc(x.role)+(x.use==='optional'?' (present in the build but not enabled in the shipping configuration)':'')).join('. ')
  +   '. Clinical use: '+esc(p.care)+'</div></div>'
  + '<div class="field"><label>Reviewers and stakeholders for this product <span class="tipmark" data-tip="The people who worked this specific product: the firmware owner, the clinical lead, the service manager. Signatures are still taken by function at the gate — this records who was actually in the room.">i</span></label>'
  +   '<div class="reviewers">'
  +     (a.reviewers||[]).map(rid=>{ const rp = S.people.find(x=>x.id===rid); if(!rp) return '';
          return '<span class="rv"><i>'+esc(initials(rp.name))+'</i>'+esc(rp.name)+' · '+esc((FUNCTIONS[rp.fn]||{}).label||'')+'</span>'; }).join('')
  +     '<button class="btn ghost xs" data-reviewers="'+esc(pid)+'">'+((a.reviewers||[]).length?'Change':'+ Assign reviewers')+'</button>'
  +   '</div></div>'
  + '<div class="grid g2">'
  + '<div>'
  +   fSelectA(pid,'reach','Is the vulnerable code reachable?', Object.keys(REACH_LABEL).map(k=>[k,REACH_LABEL[k]]), a.reach, 'The single most important question. A component in the SBOM that is never called is a documentation problem, not a patient safety problem.')
  +   fSelectA(pid,'path','Attack path exposure', Object.keys(PATH_LABEL).map(k=>[k,PATH_LABEL[k]]), a.path, 'How an attacker would have to reach the device in the field, not in a lab.')
  +   fSelectA(pid,'safety','Patient impact if exploited', Object.keys(SAFETY_LABEL).map(k=>[k,SAFETY_LABEL[k]]), a.safety, 'Judged with clinical input. Moderate or above removes the option of a silent fix.')
  + '</div><div>'
  +   fAreaA(pid,'usage','How the product actually uses the component', a.usage, 'The engineering evidence behind the reachability call: which call path, which mode, which interface.')
  +   '<div class="row" style="gap:10px">'
  +     '<div style="flex:1">'+fTextA(pid,'fixVersion','Fix version', a.fixVersion,'The release that removes the defect.')+'</div>'
  +     '<div style="flex:1">'+fDateA(pid,'fixEta','Fix availability', a.fixEta,'When customers can actually get it, including verification and any regulatory change assessment.')+'</div>'
  +   '</div>'
  + '</div></div>'
  + '<div class="field"><label>Mitigations agreed <span class="tipmark" data-tip="Each mitigation reduces residual risk by a fixed factor. Combining a patch with segmentation guidance is worth more than either alone, but the combined credit is capped at 85%.">i</span></label>'
  + '<div class="row">'+MITIGATIONS.map(mm=>{
      const on = (a.mitigations||[]).includes(mm.id);
      return '<button class="chip" data-mit="'+esc(pid)+'|'+esc(mm.id)+'" aria-pressed="'+on+'" data-tip="'+esc(mm.tip)+'" '
        + 'style="'+(on?'background:var(--petrol);color:#fff;border-color:var(--petrol)':'')+'">'+(on?'✓ ':'+ ')+esc(mm.label)+'</button>';
    }).join('')+'</div></div>'
  + fAreaA(pid,'workaround','Customer workaround while the fix is pending', a.workaround, 'What a hospital can do on Monday morning. If the answer is nothing, say so — it changes the urgency of the advisory.');

  return panel({key:'assess-'+pid, need:!ok, tone:'accent', title:p.name,
    sub:p.version+' · '+p.devClass+' · '+Number(p.units).toLocaleString()+' installed · '+p.exposure,
    badge:(ok?'<span class="badge b-low">assessed</span>':'<span class="badge b-med">incomplete</span>'),
    body: body, foot: scoreBlock(pid, s)});
}
function scoreBlock(pid, s){
  return '<div id="score-'+esc(pid)+'" style="width:100%">'
  + '<div class="grid g3" style="gap:16px">'
  + meterBox('Inherent risk', s.inherent, s.inherentBand, 'CVSS shaped by reachability, real attack path and patient impact for this product.')
  + meterBox('Residual risk', s.residual, s.band, 'What is left after the mitigations you selected. This is the number Gate A acts on.')
  + '<div><span class="eyebrow">Mitigation effect</span><div style="font-size:20px;font-weight:700" class="num">'+Math.round(s.effect*100)+'%</div>'
  +   '<div class="tiny muted">credited to the selected controls, capped at 85%</div>'
  + '</div></div>'
  + (s.floored?'<div class="note crit" style="margin:12px 0 0"><span class="ic">!</span><div><b>Residual risk floored at 5.0.</b> This vulnerability is confirmed as exploited in the wild, so controls that are agreed but not yet in customers\' hands cannot take it below Medium.</div></div>':'')
  + '</div>';
}
function meterBox(label, val, b, tip){
  const col = {crit:'var(--crit)',high:'#c2620f',med:'var(--warn)',low:'var(--ok)'}[b.k];
  return '<div><span class="eyebrow">'+esc(label)+' <span class="tipmark" data-tip="'+esc(tip)+'">i</span></span>'
  + '<div class="row" style="gap:8px;margin:2px 0 5px"><span style="font-size:20px;font-weight:700" class="num">'+val.toFixed(1)+'</span>'
  + '<span class="badge '+b.cls+'">'+esc(b.label)+'</span></div>'
  + '<div class="meter"><i style="width:'+(val*10)+'%;background:'+col+'"></i></div></div>';
}
function fSelectA(pid,k,lbl,opts,val,tip){
  return '<div class="field">'+fLabel(lbl,tip)+'<select data-assess-field="'+esc(pid)+'|'+k+'"><option value="">Choose…</option>'
    + opts.map(([v,l])=>'<option value="'+esc(v)+'"'+(val===v?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>';
}
function fTextA(pid,k,lbl,val,tip){
  return '<div class="field">'+fLabel(lbl,tip)+'<input type="text" data-assess-field="'+esc(pid)+'|'+k+'" value="'+esc(val||'')+'"></div>';
}
function fDateA(pid,k,lbl,val,tip){
  return '<div class="field">'+fLabel(lbl,tip)+'<input type="date" data-assess-field="'+esc(pid)+'|'+k+'" value="'+esc(val||'')+'"></div>';
}
function fAreaA(pid,k,lbl,val,tip){
  return '<div class="field">'+fLabel(lbl,tip)+'<textarea rows="3" data-assess-field="'+esc(pid)+'|'+k+'">'+esc(val||'')+'</textarea></div>';
}

/* ---------- shared gate block ---------- */
function gateBlock(c, gate, heading, blurb){
  const rows = requiredSigners(c, gate);
  const done = rows.filter(r=>r.sign && r.sign.decision==='approved').length;
  return '<div class="divider"></div>'
  + '<div class="row" style="justify-content:space-between;margin-bottom:10px">'
  +   '<div><h3 style="font-size:14px">'+esc(heading)+'</h3><div class="tiny muted" style="max-width:70ch">'+esc(blurb)+'</div></div>'
  +   '<span class="badge '+(done===rows.length?'b-low':'b-med')+'">'+done+' of '+rows.length+' signed</span>'
  + '</div>'
  + '<div class="sigwrap">'
  + rows.map(r=>{
      const F = FUNCTIONS[r.fn]||{label:r.fn};
      const p = r.person;
      const st = r.sign ? (r.sign.decision==='approved'?'1':'rejected') : '0';
      return '<div class="sig" data-signed="'+st+'">'
        + '<div class="av">'+esc(p?initials(p.name):'—')+'</div>'
        + '<div class="who"><b>'+esc(p?p.name:'No one assigned to '+F.label)+'</b>'
        +   '<span>'+esc(F.label)+(p?' · '+esc(p.role):'')+'</span>'
        +   (r.sign&&r.sign.comment?'<span style="color:var(--ink-2);margin-top:3px">“'+esc(r.sign.comment)+'”</span>':'')+'</div>'
        + '<div class="stat">'
        + (r.sign
            ? '<span class="badge '+(r.sign.decision==='approved'?'b-low':'b-crit')+'">'+(r.sign.decision==='approved'?'Approved':'Objection')+'</span>'
              + '<div class="tiny muted" style="margin-top:3px">'+esc(r.sign.name)+' · '+fmtDateTime(r.sign.ts)+'</div>'
              + '<button class="btn ghost xs" data-unsign="'+gate+'|'+r.fn+'" style="margin-top:2px">Withdraw</button>'
            : '<button class="btn sm primary" data-sign="'+gate+'|'+r.fn+'" '+(p?'':'disabled')+'>Sign</button>'
              + (p?' <button class="btn ghost xs" data-notifyone="'+gate+'|'+r.fn+'" data-tip="Draft a Slack, Teams and email reminder for this person">Notify</button>':''))
        + '</div></div>';
    }).join('')
  + '</div>'
  + (gateHasRejection(c,gate)?'<div class="note crit" style="margin-top:12px"><span class="ic">!</span><div><b>An objection is recorded.</b> The process is held here until it is resolved and the signature is re-taken.</div></div>':'');
}

/* ===== js/05-stages2.js ===== */
/* ============================================================
   CVD Console — draft, channels, send, close
   ============================================================ */

/* ---------- deterministic advisory composer ---------- */
function affectedTable(c){
  return c.impacted.map(pid=>{
    const p = S.products.find(x=>x.id===pid)||{}; const a = c.assess[pid]||{};
    return '  • '+(p.name||pid)+' — versions up to and including '+(p.version||'current')
      + (a.fixVersion?'; fixed in '+a.fixVersion:'; fix pending')
      + (a.fixEta?' (available '+fmtDate(Date.parse(a.fixEta+'T09:00:00'))+')':'');
  }).join('\n');
}
function mitigationLines(c){
  const set = new Set();
  c.impacted.forEach(pid=> (c.assess[pid]?.mitigations||[]).forEach(m=>set.add(m)));
  const lines = [...set].map(id=>{ const m = MITIGATIONS.find(x=>x.id===id); return m? '  • '+m.label : null; }).filter(Boolean);
  return lines.length? lines.join('\n') : '  • No mitigation is currently available.';
}
function workaroundLines(c){
  const w = c.impacted.map(pid=>{
    const p=S.products.find(x=>x.id===pid)||{}; const a=c.assess[pid]||{};
    return a.workaround ? '  • '+(p.short||pid)+': '+a.workaround : null;
  }).filter(Boolean);
  return w.length? w.join('\n') : '  • No interim workaround is available. Apply the update when it is released.';
}
function worstSafety(c){
  const order=['none','minor','moderate','serious']; let w='none';
  c.impacted.forEach(pid=>{ const s=c.assess[pid]?.safety; if(s && order.indexOf(s)>order.indexOf(w)) w=s; });
  return w;
}
function clinicalStatement(c){
  const w = worstSafety(c);
  return {
    none:'No patient harm scenario has been identified. The vulnerability affects data confidentiality or service availability only, and does not alter therapy delivery or monitoring.',
    minor:'The identified impact is limited to recoverable disruption. Clinical workflow may be interrupted briefly; no scenario leading to patient harm has been identified.',
    moderate:'Successful exploitation could delay therapy or degrade monitoring. Clinical staff would be able to detect and compensate for the condition using existing procedures.',
    serious:'Successful exploitation could contribute to patient harm, including missed alarm conditions or incorrect therapy delivery. Customers should apply the stated mitigations without waiting for the scheduled release.'
  }[w];
}
function creditLine(c){
  const s = SOURCES.find(x=>x.id===c.input.source);
  if(c.input.source==='researcher') return (c.input.sourceDetail||'The reporting researcher')+' reported this issue to '+S.org+' through our coordinated vulnerability disclosure process. We thank them for reporting it responsibly.';
  if(c.input.source==='customer') return 'This issue was reported by a customer security team through our support process. We thank them for bringing it to our attention.';
  if(c.input.source==='cisa') return 'This issue was coordinated with CISA'+(c.input.sourceDetail?' under '+c.input.sourceDetail:'')+'.';
  if(c.input.source==='hisac') return 'This issue was identified through Health-ISAC sector information sharing'+(c.input.sourceDetail?' ('+c.input.sourceDetail+')':'')+'.';
  if(c.input.source==='supplier') return 'This issue originates in a third-party component and was reported to us by '+(c.input.sourceDetail||'the upstream maintainers')+'.';
  return 'This issue was identified by '+S.org+' through internal security testing.';
}
function composeDraft(c, tid){
  const p = new Date(caseNow(c));
  const sev = severityFromCvss(c.input.cvss);
  const rec = recommendation(c);
  const worst = rec.worst ? rec.worst.s : null;
  const head = c.input.title || 'Security advisory';

  if(tid==='t-icsma'){
    return [
`${S.org.toUpperCase()} SECURITY ADVISORY — ${c.ref}`,
`Advisory ID: ${c.ref}`,
`Publication date: ${fmtDate(p.getTime())}`,
`CVE: ${c.input.cve||'Not assigned'}`,
`CVSS v3.1: ${c.input.cvss||'—'} (${sev.label})${c.input.vector?' — '+c.input.vector:''}`,
`CWE: ${c.input.cwe||'—'}`,
``,
`1. EXECUTIVE SUMMARY`,
`   ${head}. ${S.org} has identified ${c.impacted.length} affected product${c.impacted.length===1?'':'s'} and is publishing this advisory together with the mitigations listed in section 5.`,
``,
`2. RISK EVALUATION`,
`   Successful exploitation could ${riskVerb(c)}. After the mitigations described below, ${S.org} assesses residual risk to the installed base as ${worst?worst.band.label.toUpperCase():'—'}${worst?' ('+worst.residual.toFixed(1)+')':''}.`,
`   ${c.input.kev?'This vulnerability is listed on the CISA Known Exploited Vulnerabilities catalog. Exploitation has been confirmed in the wild.':'Exploitation status: '+(c.input.exploit||'no known public exploit at time of publication')+'.'}`,
``,
`3. AFFECTED PRODUCTS`,
affectedTable(c),
``,
`4. VULNERABILITY OVERVIEW`,
`   ${c.input.summary||'—'}`,
``,
`5. MITIGATIONS`,
mitigationLines(c),
``,
`6. CUSTOMER ACTIONS`,
workaroundLines(c),
`  • Confirm the software version in service and schedule the update through your normal change process.`,
`  • Report suspected exploitation to ${S.org} product security and to your regional CERT.`,
``,
`7. CLINICAL IMPACT`,
`   ${clinicalStatement(c)}`,
``,
`8. ACKNOWLEDGEMENT`,
`   ${creditLine(c)}`,
``,
`9. CONTACT`,
`   product-security@${slugOrg()}.example — PGP key published on the Trust Center.`
    ].join('\n');
  }

  if(tid==='t-letter'){
    return [
`${fmtDate(p.getTime())}`,
``,
`Subject: Important product security notice — ${head}`,
``,
`Dear Customer,`,
``,
`${S.org} is writing to inform you of a security vulnerability affecting ${c.impacted.length===1?'a product':'products'} in service at your organisation. We are providing this notice so your biomedical engineering and IT security teams can plan the required action.`,
``,
`WHAT WE FOUND`,
`${c.input.summary||'—'}`,
``,
`WHICH PRODUCTS ARE AFFECTED`,
affectedTable(c),
``,
`WHAT IT MEANS FOR PATIENT CARE`,
`${clinicalStatement(c)}`,
``,
`WHAT WE ARE DOING`,
mitigationLines(c),
``,
`WHAT WE ASK YOU TO DO`,
workaroundLines(c),
`  • Identify affected units in your fleet using the version information above.`,
`  • Schedule the update with your ${S.org} service representative.`,
`  • Contact us if you observe behaviour consistent with this advisory.`,
``,
`We will keep this notice updated on our Trust Center as remediation becomes available. ${c.input.cve?'This issue is tracked as '+c.input.cve+'.':''}`,
``,
`Sincerely,`,
`${(S.people.find(x=>x.fn==='ciso')||{}).name||'Chief Information Security Officer'}`,
`Chief Information Security Officer, ${S.org}`
    ].join('\n');
  }

  /* default: vendor bulletin */
  return [
`${S.org} Product Security Bulletin ${c.ref}`,
`${head}`,
``,
`Published: ${fmtDate(p.getTime())}   |   Severity: ${sev.label}${c.input.cvss?' ('+c.input.cvss+')':''}   |   ${c.input.cve||'No CVE assigned'}`,
``,
`SUMMARY`,
`${c.input.summary||'—'}`,
``,
`AFFECTED PRODUCTS`,
affectedTable(c),
``,
`IMPACT`,
`Successful exploitation could ${riskVerb(c)}. ${clinicalStatement(c)}`,
c.input.kev ? `This vulnerability appears on the CISA Known Exploited Vulnerabilities catalog.` : `Exploitation status at publication: ${c.input.exploit||'no known public exploit'}.`,
``,
`RESOLUTION`,
mitigationLines(c),
``,
`INTERIM MEASURES`,
workaroundLines(c),
``,
`PRODUCTS NOT AFFECTED`,
(c.excluded.length? c.excluded.map(x=>{const pp=S.products.find(y=>y.id===x.pid)||{};return '  • '+(pp.name||x.pid)+' — '+x.reason;}).join('\n') : '  • See the machine-readable VEX document accompanying this bulletin.'),
``,
`ACKNOWLEDGEMENT`,
`${creditLine(c)}`,
``,
`REFERENCES`,
`  • ${c.input.cve||'Internal tracking: '+c.ref}`,
`  • ${S.org} Trust Center — Security advisories`
  ].join('\n');
}
function riskVerb(c){
  const w = worstSafety(c);
  const cw = (c.input.cwe||'').toLowerCase();
  if(cw.includes('hard-coded')) return 'allow an attacker on the same network segment to authenticate to a service interface using a shared credential';
  if(cw.includes('overflow')) return 'corrupt memory in the process handling the affected input, and may allow execution of attacker-supplied code';
  if(cw.includes('injection')||cw.includes('expression')) return 'allow an unauthenticated attacker to execute arbitrary code in the context of the affected service';
  if(cw.includes('xml')) return 'allow a caller who supplies a document to read local files or cause the device to make outbound requests';
  if(cw.includes('less-secure')) return 'allow an attacker within radio range to establish an unauthenticated session during a pairing window';
  if(cw.includes('hash')) return 'allow an attacker with a forensic image of the device to recover locally stored data offline';
  return 'affect the confidentiality, integrity or availability of the affected product';
}
const slugOrg = ()=> S.org.toLowerCase().replace(/[^a-z0-9]+/g,'');

/* ============================================================
   STAGE 3 — DISCLOSURE DRAFT (Gate B)
   ============================================================ */
function screenDraft(c){
  return title('04','Disclosure draft','Start from a template, edit the wording, then route it. Every reviewer sees the same text and signs the version in front of them.')
  + modeBanner(c) + stageTools()
  + panel({key:'draft-template', need:!c.draft.generated, tone:'accent', title:'Choose a starting format',
      sub:'Each template is built from the case data you have already entered. Regenerating replaces the body text and clears the signatures.',
      body:'<div class="grid g3">'
        + TEMPLATES.map(t=>'<button class="choice" data-template="'+esc(t.id)+'" aria-pressed="'+(c.draft.template===t.id)+'"><b>'+esc(t.label)+'</b><span>'+esc(t.hint)+'</span></button>').join('')
        + '</div><div class="row" style="margin-top:14px">'
        + '<button class="btn primary" id="btnGenerate">'+(c.draft.generated?'Regenerate draft':'Generate draft')+'</button>'
        + '<button class="btn" id="btnAssist" data-tip="Adds a plain-language section that explains the finding to a non-technical reader. Wording only — nothing here changes a score or a decision.">Add plain-language summary</button>'
        + '<span class="tiny muted">Scores and decisions are never generated. Only wording is.</span></div>'})

  + (c.draft.generated
    ? panel({key:'draft-text', need:false, title:'Advisory text',
        sub:'Editable. Reviewers sign the text as it stands when they sign.',
        actions:'<button class="btn sm" id="btnCopyDraft">Copy</button>',
        body: fText('Advisory title','draft.title',c.draft.title,'The headline customers will see on the Trust Center.')
          + '<div class="field"><label>Body</label><textarea data-bind="draft.body" rows="22" style="font-family:var(--mono);font-size:11.5px;line-height:1.65">'+esc(c.draft.body)+'</textarea></div>'})
      + panel({key:'draft-gate', need:true, tone:'accent', title:'Gate B — cross-functional review',
        sub:'Privacy checks personal data. Legal checks obligations and wording. Regulatory decides what goes to FDA. Quality links the QMS record. Communications owns tone. The CISO or designee signs last.',
        body: reviewerPicker(c)
          + gateBlock(c,'gateB','Required signatures',
              'Each function approves the advisory text exactly as it currently reads. Approve everything at once from the bar above, or sign row by row here.'),
        foot:'<button class="btn primary big" id="btnGateB">'
          + (gateComplete(c,'gateB')?'Continue to communication plan →':(c.mode==='sim'?'Approve all and continue →':'Approve as '+esc(me().name.split(' ')[0])+' and continue →'))+'</button>'
          + '<div class="pop"><button class="btn ghost sm" data-goto="2">← Back to risk validation</button></div>'})
    : '<div class="empty"><b>No draft yet</b>Pick a format above and generate the first version.</div>');
}
function reviewerPicker(c){
  return '<div class="field"><label>Required reviewers <span class="tipmark" data-tip="Trim this list to the functions that genuinely need to sign for this case. A vulnerability with no personal data involved may not need Privacy, and removing them shortens the clock honestly rather than by skipping a step.">i</span></label>'
  + '<div class="row">'+Object.keys(FUNCTIONS).map(fn=>{
      const on = c.gateB.required.includes(fn);

      return '<button class="chip" data-req="gateB|'+fn+'" aria-pressed="'+on+'" style="'+(on?'background:var(--petrol);color:#fff;border-color:var(--petrol)':'')+'">'
        + (on?'✓ ':'+ ')+esc(FUNCTIONS[fn].label)+(person?' · '+esc(person.name.split(' ')[0]):'')+'</button>';
    }).join('')+'</div></div>';
}

/* ============================================================
   STAGE 4 — CHANNELS (Gate C)
   ============================================================ */
function suggestedChannels(c){
  const out = new Set(['ch-trust','ch-cust','ch-vex']);
  if(c.input.cve) out.add('ch-cve');
  if(c.input.kev || c.input.source==='cisa') out.add('ch-cisa');
  const w = worstSafety(c);
  const anyDevice = c.impacted.some(pid=>{ const p=S.products.find(x=>x.id===pid); return p && /Class/.test(p.devClass); });
  if((w==='moderate'||w==='serious') && anyDevice){ out.add('ch-fda'); out.add('ch-mdr'); }
  if(c.impacted.some(pid=>{const p=S.products.find(x=>x.id===pid);return p&&p.patientConnected;})) out.add('ch-hisac');
  if(c.impacted.some(pid=>(c.assess[pid]?.mitigations||[]).includes('m-hotfix'))) out.add('ch-field');
  return [...out];
}
function screenChannels(c){
  const sug = suggestedChannels(c);
  const reach = c.impacted.reduce((n,pid)=>{ const p=S.products.find(x=>x.id===pid); return n + (p?p.units:0); },0);
  return title('05','Communication plan','Decide exactly who is told, through which channel, and on what date. Publishing to the Trust Center without telling the named accounts is the failure mode auditors look for.')
  + '<div class="note"><span class="ic">◆</span><div><b>'+Number(reach).toLocaleString()+' installed units are in scope</b> across '+c.impacted.length+' product'+(c.impacted.length===1?'':'s')+'. Recommended channels are calculated from exploitation status, patient impact, and whether an FDA-regulated device is involved.</div></div>'
  + stageTools()
  + panel({key:'ch-list', need:!c.channels.length, tone:'accent', title:'Channels',
      sub:'Lead time is what each channel needs before the advisory can go out through it. The longest lead time sets your publication date.',
      actions:'<button class="btn sm" id="btnApplySuggested">Apply recommended</button>',
      body:'<div class="grid g2">'
        + CHANNELS.map(ch=>{
            const on = c.channels.includes(ch.id);
            const rec = sug.includes(ch.id);
            const target = new Date(caseNow(c) + ch.lead*DAY);
            return '<button class="choice" data-channel="'+esc(ch.id)+'" aria-pressed="'+on+'" style="padding:13px 14px">'
              + '<div class="row" style="justify-content:space-between;width:100%">'
              +   '<span class="badge '+(on?'b-info':'b-neutral')+'">'+esc(ch.req)+'</span>'
              +   (rec?'<span class="badge b-med">recommended</span>':'')+'</div>'
              + '<b style="font-size:13px">'+(on?'✓ ':'')+esc(ch.label)+'</b>'
              + '<span>'+esc(ch.tip)+'</span>'
              + '<span style="color:var(--ink-2);font-weight:600">Ready '+fmtDate(target.getTime())+(ch.lead?' · '+ch.lead+'-day lead':' · same day')+'</span></button>';
          }).join('')
        + '</div>'
        + fArea('Coordination notes','channelNotes',c.channelNotes,'Embargo dates agreed with the reporter or a coordinator, customer briefing calls, and anything that constrains the publication moment.')})

  + panel({key:'ch-gate', need:!!c.channels.length, tone:'accent', title:'Gate C — release authorisation',
      sub:'The CISO or designee and Regulatory Affairs authorise release. This is the last point at which the disclosure can be held.',
      body: gateBlock(c,'gateC','Required signatures','Approve both at once from the bar above, or sign row by row here.'),
      foot:'<button class="btn primary big" id="btnGateC" '+(c.channels.length?'':'disabled')+'>'
        + (gateComplete(c,'gateC')?'Continue to send →':(c.mode==='sim'?'Authorise and continue →':'Authorise as '+esc(me().name.split(' ')[0])+' and continue →'))+'</button>'
        + (c.channels.length?'':'<span class="tiny muted">Select at least one channel.</span>')
        + '<div class="pop"><button class="btn ghost sm" data-goto="3">← Back to draft</button></div>'});
}

/* ============================================================
   STAGE 5 — COMMUNICATE
   ============================================================ */
function screenSend(c){
  const rows = c.channels.map(id=> CHANNELS.find(x=>x.id===id)).filter(Boolean);
  const sent = c.comms.length;
  const out = outstandingChannels(c);
  const picked = pickList(c);
  const deferred = c.deferred||[];
  const canPublish = out.length===0;

  return title('06','Send and record','Each send is timestamped and kept. Tick the channels you are ready to act on — the rest stay queued until you are, or you can defer one out of the plan with a reason.')
  + stageTools()
  + panel({key:'send-queue', need:true, tone:'accent'+(canPublish?'-ok':''), title:'Outbound queue',
      sub: sent+' sent · '+out.length+' still to send'+(deferred.length? ' · '+deferred.length+' deferred':'')
         + (out.length? ' · '+picked.length+' ticked' : ''),
      actions: out.length
        ? '<button class="btn sm" data-act="pickall|1" data-tip="Tick every channel that has not been sent">Select all</button>'
        + '<button class="btn sm" data-act="pickall|0" data-tip="Untick everything, then choose the ones you want to act on">Clear</button>'
        + '<button class="btn sm primary" data-act="sendsel" '+(picked.length?'':'disabled')+'>Send '+picked.length+' selected</button>'
        : '',
      body:'<div class="tbl-wrap"><table class="tbl">'
        + '<thead><tr><th style="width:38px">'+(out.length?'<span class="tiny muted">act</span>':'')+'</th>'
        + '<th>Channel</th><th>Audience</th><th>Recipients</th><th>Status</th><th style="width:150px"></th></tr></thead><tbody>'
        + rows.map(ch=>{
            const rec = c.comms.find(x=>x.ch===ch.id);
            const def = deferred.find(x=>x.ch===ch.id);
            const on = picked.includes(ch.id);
            return '<tr'+(def?' style="opacity:.55"':'')+'>'
            + '<td>'+(rec||def ? '' :
                '<input type="checkbox" data-pick="'+esc(ch.id)+'" '+(on?'checked':'')
                + ' aria-label="Send '+esc(ch.label)+' in this pass">')+'</td>'
            + '<td><b>'+esc(ch.label)+'</b><div class="tiny muted">'+esc(ch.tip.split('.')[0])+'.</div>'
            +   (def?'<div class="tiny" style="color:var(--warn)">Deferred — '+esc(def.reason)+'</div>':'')+'</td>'
            + '<td><span class="badge b-neutral">'+esc(ch.req)+'</span></td>'
            + '<td class="tiny">'+esc(audienceFor(c,ch))+'</td>'
            + '<td>'+(rec?'<span class="badge b-low">sent '+fmtDateTime(rec.ts)+'</span>'
                    : def?'<span class="badge b-med">deferred</span>'
                    : '<span class="badge b-med">queued</span>')+'</td>'
            + '<td>'+(rec
                ? '<button class="btn ghost xs" data-viewcomm="'+esc(ch.id)+'">View</button>'
                : def
                ? '<button class="btn ghost xs" data-act="undefer|'+esc(ch.id)+'">Put back</button>'
                : '<button class="btn sm" data-send="'+esc(ch.id)+'">Send now</button>'
                + '<button class="btn ghost xs" data-act="defer|'+esc(ch.id)+'" data-tip="Take this channel out of the plan with a reason, so the case can close without it.">Defer</button>')
            + '</td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + (out.length
          ? '<div class="note" style="margin:14px 0 0"><span class="ic">◆</span><div>Ticked channels go out together when you press <b>Send '+picked.length+' selected</b> or the Next button above. Anything you leave unticked stays queued — the case cannot be published until every channel has been sent or deferred.</div></div>'
          : '<div class="note ok" style="margin:14px 0 0"><span class="ic">✓</span><div>Every channel is accounted for. Publishing records the disclosure date and closes the case.</div></div>'),
      foot:'<button class="btn primary big" id="btnPublish" '+(canPublish?'':'disabled')+'>Publish to Trust Center and close →</button>'
        + '<span class="tiny muted">'+(canPublish
            ? 'Records the disclosure date and freezes the case.'
            : out.length+' channel'+(out.length===1?'':'s')+' still to send or defer.')+'</span>'
        + '<div class="pop"><button class="btn ghost sm" data-goto="4">← Back to channels</button></div>'});
}
function audienceFor(c, ch){
  const units = c.impacted.reduce((n,pid)=>{ const p=S.products.find(x=>x.id===pid); return n+(p?p.units:0); },0);
  return {
    'ch-trust':'Public — Trust Center advisory page',
    'ch-cust':Number(units).toLocaleString()+' installed units across named accounts',
    'ch-cisa':'CISA vulnerability coordination',
    'ch-fda':'FDA CDRH',
    'ch-hisac':'Health-ISAC members (TLP:AMBER)',
    'ch-cve':'CVE registry / CNA record',
    'ch-vex':'Customer SBOM tooling (CSAF VEX)',
    'ch-field':'Field service organisation',
    'ch-mdr':'Internal QMS complaint record'
  }[ch.id] || '—';
}

/* ============================================================
   STAGE 6 — CLOSED
   ============================================================ */
function screenClosed(c){
  const days = elapsedDays(c);
  const ok = days <= FDA_WINDOW_DAYS;
  const closedByGateA = c.decision==='close';
  return title('07', closedByGateA?'Closed at Gate A':'Disclosed and closed',
      closedByGateA
        ? 'The case ended at risk validation. The decision, the reasoning and both signatures are kept — that record is the deliverable.'
        : 'The advisory is published and every channel is recorded. This page is the case record.')
  + '<div class="grid g3" style="margin-bottom:16px">'
  + statCard('Total elapsed', fmtDur(elapsedMs(c)), days.toFixed(1)+' days from awareness', ok?'ok':'crit')
  + statCard('30-day target', ok?'Met':'Missed', ok?(FDA_WINDOW_DAYS-days).toFixed(1)+' days to spare':Math.abs(FDA_WINDOW_DAYS-days).toFixed(1)+' days over', ok?'ok':'crit')
  + statCard(closedByGateA?'Outcome':'Channels used', closedByGateA?'Risk accepted':String(c.comms.length), closedByGateA?'VEX statement published':'communications recorded','info')
  + '</div>'
  + stageTools()
  + panel({key:'closed-time', need:true, tone:'accent'+(ok?'-ok':'-crit'), title:'Where the time went',
      sub:'Each stage measured from the moment it opened to the moment it was signed out.',
      body:'<div class="tbl-wrap"><table class="tbl">'
        + '<thead><tr><th>Stage</th><th>Opened</th><th>Signed out</th><th>Duration</th><th>Share of clock</th></tr></thead><tbody>'
        + STAGES.slice(0,6).map((st,i)=>{
            const d = stageDuration(c,i); if(d==null) return '<tr><td>'+esc(st.t)+'</td><td colspan="4" class="tiny muted">not entered</td></tr>';
            const pct = elapsedMs(c)? (d/elapsedMs(c)*100):0;
            return '<tr><td><b>'+esc(st.t)+'</b></td><td class="tiny">'+fmtDateTime(c.enter[i])+'</td><td class="tiny">'+fmtDateTime(c.exit[i])+'</td>'
            + '<td class="num">'+fmtDur(d)+'</td><td><div class="meter" style="width:140px"><i style="width:'+clamp(pct,0,100).toFixed(1)+'%;background:var(--petrol-lt)"></i></div>'
            + '<span class="tiny muted">'+pct.toFixed(0)+'%</span></td></tr>';
          }).join('')
        + '</tbody></table></div>'})
  + panel({key:'closed-record', title:'Decision record', sub:'Every signature captured, with the time it was given.',
      body: signRecap(c,'gateA','Gate A — risk validation')
        + (closedByGateA?'':signRecap(c,'gateB','Gate B — disclosure review'))
        + (closedByGateA?'':signRecap(c,'gateC','Gate C — release authorisation'))
        + (c.decisionRationale?'<div class="note warn"><span class="ic">!</span><div><b>Departure from the calculated recommendation.</b> '+esc(c.decisionRationale)+'</div></div>':'')
        + ((c.deferred||[]).length
          ? '<div class="divider"></div><span class="eyebrow">Channels deferred out of the plan</span>'
            + '<div class="tbl-wrap" style="margin-top:6px"><table class="tbl"><tbody>'
            + c.deferred.map(x=>'<tr><td style="width:220px"><b>'+esc((CHANNELS.find(y=>y.id===x.ch)||{}).label||x.ch)+'</b></td>'
              + '<td>'+esc(x.reason)+'</td><td style="width:150px" class="tiny">'+fmtDateTime(x.ts)+'</td></tr>').join('')
            + '</tbody></table></div>'
            + '<p class="tiny muted" style="margin-top:7px">A channel that was authorised but not used is the first thing an auditor asks about. The reason recorded at the time is the answer.</p>'
          : ''),
      foot:'<button class="btn primary" id="btnExportCase">Export case record (JSON)</button>'
        + (closedByGateA?'<button class="btn" id="btnExportVex">Export VEX statement</button>':'<button class="btn" id="btnExportAdvisory">Export advisory (text)</button>')
        + '<button class="btn" id="btnNewCase">Start another case</button>'
        + '<div class="pop"><button class="btn ghost sm" data-view="trust">View on Trust Center →</button></div>'});
}
function statCard(l,v,s,tone){
  return '<div class="card" style="margin:0"><div class="card-bd"><span class="eyebrow">'+esc(l)+'</span>'
  + '<div style="font-size:24px;font-weight:700;letter-spacing:-.02em;color:'+({ok:'var(--ok)',crit:'var(--crit)',info:'var(--ink)'}[tone])+'" class="num">'+esc(v)+'</div>'
  + '<div class="tiny muted">'+esc(s)+'</div></div></div>';
}
function signRecap(c, gate, label){
  const rows = requiredSigners(c, gate);
  if(!rows.some(r=>r.sign)) return '';
  return '<div style="margin-bottom:14px"><span class="eyebrow">'+esc(label)+'</span>'
  + '<div class="tbl-wrap" style="margin-top:6px"><table class="tbl"><tbody>'
  + rows.map(r=>'<tr><td style="width:190px">'+esc((FUNCTIONS[r.fn]||{}).label||r.fn)+'</td>'
      + '<td>'+esc(r.sign?r.sign.name:'—')+(r.sign&&r.sign.comment?'<div class="tiny muted">'+esc(r.sign.comment)+'</div>':'')+'</td>'
      + '<td style="width:150px" class="tiny">'+(r.sign?fmtDateTime(r.sign.ts):'not signed')+'</td>'
      + '<td style="width:100px">'+(r.sign?'<span class="badge '+(r.sign.decision==='approved'?'b-low':'b-crit')+'">'+(r.sign.decision==='approved'?'Approved':'Objection')+'</span>':'')+'</td></tr>').join('')
  + '</tbody></table></div></div>';
}

/* ---------- exports ---------- */
function download(name, text, type){
  const b = new Blob([text], {type:type||'text/plain;charset=utf-8'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 400);
}
function vexDocument(c){
  return {
    document:{category:'csaf_vex', csaf_version:'2.0', title:(c.input.title||c.ref),
      publisher:{category:'vendor', name:S.org}, tracking:{id:c.ref, status:'final',
      initial_release_date:new Date(c.publishedAt||c.closedAt||caseNow(c)).toISOString()}},
    product_tree:{full_product_names: S.products.map(p=>({product_id:p.id, name:p.name+' '+p.version}))},
    vulnerabilities:[{
      cve: c.input.cve||undefined, notes:[{category:'description', text:c.input.summary}],
      product_status:{
        known_affected: c.impacted,
        known_not_affected: c.excluded.map(x=>x.pid),
        fixed: c.impacted.filter(pid=>c.assess[pid]?.fixVersion)
      },
      flags: c.excluded.map(x=>({label:'vulnerable_code_not_present', product_ids:[x.pid], description:x.reason})),
      remediations: c.impacted.map(pid=>({category:'vendor_fix', product_ids:[pid],
        details:(c.assess[pid]?.fixVersion? 'Update to '+c.assess[pid].fixVersion : 'Fix pending'),
        date: c.assess[pid]?.fixEta||undefined}))
    }]
  };
}

function medianDisclose(list){
  if(!list.length) return '—';
  const v = list.map(c=>elapsedDays(c)).sort((a,b)=>a-b);
  const m = v.length%2 ? v[(v.length-1)/2] : (v[v.length/2-1]+v[v.length/2])/2;
  return m.toFixed(1)+' d';
}
function pctWithin(list){
  if(!list.length) return '—';
  return Math.round(list.filter(c=>elapsedDays(c)<=FDA_WINDOW_DAYS).length/list.length*100)+'%';
}

    const c = activeCase();

    if(r.cvss) c.input.cvss = r.cvss;
    if(r.vector) c.input.vector = r.vector;

    if(r.components.length) c.input.affects = r.components.map(n=>({n, introduced:'', fixed:''}));
    logEvent(c,'open','Advisory text parsed: '+[r.cve,r.cvss?('CVSS '+r.cvss):'',r.components.length+' component(s)'].filter(Boolean).join(', '));
    save(); closeModal(); render();

function parseAdvisory(t){
  const cve = (t.match(/CVE-\d{4}-\d{4,7}/i)||[''])[0].toUpperCase();
  const vector = (t.match(/CVSS:3\.[01]\/[A-Z:\/]+/i)||[''])[0];
  let cvss = (t.match(/base\s*score[^0-9]{0,12}(\d{1,2}\.\d)/i)||[])[1] || '';
  if(!cvss) cvss = (t.match(/\b(\d{1,2}\.\d)\s*\((?:critical|high|medium|low)\)/i)||[])[1] || '';
  if(!cvss) cvss = (t.match(/cvss[^\n]{0,60}?\b(\d{1,2}\.\d)\b(?!\/)/i)||[])[1] || '';
  if(cvss && parseFloat(cvss)>10) cvss='';
  const cwe = (t.match(/CWE-\d+[^\n,.]{0,60}/i)||[''])[0];
  const known = [...new Set(S.products.flatMap(p=>p.sbom.map(x=>x.n)))];
  const low = t.toLowerCase();
  const components = known.filter(n=> low.includes(n.toLowerCase()));
  const firstLine = (t.trim().split('\n').find(l=>l.trim().length>18)||'').trim().slice(0,140);
  return {cve, vector, cvss, cwe, components, title:firstLine};
}

function makeProduct(r){
  return {
    id: uid('p'), name: r.name, short: r.name.length>28 ? r.name.slice(0,26)+'…' : r.name,
    line:'Unassigned', devClass:'Unclassified', patientConnected:false, lifeSustaining:false,
    version: r.version || '1.0', units: 0, exposure:'Not stated',
    care:'Not stated — open the product record to describe how it is used clinically.',
    sbom: r.sbom
  };
}
function parseProductLines(txt){
  return String(txt).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts = l.split('|').map(x=>x.trim());
    const name = parts[0];
    const version = parts[1] || '';
    const sbom = (parts[2]||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{
      const m = x.match(/^(.*?)[\s@]+([0-9][^\s]*)$/);
      return m ? {n:m[1].trim(), v:m[2], eco:'other', use:'runtime', role:'Component'}
               : {n:x, v:'0', eco:'other', use:'runtime', role:'Component'};
    });
    return name ? {name, version, sbom} : null;
  }).filter(Boolean);
}
function parseProductsJSON(txt){
  try{
    let j = JSON.parse(txt);
    if(j && j.products) j = j.products;
    if(!Array.isArray(j)) return [];
    return j.map(p=>({
      name: p.name || p.product || p.short || '',
      version: p.version || p.ver || '',
      sbom: (p.sbom || p.components || []).map(x=>({
        n: x.n || x.name || String(x), v: x.v || x.version || '0',
        eco: x.eco || 'other', use:'runtime', role: x.role || 'Component'}))
    })).filter(p=>p.name);
  }catch(e){ return []; }
}
function parseProductsCSV(txt){
  const lines = String(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const head = lines[0].toLowerCase().split(',').map(x=>x.trim());
  const hasHeader = head.some(h=>/product|name/.test(h));
  const idx = {
    name: hasHeader ? head.findIndex(h=>/product|name/.test(h) && !/component/.test(h)) : 0,
    version: hasHeader ? head.findIndex(h=>/^version|product version/.test(h)) : 1,
    comp: hasHeader ? head.findIndex(h=>/component|library|package/.test(h)) : 2,
    compv: hasHeader ? head.findIndex(h=>/component version|comp version|dep version/.test(h)) : 3
  };
  const out = new Map();
  lines.slice(hasHeader?1:0).forEach(l=>{
    const cells = l.split(',').map(x=>x.trim());
    const name = cells[idx.name>=0?idx.name:0]; if(!name) return;
    if(!out.has(name)) out.set(name, {name, version: idx.version>=0?(cells[idx.version]||''):'', sbom:[]});
    const cn = idx.comp>=0 ? cells[idx.comp] : '';
    if(cn) out.get(name).sbom.push({n:cn, v: (idx.compv>=0?cells[idx.compv]:'') || '0', eco:'other', use:'runtime', role:'Component'});
  });
  return [...out.values()];
}

/* ============================================================
   CVD Console — "what to do now" bar, overrides, help menu, outbox
   ============================================================ */

function allAssessed(c){ return c.impacted.length>0 && c.impacted.every(pid=> assessComplete(c.assess[pid])); }
function outstandingOf(c, gate){
  return requiredSigners(c, gate).filter(r=> !r.sign || r.sign.decision!=='approved');
}
function outstandingText(c, gate){
  const o = outstandingOf(c, gate);
  if(!o.length) return 'Every required signature is in.';
  return 'Waiting on ' + o.map(r=> ((FUNCTIONS[r.fn]||{}).label||r.fn) + (r.person? ' ('+r.person.name+')':' — nobody assigned')).join(', ') + '.';
}
function btn(label, act, cls, tip){
  return '<button class="btn '+(cls||'')+'" data-act="'+esc(act)+'"'+(tip?' data-tip="'+esc(tip)+'"':'')+'>'+esc(label)+'</button>';
}

function nextAction(c){
  if(!c) return {icon:'▸', tone:'', title:'Start a case', detail:'Load one of the six sample reports to watch the whole process run, or log a real report manually.', btns:''};
  const sim = c.mode==='sim';

  if(c.stage===0){
    if(intakeReady(c)) return {icon:'1', title:'Intake is complete — run the impact analysis',
      detail:'This matches the affected component and version range against every product SBOM in the portfolio.',
      btns: btn('Run impact analysis →','toImpact','primary')};
    const missing = [];
    if(!c.input.title) missing.push('a title');
    if(!c.input.reportedAt) missing.push('the date you became aware');
    if(!(c.input.affects||[]).some(a=>a.n && a.n.trim())) missing.push('at least one affected component');
    return {icon:'1', tone:'wait', title:'Finish the intake before continuing',
      detail:'Still needed: '+missing.join(', ')+'. Everything else can be filled in later.',
      btns: btn('Parse a pasted advisory','parse','') };
  }

  if(c.stage===1){
    if(c.impacted.length) return {icon:'2', title:c.impacted.length+' product'+(c.impacted.length===1?' is':'s are')+' in scope',
      detail:'Uncheck anything that carries the component but never reaches the vulnerable code — you will be asked for a justification, which becomes the VEX statement.',
      btns: btn('Validate risk on '+c.impacted.length+' product'+(c.impacted.length===1?'':'s')+' →','toRisk','primary')
          + btn('Nothing is affected — close','noimpact','')};
    return {icon:'2', tone:'wait', title:'No product is in scope',
      detail:'Either the SBOM match was empty or you removed every product. Check the component name and version range, or close the case with a "not affected" statement.',
      btns: btn('Back to intake','goto|0','') + btn('Close the case','noimpact','')};
  }

  if(c.stage===2){
    if(!allAssessed(c)){
      const n = c.impacted.filter(pid=>!assessComplete(c.assess[pid])).length;
      return {icon:'3', tone:'wait', title:'Assess '+n+' product'+(n===1?'':'s')+' before Gate A opens',
        detail:'Each product needs reachability, attack path, patient impact, and at least one mitigation. The panel that needs you is open below.',
        btns: (sim? btn('Fill with a sample assessment','autofill','primary','Simulation only. Fills every open product with a plausible assessment so you can keep moving.') : '')
            + btn('Open the next incomplete product','openneed','')};
    }
    if(!c.decision){
      const rec = recommendation(c);
      const recLabel = rec.verdict==='disclose' ? 'escalate to disclosure' : 'close the case';
      if(sim) return {icon:'3', title:'Make the Gate A decision',
        detail:'The calculation recommends: '+recLabel+'. Take the recommendation in one step, or choose the other route and record why.',
        btns: btn('Accept — '+recLabel+' and sign Gate A →','acceptrec','primary','Sets the decision to the calculated recommendation, applies both signatures as a simulated override, and opens the next stage.')
            + btn('Escalate instead','decide|escalate','') + btn('Close instead','decide|close','')};
      return {icon:'3', title:'Make the Gate A decision',
        detail:'The calculation recommends: '+recLabel+'. You can depart from it, but you will be asked to record why.',
        btns: btn('Escalate to disclosure','decide|escalate','primary') + btn('Close — risk accepted','decide|close','')};
    }
    return gateAction(c,'gateA',3,'3','Gate A — Security and Product sign-off', c.decision==='close'?'Closing the case still needs both signatures.':'Both representatives attest to the assessment and the decision to disclose.');
  }

  if(c.stage===3){
    if(!c.draft.generated) return {icon:'4', tone:'wait', title:'Generate the advisory draft',
      detail:'Pick a format below and the draft is built from the case data you have already entered. You can edit every word afterwards.',
      btns: btn('Generate draft','generate','primary')};
    return gateAction(c,'gateB',4,'4','Gate B — cross-functional review','Each function approves the advisory text exactly as it currently reads. Regenerating the draft clears these signatures.');
  }

  if(c.stage===4){
    if(!c.channels.length) return {icon:'5', tone:'wait', title:'Choose where the disclosure goes',
      detail:'Recommended channels are calculated from exploitation status, patient impact, and whether an FDA-regulated device is involved.',
      btns: btn('Apply recommended channels','applychannels','primary')};
    return gateAction(c,'gateC',5,'5','Gate C — release authorisation','The CISO or designee and Regulatory Affairs authorise release. This is the last point at which the disclosure can be held.');
  }

  if(c.stage===5){
    const out = outstandingChannels(c);
    const picked = pickList(c);
    if(out.length){
      const all = picked.length === out.length || picked.length === 0;
      return {icon:'6', title:out.length+' channel'+(out.length===1?'':'s')+' still to send',
        detail: (picked.length===0
            ? 'Nothing is ticked in the queue below, so Next will send all '+out.length+'. Tick individual channels if you want to act on only some of them. '
            : 'Tick the channels you are ready to act on in the queue below — '+picked.length+' of '+out.length+' selected. ')
          +'Anything you are not sending needs to be deferred with a reason before the case can be published. '
          +'Release was already authorised at Gate C.',
        btns: (all
                ? btn('Send all '+out.length+' and publish →','sendpublish','primary','Sends every outstanding channel, records the disclosure date, and closes the case.')
                : btn('Send '+picked.length+' selected →','sendsel','primary','Sends only the channels you have ticked. The rest stay queued.'))
            + (all ? btn('Send without publishing','sendsel','') : btn('Send all and publish','sendpublish',''))
            + btn('Select all','pickall|1','')};
    }
    return {icon:'6', title:'Everything is sent — publish and close',
      detail:'Records the disclosure date, freezes the case, and puts the advisory on the Trust Center.',
      btns: btn('Publish and close →','publish','primary')};
  }

  return {icon:'✓', tone:'done', title: c.decision==='close' ? 'Closed at Gate A — no disclosure required' : 'Disclosed and closed',
    detail:'Total elapsed '+fmtDur(elapsedMs(c))+' ('+elapsedDays(c).toFixed(1)+' days of the '+FDA_WINDOW_DAYS+'-day window). The record below is the deliverable.',
    btns: btn('Export case record','exportcase','') + btn('Start another case','newcase','')};
}

function gateAction(c, gate, next, icon, heading, blurb){
  const g = STAGES[c.stage].gate || gate;
  if(gateHasRejection(c, gate)){
    const who = requiredSigners(c,gate).filter(r=>r.sign&&r.sign.decision==='rejected');
    return {icon:'!', tone:'blocked', title:g+' is held by an objection',
      detail: who.map(r=>((FUNCTIONS[r.fn]||{}).label)+' objected'+(r.sign.comment?': “'+r.sign.comment+'”':'.')).join(' ')
        + ' The process cannot advance until the objection is withdrawn and the signature re-taken.',
      btns: btn('Withdraw objections','withdraw|'+gate,'') + btn('Notify the case team','notify|'+gate,'')};
  }
  if(gateComplete(c, gate)) return {icon, tone:'done', title:g+' is signed — continue',
    detail:'All '+(c[gate].required||[]).length+' signatures are in. '+blurb,
    btns: btn('Continue to '+STAGES[next].t.toLowerCase()+' →','continue|'+gate+'|'+next,'primary')};

  const out = outstandingOf(c, gate);
  const mine = out.find(r=> r.person && r.person.id===S.meId);
  return {icon, tone:'wait', title: g+' needs '+out.length+' more signature'+(out.length===1?'':'s'),
    detail: outstandingText(c, gate)+' '+blurb,
    outstanding: out,
    btns: (c.mode==='sim'
            ? btn('Approve all and continue →','override|'+gate+'|'+next+'|approve','primary','Simulation only. Applies every outstanding signature as an override recorded against you, then opens the next stage.')
            : btn('Override — approve as '+me().name.split(' ')[0]+' →','override|'+gate+'|'+next+'|approve','primary','Records a single override approval against you for every outstanding function, with a reason. Use when you hold delegated authority or the process must not stall.'))
        + (mine? btn('Sign as '+((FUNCTIONS[mine.fn]||{}).label)+'','signme|'+gate+'|'+mine.fn,'ok') : '')
        + btn('Reject / raise an objection','override|'+gate+'|'+next+'|reject','danger')
        + btn('Notify the '+out.length+' outstanding','notify|'+gate,'','Queues a Slack, Teams and email notification for each person who has not signed.')};

/* ---------- overrides ---------- */
function overrideGate(gate, next, decision){
  const c = activeCase(); if(!c) return;
  const p = me();
  const out = outstandingOf(c, gate);
  const apply = (reason)=>{
    if(decision==='approve'){
      out.forEach(r=> applySignature(c, gate, r.fn, 'approved',
        p.name+' (override)', reason || (c.mode==='sim'?'Approved in Simulation mode by override.':'Override approval.')));
      logEvent(c,'gate', p.name+' overrode '+out.length+' outstanding signature'+(out.length===1?'':'s')+' at '+gate.replace('gate','Gate ')+'.', p.name);
      save();
      advanceGate(gate, next);
    } else {
      const first = out[0] || requiredSigners(c,gate)[0];
      applySignature(c, gate, first.fn, 'rejected', p.name+' (override)', reason||'Objection raised by override.');
      if(S.notify.auto) queueNotification(c,'objection', null, {comment:reason||''});
      save(); render();
      toast('Objection recorded. The gate is held until it is withdrawn.','warn');
    }
  };
  if(c.mode==='sim' && decision==='approve'){ apply(''); return; }
  openModal('<div class="modal-hd"><h3>'+(decision==='approve'?'Override approval':'Raise an objection')+'</h3>'
    + '<div class="pop"><button class="btn ghost sm" data-close>✕</button></div></div>'
    + '<div class="modal-bd">'
    + '<div class="note '+(decision==='approve'?'warn':'crit')+'"><span class="ic">!</span><div>'
    +   (decision==='approve'
        ? 'This records <b>'+esc(p.name)+'</b> as approving on behalf of '+out.length+' outstanding function'+(out.length===1?'':'s')+': '
          + esc(out.map(r=>(FUNCTIONS[r.fn]||{}).label).join(', '))+'. It is kept in the record as an override, not as their own signature.'
        : 'This holds the gate. The case cannot advance until the objection is withdrawn and the signature re-taken.')
    + '</div></div>'
    + '<div class="field"><label>Reason</label><textarea id="ov-reason" rows="3" data-autofocus placeholder="'
    + (decision==='approve'?'Delegated authority, agreed at the disclosure call, or why waiting is not acceptable':'What needs to change before you would approve')+'"></textarea></div>'
    + '</div><div class="modal-ft"><button class="btn" data-close>Cancel</button>'
    + '<button class="btn '+(decision==='approve'?'ok':'danger')+'" id="ov-go">'+(decision==='approve'?'Record override and continue':'Record objection')+'</button></div>');
  $('#ov-go').onclick = ()=>{
    const r = ($('#ov-reason').value||'').trim();
    if(!r){ toast('A reason is required when you override a gate.','warn'); return; }
    closeModal(); apply(r);
  };
}
function withdrawObjections(gate){
  const c = activeCase();
  (c[gate].required||[]).forEach(fn=>{ if(c[gate].signs[fn] && c[gate].signs[fn].decision==='rejected') delete c[gate].signs[fn]; });
  logEvent(c,'alert','Objections withdrawn at '+gate.replace('gate','Gate ')+'.');
  save(); render(); toast('Objections withdrawn. The gate is open for signature again.','ok');
}
function autofillAssessments(){
  const c = activeCase();
  c.impacted.forEach(pid=>{
    const p = S.products.find(x=>x.id===pid)||{};
    const a = c.assess[pid] || (c.assess[pid]=blankAssessment(pid));
    if(!a.reach || a.reach==='unknown') a.reach = 'confirmed';
    if(!a.path) a.path = /internet|SaaS/i.test(p.exposure||'') ? 'internet'
                       : /Bluetooth|radio/i.test(p.exposure||'') ? 'adjacent'
                       : /isolated|VPN/i.test(p.exposure||'') ? 'isolated' : 'clinical';
    if(!a.safety) a.safety = p.lifeSustaining ? 'serious' : p.patientConnected ? 'moderate' : 'minor';
    if(!(a.mitigations||[]).length) a.mitigations = ['m-patch','m-network'];
    if(!a.usage) a.usage = 'Simulated assessment: the component is called on the '+(p.exposure||'device')+' interface during normal operation.';
    if(!a.workaround) a.workaround = 'Restrict the affected interface to trusted network segments until the update is applied.';
    if(!a.fixVersion) a.fixVersion = bumpVersion(p.version);
  });
  logEvent(c,'gate','Sample assessment applied to '+c.impacted.length+' product'+(c.impacted.length===1?'':'s')+' (Simulation mode).');
  save(); render();
  toast('Sample assessment applied. Review the values, then make the Gate A decision.','ok');
}
function bumpVersion(v){
  const m = String(v||'1.0').match(/(\d+)(?!.*\d)/);
  return m ? String(v).slice(0,m.index)+(parseInt(m[1],10)+1)+String(v).slice(m.index+m[1].length) : '1.1';
}

  const c = activeCase();

}

/* ============================================================
   Auto-run — simulation only
   ============================================================ */
let autoRunning = false;
let autoTimer = null;

function startAutoRun(){
  const c = activeCase();
  if(!c){ toast('Open a case first.','warn'); return; }
  if(c.mode!=='sim'){ toast('Auto-run is a simulation feature. Switch the playbook to Simulation to use it.','warn'); return; }
  autoRunning = true;
  render();
  toast('Running the case. It will pause if it needs a decision only you can make.','ok');
  autoTimer = setTimeout(autoTick, 500);
}
function stopAutoRun(msg){
  autoRunning = false;
  clearTimeout(autoTimer); autoTimer = null;
  render();
  if(msg) toast(msg, 'info');
}
function autoTick(){
  if(!autoRunning) return;
  const c = activeCase();
  if(!c || c.closedAt){ autoRunning=false; render(); toast('The case ran to completion. The closing record is below.','ok'); return; }
  const a = nextAction(c);
  let act = primaryAct(a);
  if(!act){ stopAutoRun('Paused — this step needs a choice from you. The action bar explains what is outstanding.'); return; }
  /* follow the calculated recommendation rather than always escalating */
  if(act.indexOf('decide|')===0){
    const rec = recommendation(c);
    act = 'decide|' + (rec.verdict==='disclose' ? 'escalate' : 'close');
  }
  runAct(act);
  if(autoRunning) autoTimer = setTimeout(autoTick, 850);
}

const GATE_OF_STAGE = {2:'gateA', 3:'gateB', 4:'gateC'};

function loadSample(key){
  const s = SAMPLE_INPUTS.find(x=>x.key===key); if(!s) return;
  const c = newCase();
  const d = new Date(Date.now() + s.reportedAt*DAY);
  c.input = {
    source:s.source, sourceDetail:s.sourceDetail,
    reportedAt: d.toISOString().slice(0,10),
    cve:s.cve, title:s.title, cvss:String(s.cvss), vector:s.vector, cwe:s.cwe,
    epss:String(s.epss), kev:s.kev, exploit:s.exploit, summary:s.summary,
    affects: s.affects.map(a=>({n:a.n, introduced:a.introduced, fixed:a.fixed}))
  };
  c.draft.title = s.title;
  logEvent(c,'open','Sample report loaded: '+s.title);
  S.railSec.trigger = true;
  if(c.mode==='live') notifyTrigger(c);
  save(); S.view='work'; render();
  /* the report that started the case is shown before anything else */
  dlgTrigger(c.id);
}

function goStage(c, to){
  if(to===1 && !c.impacted.length){
    const m = matchProducts(c);
    c.impacted = m.filter(x=>!c.excluded.find(e=>e.pid===x.product.id)).map(x=>x.product.id);
  }
  advanceStage(c, to);
  logEvent(c,'gate','Moved to '+STAGES[to].t+'.');
  if(GATE_OF_STAGE[to]) notifyGate(c, GATE_OF_STAGE[to]);
  save(); render();
}

function advanceGate(gate, nextStage){
  const c = activeCase(); if(!c) return;
  if(c.mode==='sim') autoSignGate(c, gate);
  if(gateHasRejection(c, gate)){ toast('An objection is recorded. Withdraw it before the gate can open.','crit'); render(); return; }
  if(!gateComplete(c, gate)){ toast('Every required signature is needed before this gate opens.','warn'); render(); return; }
  logEvent(c,'gate', gate.replace('gate','Gate ')+' cleared with '+(c[gate].required||[]).length+' signatures.');
  if(S.notify.auto) queueNotification(c,'gate-cleared', null, {gate:gate.replace('gate','Gate ')});

  if(gate==='gateA' && c.decision==='close'){
    advanceStage(c, 6);
    c.closedAt = caseNow(c);
    logEvent(c,'gate','Case closed at Gate A. VEX statement is the artifact of record.');
    if(S.notify.auto) queueNotification(c,'closed', null, {});
    save();
    toast('Case closed. The VEX statement is available on the closing screen.','ok');
  } else {
    advanceStage(c, nextStage);
    if(GATE_OF_STAGE[nextStage]) notifyGate(c, GATE_OF_STAGE[nextStage]);
    save();
    toast(STAGES[nextStage].t+' is now open.','ok');
  }
  render();
}
function pushGate(gate, next){
  const c = activeCase(); if(!c) return;
  if(gateHasRejection(c, gate)){ toast('An objection is holding this gate. Withdraw it first.','crit'); return; }
  if(gateComplete(c, gate)) advanceGate(gate, next);
  else overrideGate(gate, next, 'approve');
}

    save(); closeModal(); render();

  };
}
function actSendAll(quiet){
  const c = activeCase();
  c.channels.forEach(id=>{ if(!c.comms.find(x=>x.ch===id)) sendChannel(c,id,true); });
  if(!quiet){ render(); toast('All channels sent.','ok'); }
}
function actPublish(){
  const c = activeCase();
  advanceStage(c,6);
  c.publishedAt = caseNow(c); c.closedAt = c.publishedAt;
  logEvent(c,'gate','Advisory published. Case closed on day '+elapsedDays(c).toFixed(1)+'.');
  if(S.notify.auto) queueNotification(c,'published', null, {});
  save(); render(); toast('Published. The advisory is now on the Trust Center.','ok');
}
function signAsMe(gate, fn){
  const c = activeCase(); const p = me();
  applySignature(c, gate, fn, 'approved', p.name, 'Signed in the console.');
  render(); toast('Signed as '+((FUNCTIONS[fn]||{}).label||fn)+'.','ok');
}
function notifyOne(gate, fn){
  const c = activeCase(); const r = requiredSigners(c,gate).find(x=>x.fn===fn);
  if(!r || !r.person) return;
  queueNotification(c,'gate-open', r.person, {fn, gate});
  save(); render(); toast('Reminder drafted for '+r.person.name+'. Open Notifications to send it.','ok');
}

/* ---------- the action router ---------- */
function runAct(spec){
  const [act, a, b, d] = spec.split('|');
  const c = activeCase();
  switch(act){
    case 'toImpact': return actToImpact();
    case 'toRisk':   return goStage(c,2);
    case 'noimpact': return actNoImpact();
    case 'autofill': return autofillAssessments();
    case 'openneed': return openNeedCard();
    case 'decide':   return actDecide(a);
    case 'override': return overrideGate(a, +b, d);
    case 'signme':   return signAsMe(a, b);
    case 'continue': return advanceGate(a, +b);
    case 'withdraw': return withdrawObjections(a);
    case 'notify':   { notifyGate(c, a); save(); render(); toast('Notifications drafted for everyone outstanding. Open the Notifications tab to send them.','ok'); return; }
    case 'generate': return actGenerate();
    case 'applychannels': return actApplyChannels();
    case 'sendall':  return actSendAll();
    case 'publish':  return actPublish();
    case 'parse':    return dlgParse();
    case 'notifysample': {
      if(!S.selectedSample) return;
      const key=S.selectedSample; S.selectedSample=''; return loadSample(key);
    }
    case 'preloadsample': {
      S.cardOpen['start-samples']=true; save(); render();
      requestAnimationFrame(()=>document.querySelector('[data-card="start-samples"]')?.scrollIntoView({behavior:'smooth',block:'start'}));
      return;
    }
    case 'preloadadvisory': {
      if(!activeCase()) newCase();
      S.view='work'; save(); render(); dlgParse(); return;
    }
    case 'notifysetup': return dlgNotifySetup();
    case 'goto':     { c.stage = +a; save(); render(); return; }
    case 'exportcase': return download(c.ref+'-case-record.json', JSON.stringify(c,null,2), 'application/json');
    case 'newcase':  { S.active=null; S.view='work'; save(); render(); return; }
    case 'sendqueued': { S.outbox.filter(m=>m.status==='queued').slice().forEach(m=>sendMessage(m.id)); return; }
    case 'clearoutbox': { S.outbox = S.outbox.filter(m=>m.status!=='sent'); save(); render(); return; }
    case 'autorun':  return startAutoRun();
    case 'autostop': return stopAutoRun('You have taken over. The case stays exactly where the run stopped.');
    case 'helpprocess': return dlgHelp('process');
    case 'startover':   return actStartOver();
    case 'resetcase':   return actResetCase();
    case 'importproducts': return dlgImportProducts();
    case 'trigger':     return dlgTrigger();
    case 'notifytrigger': { notifyTrigger(c); closeModal(); render();
      toast('Notification drafted for the case team. Open Notifications to send it.','ok'); return; }
    case 'exportall':   return download('cvd-console-export.json', JSON.stringify(S,null,2), 'application/json');
    case 'acceptrec':   return actAcceptRecommendation();
    case 'sendpublish': { actSendPicked(true); if(!outstandingChannels(activeCase()).length) actPublish(); else render(); return; }
    case 'sendsel':   return actSendPicked();
    case 'pickall':   { const cc=activeCase();
      cc.pick = a==='1' ? null : [];
      save(); render(); return; }
    case 'defer':     return actDefer(a);
    case 'undefer':   { const cc=activeCase();
      cc.deferred = (cc.deferred||[]).filter(x=>x.ch!==a);
      logEvent(cc,'gate',(CHANNELS.find(x=>x.id===a)||{}).label+' put back into the communication plan.');
      save(); render(); return; }
  }
}

/* ---------- demo history ---------- */
function seedDemoHistory(){
  const recipes = [
    {key:'log4j', close:false, days:11, reach:'confirmed', path:'clinical', safety:'moderate', mits:['m-patch','m-network','m-monitor'], fix:'2.0.1'},
    {key:'xxe',   close:true,  days:6,  reach:'conditional', path:'clinical', safety:'none', mits:['m-patch','m-vex'], fix:'3.9.0'},
    {key:'sqlcipher', close:false, days:19, reach:'confirmed', path:'physical', safety:'minor', mits:['m-patch','m-vex'], fix:'6.4.0'}
  ];
  recipes.forEach(r=>{
    const s = SAMPLE_INPUTS.find(x=>x.key===r.key); if(!s) return;
    const c = newCase();
    c.mode='sim';
    const start = Date.now() - (r.days+Math.round(Math.random()*20)+8)*DAY;
    c.createdAt = start;
    c.input = {source:s.source, sourceDetail:s.sourceDetail, reportedAt:new Date(start).toISOString().slice(0,10),
      cve:s.cve, title:s.title, cvss:String(s.cvss), vector:s.vector, cwe:s.cwe, epss:String(s.epss),
      kev:s.kev, exploit:s.exploit, summary:s.summary, affects:s.affects.map(a=>({...a}))};
    c.impacted = matchProducts(c).map(m=>m.product.id);
    const frac = [0.04,0.12,0.34,0.32,0.12,0.06];
    let t = start;
    c.enter={}; c.exit={};
    for(let i=0;i<6;i++){ c.enter[i]=t; t += r.days*DAY*frac[i]; c.exit[i]=t; }
    c.simOffset = t - Date.now();
    c.impacted.forEach(pid=>{
      c.assess[pid] = Object.assign(blankAssessment(pid), {reach:r.reach, path:r.path, safety:r.safety,
        mitigations:r.mits, fixVersion:r.fix, usage:'Assessed during the sample run.', done:true});
    });
    c.decision = r.close ? 'close' : 'escalate';
    autoSignGate(c,'gateA');
    if(r.close){
      c.stage=6; c.closedAt=t;
      logEvent(c,'gate','Case closed at Gate A — residual risk accepted with a VEX statement.');
    } else {
      c.draft.template='t-bulletin'; c.draft.body=composeDraft(c,'t-bulletin'); c.draft.title=s.title; c.draft.generated=true;
      autoSignGate(c,'gateB'); autoSignGate(c,'gateC');
      c.channels = suggestedChannels(c);
      c.comms = c.channels.map(id=>({ch:id, ts:t, body:c.draft.body}));
      c.stage=6; c.publishedAt=t; c.closedAt=t;
      logEvent(c,'gate','Advisory published through '+c.channels.length+' channels.');
    }
  });
  S.active=null; save(); render();
  toast('Three completed cases loaded. The Trust Center and metrics now have history.','ok');
}

function applyAssessField(c, el){
