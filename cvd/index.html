function updateScore(c, pid){
  const host = $('#score-'+pid); if(!host) return;
  host.outerHTML = scoreBlock(pid, scoreAssessment(c, c.assess[pid]));
}

/* ---------- helpers used by handlers ---------- */
function sendChannel(c, chId, quiet){
  if(c.comms.find(x=>x.ch===chId)) return;
  c.comms.push({ch:chId, ts:caseNow(c), body:c.draft.body, audience:audienceFor(c, CHANNELS.find(x=>x.id===chId)||{})});
  const ch = CHANNELS.find(x=>x.id===chId)||{};
  logEvent(c,'sign','Sent through '+(ch.label||chId)+'.');
  if(c.mode==='sim') c.simOffset += 2*HOUR;
  save();
  if(!quiet){ render(); toast('Sent: '+(ch.label||chId),'ok'); }
}
function dlgComm(c, chId){
  const rec = c.comms.find(x=>x.ch===chId); const ch = CHANNELS.find(x=>x.id===chId)||{};
  openModal('<div class="modal-hd"><h3>'+esc(ch.label||chId)+'</h3><div class="pop"><button class="btn ghost sm" data-close>✕</button></div></div>'
  + '<div class="modal-bd"><dl class="kv" style="margin-bottom:14px"><dt>Sent</dt><dd>'+fmtDateTime(rec.ts)+'</dd>'
  + '<dt>Audience</dt><dd>'+esc(rec.audience||'')+'</dd></dl>'
  + '<pre class="doc">'+esc(rec.body||'')+'</pre></div>'
  + '<div class="modal-ft"><button class="btn primary" data-close>Close</button></div>', {wide:true});
}
function dlgSideFull(){
  const c = activeCase();
  openModal('<div class="modal-hd"><h3>Case file'+(c?' — '+esc(c.ref):'')+'</h3><div class="pop"><button class="btn ghost sm" data-close>✕</button></div></div>'
  + '<div class="modal-bd">'+ (c? '<div class="tl">'+c.log.map(e=>'<div class="tl-i" data-k="'+esc(e.kind)+'"><b>'+esc(e.text)+'</b><span>'+fmtDateTime(e.ts)+(e.who?' · '+esc(e.who):'')+'</span></div>').join('')+'</div>'
      : '<div class="empty"><b>No case open</b>Start one to build a record.</div>')
  + '</div><div class="modal-ft"><button class="btn primary" data-close>Close</button></div>', {wide:true});
}
function plainLanguage(c){
  const w = worstSafety(c);
  const n = c.impacted.length;
  const fix = c.impacted.map(pid=>c.assess[pid]?.fixVersion).filter(Boolean)[0];
  return 'A weakness was found in software used inside '+(n===1?'one of our products':n+' of our products')+'. '
    + 'To take advantage of it, an attacker would need '+({internet:'only internet access',clinical:'access to the hospital network',adjacent:'to be within range of the device',isolated:'access to a restricted service network',physical:'physical access to the device'}[(c.assess[c.impacted[0]]||{}).path]||'network access')+'. '
    + ({none:'Patient care is not affected.',minor:'Any disruption would be brief and recoverable.',moderate:'It could delay treatment or interrupt monitoring, and staff should be aware of the symptoms described above.',serious:'It could contribute to patient harm, which is why we are asking you to act now rather than wait for the next scheduled release.'}[w])
    + (fix? ' The corrected version is '+fix+'.' : ' A corrected version is in preparation and this notice will be updated when it is available.');
}
function saveNewProduct(){
  const g = id => ($('#'+id)||{}).value || '';
  const name = g('np-name').trim(); if(!name){ toast('A product needs a name.','warn'); return; }
  const pc = g('np-pc');
  const sbom = g('np-sbom').split('\n').map(l=>l.split(',').map(x=>x.trim())).filter(a=>a[0])
    .map(a=>({n:a[0], v:a[1]||'0', eco:a[2]||'other', use:'runtime', role:a[3]||'Component'}));
  S.products.push({
    id:uid('p'), name, short:g('np-short').trim()||name, line:g('np-line').trim()||'Unassigned',
    devClass:g('np-class').trim()||'Unclassified', patientConnected: pc!=='none', lifeSustaining: pc==='life',
    version:g('np-version').trim()||'1.0', units:parseInt(g('np-units'),10)||0,
    exposure:g('np-exp').trim()||'Not stated', care:g('np-care').trim()||'Not stated', sbom
  });
  save(); closeModal(); render(); toast('Product added to the portfolio.','ok');
}
function savePerson(){
  const name = $('#pp-name').value.trim(); if(!name){ toast('A person needs a name.','warn'); return; }
  const id = window.__editPerson;
  const rec = {name, role:$('#pp-role').value.trim()||'—', email:$('#pp-email').value.trim(), fn:$('#pp-fn').value};
  if(id){ Object.assign(S.people.find(p=>p.id===id), rec); }
  else S.people.push(Object.assign({id:uid('u')}, rec));
  window.__editPerson=null; save(); closeModal(); render(); toast('Saved.','ok');
}
function deletePerson(){
  const id = window.__editPerson; if(!id) return;
  S.people = S.people.filter(p=>p.id!==id); window.__editPerson=null;
  if(S.meId===id) S.meId = (S.people[0]||{}).id;
  save(); closeModal(); render(); toast('Removed.','ok');
}
const _dlgPerson = dlgPerson;
dlgPerson = function(id){ window.__editPerson = id||null; _dlgPerson(id); };

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); S.active=null; S.view='work'; save(); render(); return; }
  if((e.metaKey||e.ctrlKey) && e.key==='ArrowUp'){ e.preventDefault(); setZoom(S.zoom+.1); return; }
  if((e.metaKey||e.ctrlKey) && e.key==='ArrowDown'){ e.preventDefault(); setZoom(S.zoom-.1); return; }
  if(typing) return;
  if(e.key==='['){ toggleCollapse('rail'); }
  if(e.key===']'){ toggleCollapse('side'); }
  if(e.key==='?'){ dlgHelp('tour'); }
});

/* ---------- boot ---------- */
function boot(){
  S = load();
  document.title = 'CVD Console — ' + S.org;
  render();
  const foot = document.createElement('div');
  foot.id='saveFlag';
  foot.style.cssText='position:fixed;left:10px;bottom:8px;font-size:10px;color:var(--ink-4);pointer-events:none;z-index:5';
  foot.textContent='Saved locally';
  document.body.appendChild(foot);
  if(!S.seenHelp){ S.seenHelp = true; save(); setTimeout(()=>dlgHelp('tour'), 500); }
}
window.CVD = {state:()=>S, render, save, activeCase};
boot();

</script>
