  const cards = zones.map((z, i) => ({
    z, x: 60 + (i % PER) * (CW + GAP), y: 170 + Math.floor(i / PER) * (CH + GAP), w: CW, h: CH,
    members: m.nodes.filter(n => n.zone === z.id && n.kind !== 'threat')
  }));
  const pos = {}; cards.forEach(c => pos[c.z.id] = c);
  let s = '';
  const bw = PER * (CW + GAP) - GAP + 20;
  s += '<rect x="50" y="46" width="' + bw + '" height="96" rx="16" fill="#ffffff" stroke="#e4ebf0" filter="url(#raise)"/>';
  s += T(72, 78, 'OV-1 · HIGH-LEVEL OPERATIONAL CONCEPT', { size: 10, weight: 700, fill: '#5c6f7d', ls: '0.1em' });
  s += T(72, 102, m.product + ' v' + m.version, { size: 17, weight: 650, fill: '#1b4965' });
  s += T(72, 124, truncate(m.kindOfProduct || 'Clinical system operating across the domains below.', 120), { size: 11.5, fill: '#7b8b96' });

  Object.values(agg).forEach(e => {
    const A = pos[e.a.id], B = pos[e.b.id]; if (!A || !B) return;
    const p1 = edgePoint(A, B.x + B.w / 2, B.y + B.h / 2), p2 = edgePoint(B, A.x + A.w / 2, A.y + A.h / 2);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;

    const t = truncate(e.data.join(', ') || e.labels[0], 30);

    s += T(mx, my + 4, t, { size: 10, weight: 600, fill: '#40525e', anchor: 'middle' });
  });

  cards.forEach(c => {
    const zr = risks.filter(r => r.boundary && r.boundary.indexOf(c.z.name) >= 0);
    const worst = zr.length ? zr.reduce((a, b) => a.score >= b.score ? a : b).band : 'Low';
    s += '<g class="zone" data-kind="zone" data-id="' + c.z.id + '">';
    s += '<rect x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h + '" rx="20" fill="' + (c.z.tint || '#eef1f5') + '" stroke="#cfdbe4" filter="url(#raise)"/>';
    s += '<rect x="' + (c.x + 12) + '" y="' + (c.y + 12) + '" width="' + (c.w - 24) + '" height="' + (c.h - 24) + '" rx="14" fill="#ffffff" fill-opacity=".72"/>';
    s += T(c.x + 28, c.y + 42, truncate(c.z.name, 34), { size: 13.5, weight: 650, fill: '#12212b' });
    s += T(c.x + 28, c.y + 60, 'operational domain · trust: ' + c.z.trust, { size: 10, fill: '#7b8b96' });
    c.members.slice(0, 4).forEach((n, i) => {
      s += '<circle cx="' + (c.x + 32) + '" cy="' + (c.y + 82 + i * 20) + '" r="3" fill="' + (KIND_COLOR[n.kind] || '#2c6e8f') + '"/>';
      s += T(c.x + 44, c.y + 86 + i * 20, truncate(n.ov || n.name, 38), { size: 11.5, fill: '#40525e' });

    if (c.members.length > 4) s += T(c.x + 44, c.y + 86 + 4 * 20, '+ ' + (c.members.length - 4) + ' more', { size: 11, fill: '#8496a2' });
    s += chip(c.x + c.w - 92, c.y + 20, worst.toUpperCase() + ' RISK', bandColor(worst), '#fff', 72);
    s += '</g>';

    const sc = met ? (met.cvssData ? met.cvssData.baseScore : met.baseScore) : 0;
    const desc = ((c.descriptions || []).find(d => d.lang === 'en') || {}).value || '';

  }
  // KEV catalogue, cached for six hours
  const fresh = p.feed.kevAt && (Date.now() - p.feed.kevAt < 6 * 3600e3);
  if (!fresh) {
    try {
      const j = await getJSON(CFG.feeds.kev);
      p.feed.kev = (j.vulnerabilities || []).map(v => ({
        id: v.cveID, vendor: v.vendorProject, product: v.product, t: v.vulnerabilityName,
        s: v.shortDescription, added: v.dateAdded, ransom: v.knownRansomwareCampaignUse
      }));
      p.feed.kevAt = Date.now();
      alog('feed', 'KEV catalogue loaded: ' + p.feed.kev.length + ' actively exploited entries.');
    } catch (e) { errs.push('CISA KEV: ' + e.message); }
  } else alog('feed', 'KEV catalogue still fresh, reusing the cached copy.');
  // ICS medical advisories
  try {
    const xml = await getText(CFG.feeds.icsma);
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item, entry')).slice(0, 25).map(it => ({
      id: (it.querySelector('title') || {}).textContent || '',
      link: ((it.querySelector('link') || {}).textContent) || ((it.querySelector('link') || {}).getAttribute ? it.querySelector('link').getAttribute('href') : ''),
      published: ((it.querySelector('pubDate, updated') || {}).textContent) || ''
    })).filter(x => x.id);
    p.feed.icsma = items;
    alog('feed', 'ICS medical advisories: ' + items.length + ' recent items.');
  } catch (e) { errs.push('ICS medical advisories: ' + e.message); }
  // NVD by keyword
  const kws = modelKeywords(m);
  for (const kw of kws) {
    try {
      const j = await getJSON(CFG.feeds.nvd + '?keywordSearch=' + encodeURIComponent(kw) + '&resultsPerPage=10&noRejected', nvdHeaders());
      const a = parseNvd(j, kw);
      ctx.fetched.push.apply(ctx.fetched, a);
      alog('feed', 'NVD "' + kw + '": ' + a.length + ' records.');
    } catch (e) { errs.push('NVD "' + kw + '": ' + e.message); }
    await new Promise(r => setTimeout(r, CFG.nvdKey ? 250 : 800));
  }
  const seenId = new Set();
  ctx.fetched = ctx.fetched.filter(x => { if (!x.id || seenId.has(x.id)) return false; seenId.add(x.id); return true; });
  p.feed.errors = errs;
  p.feed.lastPoll = Date.now();
  const seen = new Set(p.feed.advisories.map(a => a.id));
  ctx.newOnes = ctx.fetched.filter(a => !seen.has(a.id));
  p.feed.advisories = ctx.fetched.concat(p.feed.advisories.filter(a => !ctx.fetched.find(x => x.id === a.id))).slice(0, 400);
  if (errs.length) {
    alog('feed', errs.length + ' feed(s) unreachable from the browser. ' + esc(errs[0]), 'err');
    if (!ctx.fetched.length) throw new Error(errs[0] + ' — the feeds are blocked by CORS or offline. Set a proxy in Admin → Feeds.');
  }
  logInput('feed', 'Feed poll: ' + ctx.fetched.length + ' advisories retrieved, ' + ctx.newOnes.length + ' new.', { keywords: kws });
  return ctx.fetched.length + ' advisories, ' + ctx.newOnes.length + ' new';
}

function matchNodes(m, adv) {
  const hay = (adv.id + ' ' + adv.t + ' ' + adv.s + ' ' + (adv.keyword || '')).toLowerCase();
  return m.nodes.filter(n => {
    if (n.kind === 'threat') return false;
    const terms = (n.sbom || []).map(c => String(c.n).toLowerCase())
      .concat((n.proto || []).map(p => p.toLowerCase()))
      .concat([(n.tech || '').toLowerCase(), n.name.toLowerCase()]);
    return terms.some(t => {
      const w = t.split(/[\s\/·]+/).filter(x => x.length > 3);
      return w.some(x => hay.indexOf(x) >= 0);
    });
  });
}
async function runCorrelate(ctx) {
  const p = P(), m = p.model;
  const kev = new Set((p.feed && p.feed.kev || []).map(k => k.id));
  const cutoff = Date.now() - CFG.zeroDayDays * 86400e3;
  ctx.hits = [];
  (ctx.fetched || []).forEach(adv => {
    const ns = matchNodes(m, adv);
    if (!ns.length) return;
    const recent = adv.published && Date.parse(adv.published) > cutoff;
    const zero = kev.has(adv.id) || (adv.c >= 9 && recent);
    ns.forEach(n => ctx.hits.push({ adv, node: n, zero, kev: kev.has(adv.id), recent }));
  });
  ctx.zerodays = ctx.hits.filter(h => h.zero);
  alog('correlate', ctx.hits.length + ' advisory-to-element matches, ' + ctx.zerodays.length + ' meeting the zero-day trigger.');
  uniq(ctx.zerodays.map(h => h.adv.id)).forEach(id => {
    const g = ctx.zerodays.filter(h => h.adv.id === id), h0 = g[0];
    logInput('zero-day', id + ' (' + (h0.kev ? 'actively exploited, on the KEV catalogue' : 'CVSS ' + h0.adv.c + ', published inside the ' + CFG.zeroDayDays + '-day window') + ') affects ' + g.map(x => x.node.name).join(', '), { cve: id, nodes: g.map(x => x.node.id) });
  });
  return ctx.hits.length + ' matches / ' + ctx.zerodays.length + ' zero-day';
}
async function runModeler(ctx) {
  const p = P(), m = p.model;
  if (!ctx.hits || !ctx.hits.length) return 'nothing to attach';
  snapshot('advisory intake');
  ctx.changed = [];
  ctx.hits.forEach(h => {
    const n = nodeById(m, h.node.id); if (!n) return;
    n.cves = n.cves || [];
    if (n.cves.find(v => v.id === h.adv.id)) return;
    n.cves.push({ id: h.adv.id, t: h.adv.t, c: h.adv.c || 5, s: h.adv.s, comp: h.adv.keyword || 'matched by feed', live: 1, kev: h.kev ? 1 : 0 });
    if (ctx.changed.indexOf(n.id) < 0) ctx.changed.push(n.id);
  });
  m._risks = analyze(m);
  alog('modeler', 'Attached advisories to ' + ctx.changed.length + ' element(s) and rescored the model.');
  return ctx.changed.length + ' elements updated';
}
async function runDiagram(ctx) {
  refreshAll();
  if (ctx.changed && ctx.changed.length) {
    const m = M(), n = nodeById(m, ctx.changed[0]);
    if (n) {
      S.view = 'tm'; S.sel = { kind: 'node', id: n.id };
      const svg = $('#svg'), cam = S.camera.tm || (S.camera.tm = { x: 0, y: 0, k: 1 });
      cam.k = Math.max(cam.k || 0.8, 0.8);
      cam.x = (svg.clientWidth || 900) / 2 - (n.x + n.w / 2) * cam.k;
      cam.y = (svg.clientHeight || 600) / 2 - (n.y + n.h / 2) * cam.k;
      renderCTabs(); draw(); renderRight();
    }
  }
  return 'views rebuilt';
}
async function runNarrator(ctx) {
  const p = P();
  if (!ctx.hits || !ctx.hits.length) { p.feedNote = 'No advisory in this poll matched a component in the model.'; return 'no impact'; }
  const lines = ctx.hits.slice(0, 8).map(h => h.adv.id + ' (CVSS ' + (h.adv.c || 'n/a') + (h.kev ? ', actively exploited' : '') + ') → ' + h.node.name);
  let text = '<p><b>' + ctx.hits.length + ' advisory matches</b> across ' + uniq(ctx.hits.map(h => h.node.id)).length +
    ' elements' + (ctx.zerodays.length ? ', including <b>' + ctx.zerodays.length + ' meeting the zero-day trigger</b>' : '') + '.</p><ul>' +
    lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1000,
        messages: [{
          role: 'user', content: 'You are a medical device product security analyst. New advisories have matched components in this threat model. ' +
            'Write a short impact note: what an attacker could now do, which patients are exposed, and the immediate action. Do not invent CVEs or change any score.\n\nMATCHES:\n' +
            JSON.stringify(ctx.hits.slice(0, 12).map(h => ({ cve: h.adv.id, cvss: h.adv.c, kev: h.kev, summary: h.adv.t, element: h.node.name, zone: (zoneById(P().model, h.node.zone) || {}).name, data: h.node.data, scope: h.node.scope }))) +
            '\n\nMODEL:\n' + modelDigest() + '\n\nAnswer in clean HTML, no markdown fences, under 220 words.'
        }]
      })
    });
    const data = await res.json();
    const t = (data.content || []).map(c => c.type === 'text' ? c.text : '').join('\n').trim();
    if (t) text = t.replace(/```html|```/g, '');
    alog('narrator', 'Impact note written by the language model.');
  } catch (e) { alog('narrator', 'Language model unreachable; used the built-in analyst.'); }
  p.feedNote = text;
  p.feedNoteAt = Date.now();
  return 'impact note ready';
}

const RUNNERS = { feed: runFeed, correlate: runCorrelate, modeler: runModeler, diagram: runDiagram, narrator: runNarrator };
let pipelineBusy = false;
async function runPipeline(trigger, seed) {
  if (!P()) { toast('Open a project first.'); return; }
  if (pipelineBusy) { toast('The agents are already running.'); return; }
  pipelineBusy = true;
  const ctx = { trigger, seed, fetched: [], hits: [], zerodays: [], changed: [] };
  alog('pipeline', 'Run started · trigger: ' + trigger + (seed ? ' · ' + seed : ''));
  for (const a of AGENTS) {
    if (!CFG.agents[a.id]) { setStatus(a.id, 'idle', 'disabled'); continue; }
    setStatus(a.id, 'run');
    try {
      const r = await RUNNERS[a.id](ctx);
      setStatus(a.id, 'ok', r); alog(a.id, 'Done — ' + r);
    } catch (e) {
      setStatus(a.id, 'err', e.message); alog(a.id, 'Failed — ' + e.message, 'err');
      if (a.id === 'feed') break;
    }
  }
  pipelineBusy = false;
  renderRight(); renderStatus();
  if (ctx.zerodays.length) toast('<b>' + ctx.zerodays.length + ' zero-day trigger(s)</b> matched this product. See the Agents tab.', 8000);
  else if (ctx.hits.length) toast(ctx.hits.length + ' advisory matches attached to the model.');
}

function setPoll(mins) {
  CFG.poll = mins; saveCfg();
  if (pollTimer) clearInterval(pollTimer);
  if (mins > 0) pollTimer = setInterval(() => runPipeline('scheduled poll'), mins * 60000);
}

renderTree = function () {
  const p = P(), host = $('#tree');

    .sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name))
    .map(k => {
      const sig = signalsFor(k.path || k.name);

      return '<div><div class="tnode' + (sig.length ? ' hit' : '') + '"' + (sig.length ? ' data-tip="Security signal: ' + esc(sig.map(s => s.name).join(', ')) + '"' : '') + '>' +

        (sig.length ? '<span class="tsig">' + esc(sig[0].tag) + '</span>' : '') + '</div>' + kid + '</div>';

async function pickFolder() {

async function writeToFolder(name, text) {
  if (!dirHandle) return false;

    const fh = await dirHandle.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(text); await w.close();
    return true;
  } catch (e) { toast('Could not write to the folder: ' + esc(e.message)); return false; }
}
async function saveProjectToFolder() {
  const p = P(); if (!p) return;
  if (!dirHandle) { await pickFolder(); if (!dirHandle) return; }
  const stamp = (p.product + '-v' + p.version).replace(/[^\w.-]+/g, '_');
  const okJson = await writeToFolder(stamp + '.threatforge.json', JSON.stringify(p, null, 2));
  await writeToFolder(stamp + '-threat-model.md', textModel());
  if (okJson) { toast('Written to <b>' + esc(dirHandle.name) + '</b>: project file and markdown model.'); logInput('export', 'Saved to local folder ' + dirHandle.name); }

   AI Security Knowledge Graph — unified graph view,
   trust zones on every view, and the model cleaner

/* ---------- zones carried into the attack graph ---------- */
const _buildAttackGraph = buildAttackGraph;
buildAttackGraph = function (m) {
  const g = _buildAttackGraph(m);
  g.nodes.forEach(n => {
    let src = null;
    if (n.id.indexOf('n_') === 0 || n.id.indexOf('x_') === 0) src = nodeById(m, n.id.slice(2));
    else if (n.id.indexOf('e_') === 0) {
      const f = m.flows.find(x => x.id === n.id.slice(2));
      src = f ? nodeById(m, f.from) : null;
    }
    if (src) { const z = zoneById(m, src.zone); n.zone = z ? z.name : ''; n.tint = z ? z.tint : ''; n.trust = z ? z.trust : ''; n.src = src.id; }
    else { n.zone = 'Patient / business impact'; n.tint = TINT.critical; n.trust = 'critical'; }
  });
  g.edges.forEach(e => {
    const a = g.nodes.find(n => n.id === e.from), b = g.nodes.find(n => n.id === e.to);
    e.crossing = !!(a && b && a.zone && b.zone && a.zone !== b.zone);
    if (e.crossing) e.boundary = a.zone + ' → ' + b.zone;
  });
  return g;
};

renderAttackGraph = function (g) {
  const LAYER = ['Entry point', 'Foothold', 'Movement & escalation', 'Impact on patients or data'];
  const TINTS = ['#fdeceb', '#fdf3e5', '#e9f2fa', '#f2edf9'];
  let s = '';
  const rows = [0, 1, 2, 3].map(l => g.nodes.filter(n => n.layer === l));
  const maxY = Math.max.apply(null, g.nodes.map(n => n.y + n.h).concat([300]));
  rows.forEach((col, i) => {
    const x = 40 + i * 300;
    s += '<rect x="' + x + '" y="40" width="270" height="' + (maxY + 40) + '" rx="18" fill="' + TINTS[i] + '" opacity=".5"/>';
    s += T(x + 16, 64, LAYER[i].toUpperCase(), { size: 10, weight: 700, fill: '#5c6f7d', ls: '0.08em' });
  });
  g.edges.forEach(e => {
    const a = g.nodes.find(n => n.id === e.from), b = g.nodes.find(n => n.id === e.to);
    if (!a || !b) return;
    const p1 = { x: a.x + a.w, y: a.y + a.h / 2 }, p2 = { x: b.x, y: b.y + b.h / 2 };
    const mid = (p1.x + p2.x) / 2;
    s += '<path d="M' + p1.x + ',' + p1.y + ' C' + mid + ',' + p1.y + ' ' + mid + ',' + p2.y + ' ' + p2.x + ',' + p2.y +
      '" fill="none" stroke="' + (e.crossing ? '#c9663a' : '#a9bcc7') + '" stroke-width="' + (e.crossing ? 1.9 : 1.4) + '"' +
      (e.crossing ? ' stroke-dasharray="7 5"' : '') + ' marker-end="url(#arw)"/>';
    const t = truncate(e.label, 24);
    const ly = (p1.y + p2.y) / 2;
    s += '<rect x="' + (mid - t.length * 2.7 - 7) + '" y="' + (ly - 9) + '" width="' + (t.length * 5.4 + 14) + '" height="16" rx="7" fill="#fff" fill-opacity=".93" stroke="#e2e9ee"/>';
    s += T(mid, ly + 2.5, t, { size: 9.5, fill: '#7b8b96', anchor: 'middle' });
    if (e.crossing) s += chip(mid - 34, ly + 10, 'BOUNDARY', '#c9663a', '#fff', 68);
  });
  g.nodes.forEach(n => {
    const sel = S.sel && S.sel.kind === 'anode' && S.sel.id === n.id;
    s += '<g class="anode" data-kind="anode" data-id="' + n.id + '">';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + (n.h + 14) + '" rx="12" fill="#ffffff" stroke="' + (sel ? '#1b4965' : '#e4ebf0') + '" stroke-width="' + (sel ? 2 : 1) + '" filter="url(#raise)"/>';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="4" height="' + (n.h + 14) + '" rx="2" fill="' + bandColor(n.band || 'Medium') + '"/>';
    if (n.tint) s += '<rect x="' + (n.x + 6) + '" y="' + (n.y + n.h - 4) + '" width="' + (n.w - 12) + '" height="16" rx="8" fill="' + n.tint + '"/>';
    wrapText(n.label, 30).slice(0, 2).forEach((t, i) => s += T(n.x + 14, n.y + 20 + i * 14, t, { size: 12, weight: 650, fill: '#12212b' }));
    s += T(n.x + 14, n.y + n.h - 8, truncate(n.note || '', 40), { size: 9, fill: '#8496a2' });
    s += T(n.x + 14, n.y + n.h + 8, truncate('zone: ' + (n.zone || 'n/a'), 40), { size: 9, weight: 600, fill: '#5c6f7d' });
    s += '</g>';
  });
  return s;
};

/* ---------- the knowledge graph itself ---------- */
const KG_LANES = [
  { id: 'zone', label: 'Trust zones', color: '#3f7d9c' },
  { id: 'asset', label: 'Assets & interfaces', color: '#2c6e8f' },
  { id: 'threat', label: 'Threats: advisories & techniques', color: '#b03a48' },
  { id: 'risk', label: 'Risks', color: '#c9663a' },
  { id: 'control', label: 'Controls', color: '#4f9d84' },
  { id: 'evidence', label: 'Evidence & findings', color: '#8a6fbe' }
];
function buildKnowledgeGraph(m) {
  const p = P(), risks = m._risks || analyze(m);
  const N2 = [], E = [];
  const add = (lane, id, label, meta) => { if (!N2.find(x => x.id === id)) N2.push(Object.assign({ id, lane, label }, meta || {})); return id; };
  const link = (a, b, label) => { if (a && b) E.push({ from: a, to: b, label: label || '' }); };

  m.zones.forEach(z => add('zone', 'z:' + z.id, z.name, { sub: 'trust: ' + z.trust, tint: z.tint }));
  m.nodes.filter(n => n.kind !== 'threat').slice(0, 18).forEach(n => {
    const z = zoneById(m, n.zone);
    add('asset', 'a:' + n.id, n.name, { sub: (KIND_LABEL[n.kind] || n.kind) + ((n.data || []).length ? ' · ' + n.data.join(', ') : ''), tint: z ? z.tint : '', zone: z ? z.name : '' });
    link('z:' + n.zone, 'a:' + n.id, 'contains');
  });
  m.nodes.forEach(n => nodeCves(n).slice(0, 3).forEach(v => {
    add('threat', 'v:' + v.id, v.id, { sub: truncate(v.t, 46), band: v.c >= 9 ? 'Critical' : v.c >= 7 ? 'High' : 'Medium', kev: v.kev });
    link('v:' + v.id, 'a:' + n.id, 'affects');
  }));
  (p.frameworkHits || []).slice(0, 14).forEach(h => {
    add('threat', 't:' + h.tech.id, h.tech.id, { sub: truncate(h.tech.name, 46), band: 'High', fw: h.fw });
    link('t:' + h.tech.id, 'a:' + h.targetId, h.tech.tactic || 'technique');
  });
  risks.slice(0, 14).forEach(r => {
    const target = r.kind === 'flow' ? (m.flows.find(f => f.id === r.ref) || {}).to : r.ref;
    add('risk', 'r:' + r.id, truncate(r.title, 40), { sub: r.band + ' ' + r.score + ' → residual ' + r.rBand, band: r.band, zone: r.boundary });
    link('a:' + target, 'r:' + r.id, 'exposes');
    (r.mitigations || []).slice(0, 2).forEach(c => {
      add('control', 'c:' + c.title, c.title, { sub: c.ref });
      link('r:' + r.id, 'c:' + c.title, 'mitigated by');
    });
  });
  (p.evidence || []).slice(0, 10).forEach(ev => {
    add('evidence', 'e:' + ev.id, truncate(ev.summary, 40), { sub: ev.type + ' · ' + new Date(ev.ts).toLocaleDateString() });
    (ev.controlIds || []).forEach(cid => { const c = N2.find(x => x.lane === 'control' && (x.sub || '').indexOf(cid) >= 0); if (c) link('e:' + ev.id, c.id, 'evidences'); });

  KG_LANES.forEach((lane, li) => {
    const col = N2.filter(n => n.lane === lane.id);

function renderKnowledgeGraph(g) {

  KG_LANES.forEach((lane, li) => {
    const x = 40 + li * 316;
    s += '<rect x="' + x + '" y="60" width="288" height="' + (maxY - 20) + '" rx="18" fill="#eef1f5" opacity=".45"/>';
    s += '<rect x="' + (x + 14) + '" y="82" width="6" height="16" rx="3" fill="' + lane.color + '"/>';
    s += T(x + 28, 95, lane.label.toUpperCase(), { size: 9.5, weight: 700, fill: '#5c6f7d', ls: '0.07em' });
  });
  g.edges.forEach(e => {
    const a = g.nodes.find(n => n.id === e.from), b = g.nodes.find(n => n.id === e.to);
    if (!a || !b) return;
    const back = b.x < a.x;
    const p1 = { x: back ? a.x : a.x + a.w, y: a.y + a.h / 2 };
    const p2 = { x: back ? b.x + b.w : b.x, y: b.y + b.h / 2 };
    const mid = (p1.x + p2.x) / 2;
    s += '<path d="M' + p1.x + ',' + p1.y + ' C' + mid + ',' + p1.y + ' ' + mid + ',' + p2.y + ' ' + p2.x + ',' + p2.y +

    s += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="12" fill="#ffffff" stroke="' + (sel ? '#1b4965' : '#e4ebf0') + '" stroke-width="' + (sel ? 2 : 1) + '" filter="url(#raise)"/>';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="4" height="' + n.h + '" rx="2" fill="' + (n.band ? bandColor(n.band) : lane.color) + '"/>';
    if (n.tint) s += '<rect x="' + (n.x + n.w - 16) + '" y="' + (n.y + 10) + '" width="8" height="' + (n.h - 20) + '" rx="4" fill="' + n.tint + '"/>';
    s += T(n.x + 14, n.y + 22, truncate(n.label, 30), { size: 11.8, weight: 650, fill: '#12212b' });
    s += T(n.x + 14, n.y + 38, truncate(n.sub || '', 38), { size: 9.5, fill: '#8496a2' });
    if (n.zone) s += T(n.x + 14, n.y + 51, truncate('zone: ' + n.zone, 38), { size: 8.6, weight: 600, fill: '#5c6f7d' });
    if (n.kev) s += chip(n.x + n.w - 46, n.y - 8, 'KEV', '#b03a48', '#fff', 34);

/* ---------- model cleaner ---------- */
function cleanModel(opts) {
  const m = M(), p = P(); if (!m) return null;
  snapshot('clean model');
  const rep = [];
  const before = { n: m.nodes.length, f: m.flows.length, z: m.zones.length };
  if (opts.danglers) {
    const ids = new Set(m.nodes.map(n => n.id));
    const gone = m.flows.filter(f => !ids.has(f.from) || !ids.has(f.to)).length;
    m.flows = m.flows.filter(f => ids.has(f.from) && ids.has(f.to));
    if (gone) rep.push(gone + ' interface(s) pointing at elements that no longer exist');
  }
  if (opts.dupes) {
    const seen = {}, remap = {};
    m.nodes.slice().forEach(n => {
      const k = n.name.trim().toLowerCase() + '|' + n.zone;
      if (seen[k]) { remap[n.id] = seen[k]; m.nodes = m.nodes.filter(x => x.id !== n.id); }
      else seen[k] = n.id;
    });
    const c = Object.keys(remap).length;
    if (c) {
      m.flows.forEach(f => { if (remap[f.from]) f.from = remap[f.from]; if (remap[f.to]) f.to = remap[f.to]; });
      rep.push(c + ' duplicate element(s) merged');
    }
  }
  if (opts.selfLoops) {
    const n0 = m.flows.length;
    m.flows = m.flows.filter(f => f.from !== f.to);
    const dup = {};
    m.flows = m.flows.filter(f => { const k = f.from + '>' + f.to + '>' + (f.label || ''); if (dup[k]) return false; dup[k] = 1; return true; });
    if (n0 - m.flows.length) rep.push((n0 - m.flows.length) + ' self-loop or duplicate interface(s)');
  }
  if (opts.orphans) {
    const used = new Set([].concat.apply([], m.flows.map(f => [f.from, f.to])));
    const gone = m.nodes.filter(n => !used.has(n.id) && n.kind !== 'threat');
    m.nodes = m.nodes.filter(n => used.has(n.id) || n.kind === 'threat');
    if (gone.length) rep.push(gone.length + ' element(s) with no interfaces: ' + gone.map(n => n.name).slice(0, 4).join(', '));
  }
  if (opts.emptyZones) {
    const gone = m.zones.filter(z => !m.nodes.some(n => n.zone === z.id));
    m.zones = m.zones.filter(z => m.nodes.some(n => n.zone === z.id));
    if (gone.length) rep.push(gone.length + ' empty trust zone(s)');
  }
  if (opts.threats) {
    const tn = m.nodes.filter(n => n.kind === 'threat').map(n => n.id);
    m.nodes = m.nodes.filter(n => n.kind !== 'threat');
    m.flows = m.flows.filter(f => f.kind !== 'threat' && tn.indexOf(f.from) < 0 && tn.indexOf(f.to) < 0);
    if (tn.length) rep.push(tn.length + ' adversary node(s) and their edges');
  }
  if (opts.staleCves) {
    let c = 0;
    m.nodes.forEach(n => {
      const keep = (n.cves || []).filter(v => !v.live || matchNodes(m, v).some(x => x.id === n.id));
      c += (n.cves || []).length - keep.length; n.cves = keep;
    });
    if (c) rep.push(c + ' attached advisory record(s) that no longer match this element');
  }
  if (opts.relayout) {
    const perZone = {};
    m.nodes.forEach(n => {
      const z = zoneById(m, n.zone); if (!z) return;
      perZone[z.id] = perZone[z.id] || 0;
      const i = perZone[z.id]++;
      n.w = Math.min(n.w, z.w - 50);
      n.x = z.x + 25; n.y = z.y + 50 + i * (n.h + 16);
      if (n.y + n.h > z.y + z.h) z.h = n.y + n.h - z.y + 24;
    });
    rep.push('layout rebuilt inside every zone');
  }
  if (opts.logs) { BUS.length = 0; if (p.feed) { p.feed.advisories = []; p.feed.errors = []; } rep.push('agent log and feed cache cleared'); }
  m._risks = analyze(m);
  p.attack = null; p.attackCache = null; p.kgCache = null;
  logInput('edit', 'Model cleaned: ' + (rep.join('; ') || 'nothing to remove') + '.');
  return { rep, before, after: { n: m.nodes.length, f: m.flows.length, z: m.zones.length } };
}

function runFramework(fwId) {
  const p = P(), m = p.model; if (!m) return [];
  const fw = FRAMEWORKS.find(f => f.id === fwId); if (!fw) return [];
  const hits = [];
  fw.rules.forEach(r => {
    (r.on === 'node' ? m.nodes.filter(n => n.kind !== 'threat') : m.flows.filter(f => f.kind !== 'threat')).forEach(x => {
      let ok = false;
      try { ok = r.test(x, m); } catch (e) { ok = false; }
      if (!ok) return;
      hits.push({
        fw: fw.id, tech: { id: r.id, name: r.name, tactic: r.tactic }, targetKind: r.on,
        targetId: r.on === 'node' ? x.id : x.to, refId: x.id,
        label: r.on === 'node' ? x.name : ((nodeById(m, x.from) || {}).name + ' → ' + (nodeById(m, x.to) || {}).name + ': ' + x.label),
        zone: (zoneById(m, (r.on === 'node' ? x : nodeById(m, x.to) || {}).zone) || {}).name || '',
        why: r.why
      });
    });
  });
  p.fw = fwId; p.frameworkHits = hits; p.fwAt = Date.now();
  p.kgCache = null;
  logInput('edit', fw.name + ' run over the model: ' + hits.length + ' technique mappings.');
  alog('framework', fw.name + ': ' + hits.length + ' mappings across ' + uniq(hits.map(h => h.targetId)).length + ' elements.');
  return hits;
}

/* ============================================================
   Continuous feedback intake — SAST, DAST, SCA, pentest,
   CVE notifications, zero-days, test results, compliance
   evidence. Everything normalises to one envelope, and every
   envelope triggers the agent pipeline.
   ============================================================ */
const SEV_ORDER = { critical: 5, high: 4, medium: 3, moderate: 3, low: 2, note: 1, info: 1, warning: 3, error: 4 };
function sevBand(s, cvss) {
  if (cvss >= 9) return 'Critical'; if (cvss >= 7) return 'High'; if (cvss >= 4) return 'Medium';
  const n = SEV_ORDER[String(s || '').toLowerCase()] || 3;
  return n >= 5 ? 'Critical' : n >= 4 ? 'High' : n >= 3 ? 'Medium' : 'Low';
}

/* ---------- parsers ---------- */
function parseIntake(name, text) {
  const lower = (name || '').toLowerCase();
  let obj = null;
  try { obj = JSON.parse(text); } catch (e) { obj = null; }
  if (obj) {
    if (obj.runs && (obj.$schema || '').toString().indexOf('sarif') >= 0 || obj.runs) return parseSarif(obj, name);
    if (obj.bomFormat === 'CycloneDX' || obj.components) return parseCycloneDX(obj, name);
    if (obj.spdxVersion || obj.packages) return parseSpdx(obj, name);
    if (obj.findings) return normEnvelope(obj, name);
    if (Array.isArray(obj)) return normEnvelope({ source: 'test', tool: name, findings: obj }, name);
  }
  if (/\.csv$/.test(lower) || /,/.test((text || '').split('\n')[0] || '')) return parseCsv(text, name);
  return normEnvelope({ source: 'test', tool: name, findings: [{ title: truncate(name + ': ' + (text || '').slice(0, 120), 120), severity: 'medium', description: (text || '').slice(0, 800) }] }, name);
}
function normEnvelope(env, name) {
  return {
    source: env.source || 'test', tool: env.tool || name || 'intake', ts: env.ts ? Date.parse(env.ts) : Date.now(),
    findings: (env.findings || []).map(f => ({
      id: f.id || uid('fnd'), title: f.title || f.name || f.rule || 'Finding',
      severity: f.severity || f.level || 'medium', cvss: +(f.cvss || f.score || 0) || 0,
      cve: f.cve || (String(f.id || '').match(/CVE-\d{4}-\d+/) || [null])[0],
      asset: f.asset || f.component || f.target || '', path: f.path || f.file || f.location || '',
      description: f.description || f.message || '', controls: f.controls || [], status: f.status || 'open'
    }))
  };
}
function parseSarif(o, name) {
  const findings = [];
  (o.runs || []).forEach(run => {
    const tool = ((run.tool || {}).driver || {}).name || name || 'SAST';
    const rules = {}; (((run.tool || {}).driver || {}).rules || []).forEach(r => rules[r.id] = r);
    (run.results || []).forEach(r => {
      const loc = ((r.locations || [])[0] || {}).physicalLocation || {};
      const path = ((loc.artifactLocation || {}).uri) || '';
      const rule = rules[r.ruleId] || {};
      findings.push({
        id: r.ruleId || uid('sarif'), title: (rule.shortDescription || {}).text || r.ruleId || 'Static analysis finding',
        severity: r.level || (((rule.defaultConfiguration || {}).level) || 'warning'),
        description: ((r.message || {}).text || '') + ((loc.region || {}).startLine ? ' (line ' + loc.region.startLine + ')' : ''),
        path: path, asset: path.split('/')[0] || '', tool: tool
      });
    });
  });
  return normEnvelope({ source: 'sast', tool: name || 'SARIF', findings }, name);
}
function parseCycloneDX(o, name) {
  const findings = [];
  (o.vulnerabilities || []).forEach(v => {
    const r = (v.ratings || [])[0] || {};
    findings.push({
      id: v.id, cve: /^CVE-/.test(v.id || '') ? v.id : null, title: (v.description || v.id || '').slice(0, 110),
      severity: r.severity || 'medium', cvss: +r.score || 0,
      asset: ((v.affects || [])[0] || {}).ref || '', description: v.detail || v.description || ''
    });
  });
  const comps = (o.components || []).map(c => ({ n: c.name, v: c.version || '?', purl: c.purl || '' }));
  const env = normEnvelope({ source: 'sca', tool: name || 'CycloneDX', findings }, name);
  env.components = comps;
  return env;
}
function parseSpdx(o, name) {
  const comps = (o.packages || []).map(p => ({ n: p.name, v: p.versionInfo || '?', purl: '' }));
  const env = normEnvelope({ source: 'sca', tool: name || 'SPDX', findings: [] }, name);
  env.components = comps;
  return env;
}
function parseCsv(text, name) {
  const rows = String(text).trim().split(/\r?\n/).map(r => r.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []);
  const head = (rows.shift() || []).map(h => h.replace(/[",]/g, '').trim().toLowerCase());
  const idx = k => head.findIndex(h => h.indexOf(k) >= 0);
  const get = (r, k) => { const i = idx(k); return i < 0 ? '' : String(r[i] || '').replace(/^"|"?,?$/g, '').replace(/""/g, '"').trim(); };
  const findings = rows.filter(r => r.length > 1).map(r => ({
    id: get(r, 'id') || uid('pt'), title: get(r, 'title') || get(r, 'finding') || get(r, 'name') || 'Pentest finding',
    severity: get(r, 'sever') || get(r, 'risk') || 'medium', cvss: +get(r, 'cvss') || 0,
    asset: get(r, 'asset') || get(r, 'host') || get(r, 'target'), description: get(r, 'desc') || get(r, 'detail'),
    cve: (get(r, 'cve').match(/CVE-\d{4}-\d+/) || [null])[0], status: get(r, 'status') || 'open'
  }));
  return normEnvelope({ source: 'pentest', tool: name || 'CSV', findings }, name);
}

/* ---------- map a finding onto the model ---------- */
function mapFinding(m, f) {
  const hay = (f.path + ' ' + f.asset + ' ' + f.title + ' ' + f.description).toLowerCase();
  let best = null, score = 0;
  m.nodes.filter(n => n.kind !== 'threat').forEach(n => {
    let sc = 0;
    (n.files || []).forEach(p => { if (f.path && p.toLowerCase().indexOf(String(f.path).toLowerCase()) >= 0) sc += 5; });
    if (f.path) signalsFor(f.path).forEach(sig => { if (n.id.indexOf(sig.tag) >= 0 || n.name === sig.name) sc += 4; });
    (n.sbom || []).forEach(c => { if (hay.indexOf(String(c.n).toLowerCase()) >= 0) sc += 4; });
    n.name.toLowerCase().split(/[\s\/&()]+/).filter(w => w.length > 3).forEach(w => { if (hay.indexOf(w) >= 0) sc += 2; });
    (n.proto || []).forEach(p => { if (hay.indexOf(p.toLowerCase().split(' ')[0]) >= 0) sc += 1; });
    if (sc > score) { score = sc; best = n; }
  });
  return score >= 2 ? best : null;
}

/* ---------- the intake agent ---------- */
async function runIntake(ctx) {
  const p = P(), m = p.model;
  if (!ctx.envelopes || !ctx.envelopes.length) return 'no artefact in this run';
  p.intake = p.intake || [];
  ctx.findings = [];
  ctx.fetched = ctx.fetched || [];
  ctx.envelopes.forEach(env => {
    p.intake.unshift({ ts: env.ts || Date.now(), source: env.source, tool: env.tool, count: (env.findings || []).length });
    if (env.components && env.components.length) {
      // merge an SBOM into the element that best matches each component
      let merged = 0;
      env.components.slice(0, 60).forEach(c => {
        const n = mapFinding(m, { path: '', asset: c.n, title: c.n, description: c.purl || '' }) || m.nodes.find(x => x.kind === 'service');
        if (!n) return;
        n.sbom = n.sbom || [];
        if (!n.sbom.find(x => x.n === c.n)) { n.sbom.push({ n: c.n, v: c.v, k: '' }); merged++; }
      });
      if (merged) alog('intake', 'Merged ' + merged + ' SBOM component(s) from ' + env.tool + '.');
    }
    (env.findings || []).forEach(f => {
      const node = mapFinding(m, f);
      const rec = Object.assign({}, f, {
        source: env.source, tool: env.tool, ts: env.ts || Date.now(),
        element: node ? node.id : null, elementName: node ? node.name : 'unassigned',
        band: sevBand(f.severity, f.cvss)
      });
      ctx.findings.push(rec);
      if (f.cve) ctx.fetched.push({ id: f.cve, t: truncate(f.title, 110), s: f.description || f.title, c: f.cvss || 7, published: new Date(env.ts || Date.now()).toISOString(), src: env.tool, keyword: f.asset || '' });
    });
    logInput(env.source === 'compliance' ? 'evidence' : env.source === 'cve' || env.source === 'zero-day' ? 'zero-day' : 'scan',
      env.tool + ': ' + (env.findings || []).length + ' finding(s) received' + (env.components ? ', ' + env.components.length + ' components' : '') + '.',
      { source: env.source });
  });
  ctx.newFindings = ctx.findings;
  alog('intake', ctx.findings.length + ' finding(s) normalised; ' + ctx.findings.filter(f => f.element).length + ' mapped to a model element.');
  return ctx.findings.length + ' findings, ' + ctx.findings.filter(f => f.element).length + ' mapped';
}

/* ---------- pipeline, extended for intake and register ---------- */
AGENTS.unshift({ id: 'intake', name: 'Intake agent', desc: 'Normalises SARIF, CycloneDX, SPDX, pentest exports, CVE notifications and compliance attestations into one envelope, then maps each finding onto an element.', status: 'idle', last: null });
AGENTS.push(

  { id: 'compliance', name: 'Compliance agent', desc: 'Files each finding as evidence against SOC 2, ISO 27001, HIPAA, CMMC and the FDA premarket sections, and queues the outbound push to your compliance tool.', status: 'idle', last: null }
);

runPipeline = async function (trigger, seed, opts) {
  opts = opts || {};
  if (!P()) { toast('Open a project first.'); return; }
  if (pipelineBusy) { toast('The agents are already running.'); return; }
  pipelineBusy = true;
  const ctx = { trigger, seed, envelopes: opts.envelopes || null, fetched: [], hits: [], zerodays: [], changed: [], findings: [] };
  alog('pipeline', 'Run started · trigger: ' + trigger + (seed ? ' · ' + seed : ''));
  for (const a of AGENTS) {
    if (!CFG.agents[a.id]) { setStatus(a.id, 'idle', 'disabled'); continue; }
    if (a.id === 'feed' && opts.skipFeed) { setStatus(a.id, 'idle', 'skipped for this trigger'); continue; }
    if (a.id === 'intake' && !ctx.envelopes) { setStatus(a.id, 'idle', 'no artefact'); continue; }
    setStatus(a.id, 'run');
    try {
      const r = await RUNNERS[a.id](ctx);
      setStatus(a.id, 'ok', r); alog(a.id, 'Done — ' + r);
    } catch (e) {
      setStatus(a.id, 'err', e.message); alog(a.id, 'Failed — ' + e.message, 'err');
      if (a.id === 'feed' && !ctx.envelopes) break;
    }
  }
  pipelineBusy = false;
  refreshAll();
  if (ctx.zerodays.length) toast('<b>' + ctx.zerodays.length + ' zero-day trigger(s)</b> matched this product. See the Agents tab.', 8000);
  else if (ctx.findings.length) toast(ctx.findings.length + ' finding(s) intaken · register and evidence updated.');
  else if (ctx.hits.length) toast(ctx.hits.length + ' advisory matches attached to the model.');
  return ctx;
};

function ingestFiles(fileList) {

  let done = 0; const envs = [];
  files.forEach(f => {

}

function ctrlLabel(cid) {
  const [fw, c] = cid.split(':');
  return fw + ' ' + c + ((COMPLIANCE[fw] || {})[c] ? ' — ' + COMPLIANCE[fw][c] : '');
}
function nextRid(p) {
  const n = (p.register || []).length + 1;
  return 'R-' + String(n).padStart(3, '0');
}
function ensureStores(p) { p.register = p.register || []; p.evidence = p.evidence || []; p.outbox = p.outbox || []; p.intake = p.intake || []; }

function upsertRisk(p, key, data) {
  ensureStores(p);
  let e = p.register.find(r => r.key === key);
  const now = Date.now();
  if (!e) {
    e = Object.assign({
      id: nextRid(p), key, ts: now, updated: now, status: 'open', owner: '', due: '',
      treatment: 'mitigate', controls: [], evidence: [], history: [{ ts: now, what: 'opened' }]
    }, data);
    p.register.unshift(e);
    return { entry: e, isNew: true };
  }
  const changed = [];
  ['inherentBand', 'inherentScore', 'residualBand', 'residualScore', 'title', 'elementName'].forEach(k => {
    if (data[k] !== undefined && e[k] !== data[k]) { changed.push(k + ': ' + e[k] + ' → ' + data[k]); e[k] = data[k]; }
  });
  if (data.controls) e.controls = uniq((e.controls || []).concat(data.controls));
  if (changed.length) { e.updated = now; e.history.push({ ts: now, what: changed.join('; ') }); }
  return { entry: e, isNew: false, changed: changed.length };
}

async function runRegister(ctx) {
  const p = P(), m = p.model; ensureStores(p);
  const risks = m._risks || analyze(m);
  let opened = 0, updated = 0;
  risks.forEach(r => {
    const target = r.kind === 'flow' ? (m.flows.find(f => f.id === r.ref) || {}).to : r.ref;
    const n = nodeById(m, target);
    const ctrls = uniq([].concat.apply([], (r.triggers || []).map(t => CTRL_MAP[t] || [])));
    const res = upsertRisk(p, 'model:' + r.kind + ':' + r.ref + ':' + r.title.slice(0, 40), {
      title: r.title, source: 'threat model', element: target, elementName: n ? n.name : '',
      zone: r.boundary || '', inherentBand: r.band, inherentScore: r.score,
      residualBand: r.rBand, residualScore: r.rScore, controls: ctrls,
      safety: r.safety ? r.safety.hazard : '', cves: r.cves
    });
    res.isNew ? opened++ : (res.changed ? updated++ : 0);
  });
  (ctx.findings || []).forEach(f => {
    const ctrls = SOURCE_CTRL[f.source] || SOURCE_CTRL.test;
    const res = upsertRisk(p, 'intake:' + f.source + ':' + (f.id || f.title).slice(0, 60) + ':' + String(f.path || f.asset || '').slice(0, 60), {
      title: truncate(f.title, 90), source: f.source + ' · ' + f.tool, element: f.element, elementName: f.elementName,
      zone: f.element ? ((zoneById(m, (nodeById(m, f.element) || {}).zone) || {}).name || '') : '',
      inherentBand: f.band, inherentScore: { Critical: 20, High: 12, Medium: 6, Low: 2 }[f.band] || 6,
      residualBand: f.band, residualScore: { Critical: 20, High: 12, Medium: 6, Low: 2 }[f.band] || 6,
      controls: ctrls, detail: truncate(f.description || '', 400), cves: f.cve ? [f.cve] : []
    });
    res.isNew ? opened++ : (res.changed ? updated++ : 0);
  });
  const today = new Date().toISOString().slice(0, 10);
  p.register.forEach(e => { if (e.due && e.due < today && e.status === 'open') e.status = 'overdue'; });
  alog('register', opened + ' entr(y/ies) opened, ' + updated + ' updated. Register holds ' + p.register.length + '.');
  ctx.registerOpened = opened;
  return opened + ' opened / ' + updated + ' updated';
}

async function runCompliance(ctx) {
  const p = P(); ensureStores(p);
  const now = Date.now();
  let ev = 0;
  (ctx.findings || []).forEach(f => {
    const ctrls = uniq((f.controls || []).concat(SOURCE_CTRL[f.source] || []));
    const reg = p.register.find(r => r.key === 'intake:' + f.source + ':' + (f.id || f.title).slice(0, 60) + ':' + String(f.path || f.asset || '').slice(0, 60));
    p.evidence.unshift({
      id: uid('ev'), ts: f.ts || now, type: f.source, source: f.tool,
      summary: truncate(f.title, 90) + (f.elementName ? ' — ' + f.elementName : ''),
      controlIds: ctrls, riskId: reg ? reg.id : null, band: f.band, artifact: truncate(f.description || '', 300)
    });
    ev++;
  });
  (ctx.zerodays || []).forEach(h => {
    p.evidence.unshift({
      id: uid('ev'), ts: now, type: 'zero-day', source: 'NVD / CISA KEV',
      summary: h.adv.id + ' affects ' + h.node.name, controlIds: SOURCE_CTRL['zero-day'],
      riskId: null, band: 'Critical', artifact: truncate(h.adv.s || h.adv.t, 300)
    });
    ev++;
  });
  if (ev) {
    const batch = p.evidence.slice(0, ev);
    p.outbox.unshift({
      id: uid('ob'), ts: now, status: 'queued', target: CFG.outboundTarget || 'webhook',
      summary: ev + ' evidence record(s) · ' + P().product + ' v' + P().version,
      payload: {
        product: p.product, version: p.version, generated: new Date(now).toISOString(),
        evidence: batch.map(e => ({ id: e.id, ts: new Date(e.ts).toISOString(), type: e.type, source: e.source, summary: e.summary, controls: e.controlIds, risk: e.riskId, severity: e.band })),
        register: p.register.slice(0, 40).map(r => ({ id: r.id, title: r.title, status: r.status, owner: r.owner, due: r.due, inherent: r.inherentBand, residual: r.residualBand, controls: r.controls, element: r.elementName }))
      }
    });
    if (CFG.outboundUrl && CFG.outboundAuto) await sendOutbox(true);
  }
  const covered = uniq([].concat.apply([], p.evidence.map(e => e.controlIds || []))).length;
  alog('compliance', ev + ' evidence record(s) filed; ' + covered + ' control(s) now have evidence.');
  return ev + ' evidence, ' + covered + ' controls covered';
}

async function sendOutbox(quiet) {
  const p = P(); ensureStores(p);
  const queued = p.outbox.filter(o => o.status === 'queued');
  if (!queued.length) { if (!quiet) toast('The outbox is empty.'); return; }
  if (!CFG.outboundUrl) {
    if (!quiet) toast('No destination set. Add one under Admin → Continuous feedback, or download the outbox and let a job deliver it.');
    return;
  }
  for (const o of queued) {
    try {
      const r = await fetch(feedUrl(CFG.outboundUrl), {
        method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, CFG.outboundToken ? { Authorization: 'Bearer ' + CFG.outboundToken } : {}),
        body: JSON.stringify({ target: o.target, product: p.product, version: p.version, payload: o.payload })
      });
      o.status = r.ok ? 'sent' : 'failed'; o.note = r.ok ? '' : 'HTTP ' + r.status;
    } catch (e) { o.status = 'failed'; o.note = e.message; }
    o.sentAt = Date.now();
  }
  const sent = queued.filter(o => o.status === 'sent').length;
  alog('compliance', 'Outbox: ' + sent + ' of ' + queued.length + ' delivered to ' + (CFG.outboundTarget || 'webhook') + '.');
  if (!quiet) toast(sent + ' of ' + queued.length + ' item(s) delivered.');
  renderRight();
}

function registerFromFramework() {
  const p = P(), m = p.model; ensureStores(p);

    const g = p.frameworkHits.filter(h => h.tech.id === id), t = g[0].tech;
    const res = upsertRisk(p, 'fw:' + p.fw + ':' + id, {
      title: t.id + ' — ' + t.name, source: FRAMEWORKS.find(f => f.id === p.fw).name,
      element: g[0].targetId, elementName: uniq(g.map(x => x.label)).slice(0, 3).join('; '),
      zone: uniq(g.map(x => x.zone).filter(Boolean)).join(', '),
      inherentBand: g.length > 3 ? 'High' : 'Medium', inherentScore: g.length > 3 ? 12 : 6,
      residualBand: 'Medium', residualScore: 6, controls: ['SOC2:CC7.1', 'ISO27001:A.8.8'], detail: g[0].why
    });
    if (res.isNew) n++;
  });
  logInput('edit', n + ' framework technique(s) added to the risk register.');

}

/* ---------------- remediation ---------------- */
function fixFlow(m, f) {
  const ch = [];
  const rf = /BLE|Bluetooth|RF|802\.11/i.test(f.proto || '');
  const phys = /USB|UART|JTAG|serial/i.test(f.proto || '');
  const dat = (f.data || []).join(' ');
  if (noEnc(f.enc) || weakEnc(f.enc)) {
    const was = f.enc;
    f.enc = rf ? 'AES-CCM (LESC), per-session key' : phys ? 'AES-GCM session key' : 'TLS 1.3';
    ch.push('encryption ' + was + ' → ' + f.enc);
  }
  if (weakAuth(f.auth)) {
    const was = f.auth;
    f.auth = rf ? 'bonded pairing, per-device key in secure element' : phys ? 'signed technician token' : 'mutual TLS, per-device credential';
    ch.push('authentication ' + was + ' → ' + f.auth);
  }
  if (/firmware/i.test(dat) && !/boot ROM|signature/i.test(f.auth)) { f.auth += ', signature verified in boot ROM'; ch.push('update path now verified before execution'); }
  if (/therapy|order|command|drug library/i.test(dat) && !/nonce|counter/i.test(f.auth)) { f.auth += ', nonce and monotonic counter'; ch.push('replay defeated by freshness on every command'); }
  if (!/log|audit|sign/i.test(f.auth)) { f.auth += ', signed audit record'; ch.push('interface now produces a non-repudiable record'); }
  f.remediated = true; f.fixNote = ch.join('; ');
  return ch;
}
function fixNode(m, n) {
  const ch = [];
  const high = (n.cves || []).filter(v => v.c >= 7).length;
  if (high) { n.cves = (n.cves || []).filter(v => v.c < 7); ch.push(high + ' high-severity advisory(ies) closed'); }
  (n.sbom || []).forEach(c => {
    if ((KB.cve[c.k] || []).length) { ch.push(c.n + ' ' + c.v + ' → upgraded'); c.v = c.v + '+fixed'; c.k = ''; }
  });
  if (noEnc(n.enc) && /PHI|PII|credential|key/i.test((n.data || []).join(' '))) { n.enc = 'AES-256 at rest, KMS envelope key'; ch.push('data at rest encrypted'); }
  if (weakAuth(n.auth)) { n.auth = 'per-identity credential, MFA where human'; ch.push('element authentication strengthened'); }
  n.remediated = true; n.fixNote = ch.join('; ');
  return ch;
}
function remediate(riskId, opts) {
  const p = P(), m = p.model;
  const risks = m._risks || analyze(m);
  const list = riskId === '*' ? risks.filter(r => r.band === 'Critical' || r.band === 'High') : risks.filter(r => r.id === riskId);
  if (!list.length) return null;
  if (!opts || !opts.dry) snapshot(riskId === '*' ? 'apply all recommended fixes' : 'apply fix');
  const work = opts && opts.dry ? JSON.parse(JSON.stringify(m)) : m;
  const changes = [];
  list.forEach(r => {
    if (r.kind === 'flow') {
      const f = work.flows.find(x => x.id === r.ref);
      if (f) changes.push({ risk: r, on: f.label, ch: fixFlow(work, f) });
      const tgt = f ? work.nodes.find(n => n.id === f.to) : null;
      if (tgt && /PHI|PII/i.test((f.data || []).join(' ')) && noEnc(tgt.enc)) { tgt.enc = 'AES-256 at rest, KMS envelope key'; }
    } else {
      const n = work.nodes.find(x => x.id === r.ref);
      if (n) changes.push({ risk: r, on: n.name, ch: fixNode(work, n) });
    }
  });
  const after = analyze(work);
  const sumBefore = summary(m, risks), sumAfter = summary(work, after);
  if (opts && opts.dry) return { changes, before: sumBefore, after: sumAfter, dry: true };

  m._risks = after;
  changes.forEach(c => {
    const key = 'model:' + c.risk.kind + ':' + c.risk.ref + ':' + c.risk.title.slice(0, 40);
    const e = (p.register || []).find(x => x.key === key);
    if (e) {
      e.status = 'in progress'; e.treatment = 'mitigate'; e.updated = Date.now();
      e.history.push({ ts: Date.now(), what: 'control applied — ' + (c.ch.join('; ') || 'no property change needed') });
    }
    ensureStores(p);
    p.evidence.unshift({
      id: uid('ev'), ts: Date.now(), type: 'remediation', source: 'model change',
      summary: 'Control applied to ' + c.on + ' — ' + truncate(c.ch.join('; '), 90),
      controlIds: uniq([].concat.apply([], (c.risk.triggers || []).map(t => CTRL_MAP[t] || []))),
      riskId: e ? e.id : null, band: c.risk.band, artifact: c.risk.title
    });
  });
  logInput('edit', 'Remediation applied to ' + changes.length + ' item(s): ' +
    truncate(changes.map(c => c.on).join(', '), 140) + '.');
  alog('remediation', changes.length + ' item(s) remediated. Composite index ' + sumBefore.score + ' → ' + sumAfter.score + '.');
  p.attack = null; p.attackCache = null; p.kgCache = null;
  return { changes, before: sumBefore, after: sumAfter };
}

/* ---------------- simpler attack graph ---------------- */
S.attackDetail = false;
function buildSimpleAttackGraph(m) {
  if (!m.nodes.length || !m.flows.length) return { nodes: [], edges: [], simple: true };
  const risks = m._risks || analyze(m);
  const rOf = f => risks.find(r => r.kind === 'flow' && r.ref === f.id) || {};
  const nodes = [], edges = [];
  const push = (id, label, layer, meta) => { if (!nodes.find(n => n.id === id)) nodes.push(Object.assign({ id, label, layer, w: 250, h: 62 }, meta)); return id; };
  const worse = (a, b) => ['Low', 'Medium', 'High', 'Critical'].indexOf(a) >= ['Low', 'Medium', 'High', 'Critical'].indexOf(b) ? a : b;

  /* one entry per originating zone */
  const byZone = {};
  m.flows.forEach(f => {
    const za = zoneOf(m, f.from), zb = zoneOf(m, f.to);
    if (!za || !zb || za.id === zb.id) return;
    if (TRUST_RANK[za.trust] > 1) return;
    const b = nodeById(m, f.to); if (!b || b.kind === 'threat') return;
    const g = byZone[za.id] = byZone[za.id] || { zone: za, band: 'Low', targets: {}, weak: {} };
    g.band = worse(g.band, (rOf(f) || {}).band || 'Medium');
    g.targets[b.id] = Math.max(g.targets[b.id] || 0, (rOf(f) || {}).score || 1);
    const wk = noAuth(f.auth) ? 'unauthenticated' : noEnc(f.enc) ? 'cleartext' : weakAuth(f.auth) ? 'shared credential' : 'protocol abuse';
    g.weak[wk] = (g.weak[wk] || 0) + 1;
  });
  const rank = b => ['Low', 'Medium', 'High', 'Critical'].indexOf(b);
  Object.values(byZone)
    .sort((a, b) => (rank(b.band) - rank(a.band)) || (Object.keys(b.targets).length - Object.keys(a.targets).length))
    .slice(0, 3).forEach(g => {
    const eid = push('sz_' + g.zone.id, 'Attacker on ' + g.zone.name, 0,
      { band: g.band, zone: g.zone.name, tint: g.zone.tint, trust: g.zone.trust, note: 'Reaches the product across this boundary' });
    const top = Object.keys(g.targets).sort((a, b) => g.targets[b] - g.targets[a])
      .slice(0, Object.keys(byZone).length > 2 ? 1 : 2);
    top.forEach(id => {
      const n = nodeById(m, id), z = zoneById(m, n.zone);
      const fid = push('sn_' + id, n.name, 1, { band: g.band, zone: z ? z.name : '', tint: z ? z.tint : '', note: n.tech || KIND_LABEL[n.kind] || '' });
      const wk = Object.keys(g.weak).sort((a, b) => g.weak[b] - g.weak[a])[0] || 'protocol abuse';
      edges.push({ from: eid, to: fid, label: wk });
    });
  });

  /* one movement column: the assets that matter */
  const crown = m.nodes.filter(n => n.kind !== 'threat' &&
    (n.scope === 'fleet' || /therapy|firmware|order|drug library|PHI/i.test((n.data || []).join(' '))))
    .map(n => ({ n, w: (n.scope === 'fleet' ? 2 : 0) + (/therapy|firmware/i.test((n.data || []).join(' ')) ? 2 : 1) }))
    .sort((a, b) => b.w - a.w).slice(0, 3);
  crown.forEach(c => {
    const z = zoneById(m, c.n.zone);
    const xid = push('sx_' + c.n.id, c.n.name, 2, {
      band: c.w >= 3 ? 'Critical' : 'High', zone: z ? z.name : '', tint: z ? z.tint : '',
      note: (c.n.data || []).slice(0, 2).join(', ') + (c.n.scope === 'fleet' ? ' · multi-patient' : '')
    });
    nodes.filter(n => n.layer === 1).forEach(fh => {
      const src = fh.id.slice(3);
      const reach = m.flows.some(f => (f.from === src && f.to === c.n.id) || (f.from === c.n.id && f.to === src));
      if (reach || fh.zone === (z || {}).name) edges.push({ from: fh.id, to: xid, label: reach ? 'direct interface' : 'same zone' });
    });
  });

  /* three impacts at most */
  const dAll = m.nodes.map(n => (n.data || []).join(' ')).join(' ');
  const imp = [];
  if (/therapy|order|drug library/i.test(dAll)) imp.push(['si_therapy', 'Unintended or withheld therapy', 'Critical', 'Direct patient harm']);
  if (/firmware/i.test(dAll)) imp.push(['si_fw', 'Malicious firmware across the fleet', 'Critical', 'Harm scales to every device']);
  if (/PHI|PII/i.test(dAll)) imp.push(['si_phi', 'Mass disclosure of patient data', 'High', 'Breach notification and loss of trust']);
  if (imp.length < 3) imp.push(['si_dos', 'Loss of availability during care', 'High', 'Unavailable when clinicians need it']);
  imp.slice(0, 3).forEach(([id, label, band, note]) => {
    push(id, label, 3, { band, zone: 'Patient / business impact', tint: TINT.critical, note });
    nodes.filter(n => n.layer === 2).forEach(x => {
      const src = nodeById(m, x.id.slice(3)); if (!src) return;
      const dd = (src.data || []).join(' ');
      const fit = (id === 'si_therapy' && /therapy|order|drug library/i.test(dd)) ||
        (id === 'si_fw' && /firmware/i.test(dd)) ||
        (id === 'si_phi' && /PHI|PII/i.test(dd)) ||
        (id === 'si_dos' && src.scope === 'fleet');
      if (fit) edges.push({ from: x.id, to: id, label: id === 'si_fw' ? 'update path abuse' : id === 'si_phi' ? 'bulk read' : id === 'si_dos' ? 'resource exhaustion' : 'command or parameter change' });
    });
  });

  const cols = [0, 1, 2, 3].map(l => nodes.filter(n => n.layer === l));
