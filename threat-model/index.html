<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreatForge — Product Threat Modeling &amp; FDA Premarket Views</title>
<style>
:root{
  --ink:#12212b; --ink2:#40525e; --ink3:#7b8b96;
  --petrol:#1b4965; --petrol2:#2c6e8f; --line:#dfe6ec;
  --paper:#f4f7f9; --panel:#ffffff; --rail:#eef3f6;
  --z-blue:#e9f2fa; --z-green:#e9f6ef; --z-amber:#fdf3e5; --z-rose:#fdeceb;
  --z-violet:#f2edf9; --z-slate:#eef1f5; --z-teal:#e6f4f4;
  --low:#5c9e7a; --med:#c99236; --high:#c9663a; --crit:#b03a48;
  --shadow:0 1px 2px rgba(18,33,43,.06), 0 6px 18px rgba(18,33,43,.08);
  --shadow-lg:0 2px 6px rgba(18,33,43,.08), 0 18px 44px rgba(18,33,43,.16);
  --fs:14px;
  --lw:280px; --rw:340px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:var(--fs)/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}

/* ---------- top bar ---------- */
header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,#fff,#fbfdfe);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(18,33,43,.03);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.2px;color:var(--petrol)}
.brand .dot{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 210deg,#1b4965,#2c6e8f,#7fb2c9,#1b4965);
  box-shadow:inset 0 0 0 3px #fff, var(--shadow)}
.brand small{display:block;font-weight:450;font-size:10.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.sep{width:1px;height:26px;background:var(--line)}
.proj{display:flex;align-items:center;gap:6px;background:var(--rail);border:1px solid var(--line);
  border-radius:9px;padding:4px 6px 4px 10px;max-width:360px}
.proj b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.proj .ver{font-size:11px;color:var(--ink3);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;
  color:var(--ink2);box-shadow:0 1px 1px rgba(18,33,43,.04);transition:.15s}
.btn:hover{border-color:#c3d2dc;color:var(--petrol);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.pri{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.pri:hover{background:var(--petrol2);color:#fff}
.btn.on{background:#e8f1f6;border-color:#a9c8d8;color:var(--petrol);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ---------- layout ---------- */
main{position:absolute;top:52px;left:0;right:0;bottom:26px;display:grid;
  grid-template-columns:var(--lw) 1fr var(--rw);gap:10px;padding:10px}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.frame.pop{position:fixed;inset:16px;z-index:60;box-shadow:var(--shadow-lg)}
.fhead{height:38px;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#fafcfd);flex:0 0 auto}
.fhead h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:650}
.fbody{flex:1;overflow:auto;min-height:0;position:relative}
.zoomctl{display:flex;align-items:center;gap:2px;background:var(--rail);border-radius:8px;padding:2px}
.icb{width:24px;height:22px;border:0;background:transparent;border-radius:6px;color:var(--ink2);font-size:13px;line-height:1}
.icb:hover{background:#fff;box-shadow:0 1px 2px rgba(18,33,43,.1);color:var(--petrol)}
.zlabel{font-size:11px;color:var(--ink3);min-width:34px;text-align:center}
.scaler{transform-origin:0 0}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto;overflow-x:auto}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:6px 12px;border-radius:9px 9px 0 0;
  font-size:12.5px;color:var(--ink3);white-space:nowrap}
.tab:hover{color:var(--petrol);background:#f6fafc}
.tab.on{background:#fff;border-color:var(--line);color:var(--petrol);font-weight:650;
  box-shadow:0 -2px 0 var(--petrol) inset}

/* ---------- left: sources + tree ---------- */
.pad{padding:12px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:650;margin:0 0 6px}
.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fcfdfe;font-size:13px}
.field:focus{outline:2px solid #cfe3ee;border-color:#a9c8d8}
textarea.field{resize:vertical;min-height:74px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2)}
.chip:hover{border-color:#a9c8d8;color:var(--petrol)}
.chip.on{background:#e8f1f6;border-color:#a9c8d8;color:var(--petrol);font-weight:600}
.tree{padding:4px 8px 16px;font-size:12.5px}
.tnode{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:7px;cursor:default;white-space:nowrap}
.tnode:hover{background:#f2f7fa}
.tnode.hit{background:#fdf3e5}
.tw{width:12px;text-align:center;color:var(--ink3);font-size:10px;cursor:pointer;user-select:none}
.tf{color:var(--petrol);opacity:.75}
.tname{overflow:hidden;text-overflow:ellipsis}
.tsig{margin-left:auto;font-size:10px;color:#a3702a;background:#fdf3e5;border-radius:5px;padding:0 5px}
.kids{margin-left:12px;border-left:1px dashed #e3ebf0;padding-left:4px}

/* ---------- right panel ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px;margin:0 0 10px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--petrol);letter-spacing:-.1px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;font-size:12.5px}
.kv span{color:var(--ink3)}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:650;color:#fff}
.b-low{background:var(--low)} .b-med{background:var(--med)} .b-high{background:var(--high)} .b-crit{background:var(--crit)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink2);background:#fbfdfe;margin:0 4px 4px 0}
.risk{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:#fff;box-shadow:var(--shadow)}
.risk:hover{border-color:#c3d2dc}
.risk .rt{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.risk h4{margin:0;font-size:12.8px;font-weight:650;line-height:1.35}
.risk p{margin:5px 0 0;font-size:12px;color:var(--ink2)}
.risk .meta{font-size:11px;color:var(--ink3);margin-top:6px}
.acc{border-top:1px dashed var(--line);margin-top:7px;padding-top:6px;font-size:12px;color:var(--ink2)}
.acc b{color:var(--petrol);font-weight:650}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  border-bottom:1px solid var(--line);padding:5px 6px;position:sticky;top:0;background:#fff}
table.t td{border-bottom:1px solid #f0f4f7;padding:5px 6px;vertical-align:top}
table.t tr:hover td{background:#f8fbfc}

/* ---------- canvas ---------- */
.stage{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, #e3ebf0 1px, transparent 0) 0 0/22px 22px, #fbfdfe}
.stage svg{width:100%;height:100%;display:block;cursor:grab}
.stage.dragging svg{cursor:grabbing}
.stage.tool svg{cursor:crosshair}
.overbar{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
.overbar > *{pointer-events:auto}
.grp{display:flex;gap:3px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;
  padding:3px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.legend{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:11px;z-index:5;max-width:220px}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0;color:var(--ink2)}
.sw{width:11px;height:11px;border-radius:3px;box-shadow:0 0 0 1px rgba(18,33,43,.08)}
.coach{position:absolute;left:12px;bottom:12px;max-width:330px;background:#fff;border:1px solid #cfe0ea;border-left:3px solid var(--petrol);
  border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-lg);z-index:6;font-size:12.5px}
.coach b{color:var(--petrol)}
.coach .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--ink3);font-size:14px}

/* ---------- modal / tooltip / toast ---------- */
.veil{position:fixed;inset:0;background:rgba(18,33,43,.34);backdrop-filter:blur(2px);z-index:80;display:none;
  align-items:center;justify-content:center;padding:24px}
.veil.on{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);max-width:840px;width:100%;max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden}
.modal header{height:auto;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
.modal h2{margin:0;font-size:16px;color:var(--petrol)}
.modal .body{padding:16px 18px;overflow:auto}
.modal .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fbfdfe}
.tip{position:fixed;z-index:95;background:#12212b;color:#eaf1f5;border-radius:8px;padding:6px 9px;font-size:11.5px;
  max-width:280px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow-lg);line-height:1.45}
.tip.on{opacity:1}
.toasts{position:fixed;right:14px;bottom:34px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--petrol);border-radius:10px;padding:9px 12px;
  box-shadow:var(--shadow-lg);font-size:12.5px;max-width:320px;animation:sl .2s ease}
@keyframes sl{from{opacity:0;transform:translateX(12px)}}
footer{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;gap:12px;padding:0 14px;
  border-top:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--ink3)}
.dropwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;min-width:230px;display:none;z-index:70}
.menu.on{display:block}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:7px 9px;border-radius:8px;
  font-size:12.5px;color:var(--ink2);text-align:left}
.menu button:hover{background:#f2f7fa;color:var(--petrol)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.menu .h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:6px 9px 3px;font-weight:650}
.empty{padding:26px 18px;text-align:center;color:var(--ink3);font-size:12.5px}
.empty b{display:block;color:var(--ink2);font-size:13.5px;margin-bottom:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#dae4ea;border-radius:8px;border:3px solid #fff}
::-webkit-scrollbar-thumb:hover{background:#c3d2dc}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><span>ThreatForge<small>product security workbench</small></span></div>
  <div class="sep"></div>
  <div class="proj" data-tip="Current project. Each project holds one product at one version.">
    <b id="pName">No project</b><span class="ver" id="pVer">—</span>
    <button class="icb" id="btnProjects" data-tip="Open, create, duplicate or delete projects">▾</button>
  </div>
  <button class="btn" id="btnNew" data-tip="Create a new project for a product and version">New project</button>
  <button class="btn" id="btnSave" data-tip="Save this project to this browser (localStorage)">Save</button>
  <div class="spacer"></div>
  <button class="btn" id="btnEdit" data-tip="Edit mode: add, change, move and delete anything on the canvas">Edit mode</button>
  <button class="btn sm" id="btnUndo" data-tip="Undo (Ctrl+Z)">↶</button>
  <button class="btn sm" id="btnRedo" data-tip="Redo (Ctrl+Shift+Z)">↷</button>
  <div class="sep"></div>
  <div class="dropwrap">
    <button class="btn pri" id="btnExport" data-tip="Export the current view or the whole package">Export ▾</button>
    <div class="menu" id="mExport">
      <div class="h">Current diagram</div>
      <button data-x="svg">Save as SVG</button>
      <button data-x="pdf">Save as PDF (print)</button>
      <button data-x="png">Save as PNG</button>
      <div class="h">Full package · this version</div>
      <button data-x="doc">Word report (.doc) with all diagrams</button>
      <button data-x="md">Text model (.md)</button>
      <button data-x="json">Project file (.json)</button>
      <button data-x="allpdf">All diagrams as PDF</button>
    </div>
  </div>
  <button class="btn" id="btnHelp" data-tip="Help, keyboard shortcuts and method notes">Help</button>
</header>

<main>
  <!-- ============ LEFT ============ -->
  <section class="frame" id="frameL">
    <div class="fhead">
      <h2>Input</h2><div class="spacer"></div>
      <div class="zoomctl"><button class="icb" data-zoom="L,-1">−</button><span class="zlabel" id="zL">100%</span><button class="icb" data-zoom="L,1">+</button></div>
      <button class="icb" data-pop="frameL" data-tip="Pop this frame in or out">⤢</button>
    </div>
    <div class="fbody"><div class="scaler" id="scL">
      <div class="pad">
        <p class="lbl">Start from a sample</p>
        <div class="chips" id="samples"></div>
        <p class="lbl" style="margin-top:14px">Or bring your own</p>
        <input class="field" id="repoUrl" placeholder="https://github.com/org/repo">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn sm" id="btnRepo" data-tip="Reads the public file tree from the GitHub API">Read repo tree</button>
          <button class="btn sm" id="btnFiles" data-tip="Pick a local folder or files; nothing leaves your browser">Add local files</button>
          <input type="file" id="filePick" multiple webkitdirectory style="display:none">
        </div>
        <textarea class="field" id="pasteTree" style="margin-top:8px"
          placeholder="Paste a file tree, an interface list, or a design note. One path or line per row:&#10;firmware/ble/gatt_server.c&#10;cloud/api/dose_command.py&#10;docs/sbom.spdx.json"></textarea>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn sm" id="btnPaste">Build model from text</button>
          <button class="btn sm" id="btnFeature" data-tip="Describe a new feature; it is added to the existing model as a change set">Add a feature</button>
        </div>
      </div>
      <div style="border-top:1px solid var(--line)">
        <div class="pad" style="padding-bottom:2px;display:flex;align-items:center">
          <p class="lbl" style="margin:0">Source tree</p><div class="spacer"></div>
          <button class="btn sm" id="btnExpand">Expand all</button>
        </div>
        <div class="tree" id="tree"></div>
      </div>
    </div></div>
  </section>

  <!-- ============ CENTER ============ -->
  <section class="frame" id="frameC">
    <div class="fhead">
      <h2>Diagrams</h2><div class="spacer"></div>
      <div class="zoomctl"><button class="icb" data-zoom="C,-1">−</button><span class="zlabel" id="zC">100%</span><button class="icb" data-zoom="C,1">+</button></div>
      <button class="icb" id="btnFit" data-tip="Fit diagram to the frame">◫</button>
      <button class="icb" data-pop="frameC" data-tip="Pop this frame in or out">⤢</button>
    </div>
    <div class="tabs" id="ctabs"></div>
    <div class="fbody"><div class="stage" id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="overbar" id="overbar"></div>
      <div class="legend" id="legend"></div>
      <div class="coach" id="coach" style="display:none"></div>
    </div></div>
  </section>

  <!-- ============ RIGHT ============ -->
  <section class="frame" id="frameR">
    <div class="fhead">
      <h2>Analysis</h2><div class="spacer"></div>
      <div class="zoomctl"><button class="icb" data-zoom="R,-1">−</button><span class="zlabel" id="zR">100%</span><button class="icb" data-zoom="R,1">+</button></div>
      <button class="icb" data-pop="frameR" data-tip="Pop this frame in or out">⤢</button>
    </div>
    <div class="tabs" id="rtabs"></div>
    <div class="fbody"><div class="scaler" id="scR"><div class="pad" id="rpane"></div></div></div>
  </section>
</main>

<footer>
  <span id="stMode">View mode</span><span id="stCounts"></span><span id="stRisk"></span>
  <span class="spacer"></span><span id="stSaved">Not saved yet</span>
</footer>

<div class="veil" id="veil"><div class="modal" id="modal"></div></div>
<div class="tip" id="tip"></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* ============================================================
   ThreatForge — core: state, storage, small UI primitives
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = p => (p || 'x') + '_' + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uniq = a => Array.from(new Set(a));
const KEY = 'threatforge.projects.v1';

const S = {
  projects: [],          // [{id,product,version,...}]
  pid: null,             // current project id
  view: 'tm',            // tm | attack | fda | sbom
  ov2: false,            // OV-2 (operational) vs SV-2 (systems)
  fdaView: 'global',
  rtab: 'risks',
  edit: false,
  tool: 'select',        // select | node | zone | flow | delete
  sel: null,             // {kind:'node'|'zone'|'flow', id}
  linkFrom: null,
  zoom: { L: 1, C: 1, R: 1 },
  overlays: { data: true, proto: true, enc: true, cve: true, risk: true, flows: true },
  undo: [], redo: [],
  camera: {},            // per-view {x,y,k}
  dirty: false
};

const P = () => S.projects.find(p => p.id === S.pid) || null;
const M = () => { const p = P(); return p ? p.model : null; };

/* ---------- storage ---------- */
function load() {
  try { S.projects = JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch (e) { S.projects = []; toast('Saved projects could not be read; starting fresh.'); }
}
function save(quiet) {
  try {
    localStorage.setItem(KEY, JSON.stringify(S.projects));
    S.dirty = false;
    $('#stSaved').textContent = 'Saved ' + new Date().toLocaleTimeString();
    if (!quiet) toast('Project saved to this browser.');
  } catch (e) { toast('Save failed: browser storage is full. Export a .json project file instead.'); }
}

/* ---------- toast / tooltip / modal ---------- */
function toast(msg, ms) {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 250); }, ms || 3600);
}
const tipEl = () => $('#tip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]'); if (!el) return;
  const t = tipEl(); t.textContent = el.getAttribute('data-tip'); t.classList.add('on');
  const r = el.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8;
  requestAnimationFrame(() => {
    const b = t.getBoundingClientRect();
    if (x + b.width > innerWidth - 8) x = innerWidth - b.width - 8;
    if (y + b.height > innerHeight - 8) y = r.top - b.height - 8;
    t.style.left = Math.max(8, x) + 'px'; t.style.top = Math.max(8, y) + 'px';
  });
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tipEl().classList.remove('on'); });

function modal(title, bodyHTML, buttons) {
  const m = $('#modal');
  m.innerHTML = '<header><h2>' + esc(title) + '</h2></header><div class="body">' + bodyHTML + '</div>' +
    '<div class="foot">' + (buttons || []).map((b, i) =>
      '<button class="btn ' + (b.pri ? 'pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div>';
  $('#veil').classList.add('on');

/* ---------- history ---------- */
function snapshot(label) {
  const p = P(); if (!p) return;
  S.undo.push({ label: label || 'change', model: clone(p.model) });
  if (S.undo.length > 60) S.undo.shift();
  S.redo.length = 0; S.dirty = true;
  syncHistoryButtons();
}
function undo() {
  const p = P(); if (!p || !S.undo.length) return;
  const s = S.undo.pop();
  S.redo.push({ label: s.label, model: clone(p.model) });
  p.model = s.model; S.sel = null;
  refreshAll(); syncHistoryButtons(); toast('Undid: ' + s.label);
}
function redo() {
  const p = P(); if (!p || !S.redo.length) return;
  const s = S.redo.pop();
  S.undo.push({ label: s.label, model: clone(p.model) });
  p.model = s.model; S.sel = null;
  refreshAll(); syncHistoryButtons(); toast('Redid: ' + s.label);
}
function syncHistoryButtons() {
  $('#btnUndo').disabled = !S.undo.length;
  $('#btnRedo').disabled = !S.redo.length;
}

/* ---------- misc helpers ---------- */
function band(score) { return score <= 4 ? 'Low' : score <= 9 ? 'Medium' : score <= 15 ? 'High' : 'Critical'; }
function bandClass(b) { return { Low: 'b-low', Medium: 'b-med', High: 'b-high', Critical: 'b-crit' }[b] || 'b-low'; }
function bandColor(b) { return { Low: '#5c9e7a', Medium: '#c99236', High: '#c9663a', Critical: '#b03a48' }[b] || '#5c9e7a'; }
function download(name, mime, data) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function wrapText(s, max) {
  const words = String(s || '').split(/\s+/), lines = []; let cur = '';
  for (const w of words) {
    if (!cur) { cur = w; }
    else if ((cur + ' ' + w).length <= max) { cur += ' ' + w; }
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ============================================================
   Engine — deterministic. Scores are computed from the model,
   never from a language model. The LLM only writes narrative.
   ============================================================ */
const TRUST_RANK = { untrusted: 0, semi: 1, managed: 2, trusted: 3, critical: 4 };
const SENSITIVE = /(PHI|PII|credential|key|therapy|firmware|source|secret|order)/i;
const SAFETY_DATA = /(therapy|firmware|order|drug library|config)/i;

function nodeById(m, id) { return m.nodes.find(n => n.id === id); }
function zoneById(m, id) { return m.zones.find(z => z.id === id); }
function zoneOf(m, id) { const n = nodeById(m, id); return n ? zoneById(m, n.zone) : null; }

function weakEnc(e) { return /none|open|plaintext|n\/a|TLS 1\.0|TLS 1\.1|SSL|WEP|legacy/i.test(e || 'none'); }
function noEnc(e) { return /^(none|open|plaintext|n\/a)$/i.test((e || 'none').trim()); }
function weakAuth(a) { return /none|shared|static|allowlist|ip |anonymous/i.test(a || 'none'); }
function noAuth(a) { return /^(none|anonymous)$/i.test((a || 'none').trim()); }

/* ---- component advisories from the SBOM ---- */
function nodeCves(n) {
  const out = (n.cves || []).slice();
  (n.sbom || []).forEach(c => (KB.cve[c.k] || []).forEach(v => out.push(Object.assign({ comp: c.n + ' ' + c.v }, v))));
  (n.proto || []).forEach(p => {
    if (/BLE|Bluetooth/i.test(p)) (KB.cve.ble || []).forEach(v => out.push(Object.assign({ comp: p }, v)));
    if (/802\.11|WPA/i.test(p)) (KB.cve.wifi || []).forEach(v => out.push(Object.assign({ comp: p }, v)));
  });
  if (/pump|pod/i.test(n.name)) (KB.cve.pump || []).forEach(v => out.push(Object.assign({ comp: n.name }, v)));
  if (/infusion|PCU/i.test(n.name)) (KB.cve.infusion || []).forEach(v => out.push(Object.assign({ comp: n.name }, v)));
  const seen = new Set();
  return out.filter(v => { const k = v.id + '|' + (v.comp || ''); if (seen.has(k)) return false; seen.add(k); return true; });
}

/* ---- STRIDE selection for a flow ---- */
function strideFor(f, crossing) {
  const t = [];
  if (weakAuth(f.auth)) t.push('S');
  if (noEnc(f.enc) || weakAuth(f.auth)) t.push('T');
  if (noEnc(f.enc) && SENSITIVE.test((f.data || []).join(' '))) t.push('I');
  if (crossing) t.push('D');
  if (/therapy|firmware|config|order|credential|key/i.test((f.data || []).join(' ')) && weakAuth(f.auth)) t.push('E');
  if (!/log|audit|sign/i.test(f.auth || '')) t.push('R');
  return uniq(t);
}

/* ---- the core scoring pass ---- */
function analyze(m) {
  const risks = [];
  const add = r => { r.id = r.id || uid('r'); r.score = r.L * r.I; r.band = band(r.score); risks.push(r); };

  m.flows.forEach(f => {
    if (f.kind === 'threat') return;
    const a = nodeById(m, f.from), b = nodeById(m, f.to);
    if (!a || !b) return;
    const za = zoneById(m, a.zone), zb = zoneById(m, b.zone);
    const crossing = za && zb && za.id !== zb.id;
    const climb = crossing ? (TRUST_RANK[zb.trust] || 0) - (TRUST_RANK[za.trust] || 0) : 0;
    const dataStr = (f.data || []).join(', ');
    const triggers = [];
    let L = 1, I = 1;

    if (crossing) { L += 1; triggers.push('boundary'); }
    if (climb > 0) L += 1;
    if (za && za.trust === 'untrusted') { L += 1; triggers.push('public-api'); }
    if (noEnc(f.enc)) { L += 2; triggers.push('no-enc'); }
    else if (weakEnc(f.enc)) { L += 1; triggers.push('weak-enc'); }
    if (noAuth(f.auth)) { L += 2; triggers.push('no-auth'); }
    else if (weakAuth(f.auth)) { L += 1; triggers.push('shared-cred'); }
    if (/BLE|RF|802\.11|Bluetooth/i.test(f.proto || '')) triggers.push('rf-proximity');
    if (/USB|UART|JTAG|serial/i.test(f.proto || '')) { L += 1; triggers.push('usb-service'); }
    if (/firmware/i.test(dataStr)) triggers.push('ota');
    if (/PHI|PII/i.test(dataStr)) { I += 1; triggers.push('phi'); }
    if (/therapy|order|drug library/i.test(dataStr)) I += 3;
    if (/firmware|key|credential|secret|source/i.test(dataStr)) I += 3;
    if (/telemetry|log|time|transit|medication ID/i.test(dataStr) && I === 1) I += 1;
    if ((b.scope === 'fleet') || (a.scope === 'fleet')) { I += 1; triggers.push('multipatient'); }
    if (!(f.data || []).length) I = Math.max(1, I - 1);

    const cveHits = uniq(nodeCves(a).concat(nodeCves(b)).filter(v => v.c >= 7).map(v => v.id));
    if (cveHits.length) { L += cveHits.some(id => (nodeCves(a).concat(nodeCves(b)).find(v => v.id === id) || {}).c >= 9) ? 2 : 1; triggers.push('known-cve'); }

    L = Math.max(1, Math.min(5, L)); I = Math.max(1, Math.min(5, I));
    const st = strideFor(f, crossing);

    add({
      kind: 'flow', ref: f.id, boundary: crossing ? (za.name + ' → ' + zb.name) : (za ? za.name : ''),
      title: st.map(k => KB.stride[k]).slice(0, 2).join(' / ') + ' on “' + f.label + '”',
      what: 'An attacker positioned on ' + (za ? za.name : 'the source segment') + ' can reach ' + b.name +
            ' over ' + (f.proto || 'an undefined protocol') + '. Protection today: ' + (f.enc || 'none') +
            ' encryption, ' + (f.auth || 'no') + ' authentication. Data at stake: ' + (dataStr || 'none declared') + '.',
      stride: st, L, I, triggers: uniq(triggers), cves: cveHits
    });
  });

  m.nodes.forEach(n => {
    if (n.kind === 'threat') return;
    const cs = nodeCves(n).filter(v => v.c >= 7);
    if (!cs.length) return;
    const worst = cs.reduce((a, b) => (a.c >= b.c ? a : b));
    const z = zoneById(m, n.zone);
    let L = worst.c >= 9 ? 4 : 3;
    if (z && TRUST_RANK[z.trust] <= 1) L = Math.min(5, L + 1);
    let I = 3;
    if (SAFETY_DATA.test((n.data || []).join(' '))) I = 5;
    else if (/PHI|credential|key/i.test((n.data || []).join(' '))) I = 4;
    if (n.scope === 'fleet') I = Math.min(5, I + 1);
    add({
      kind: 'component', ref: n.id, boundary: z ? z.name : '',
      title: 'Known vulnerable component in ' + n.name,
      what: cs.map(v => v.id + ' (CVSS ' + v.c.toFixed(1) + ') — ' + v.t + (v.comp ? ' via ' + v.comp : '')).join('; ') + '.',
      stride: ['E', 'T'], L, I, triggers: ['known-cve'].concat(n.scope === 'fleet' ? ['multipatient'] : []),
      cves: cs.map(v => v.id)
    });
  });

  risks.sort((a, b) => b.score - a.score);
  risks.forEach(r => {
    const lib = r.triggers.map(t => KB.controls[t]).filter(Boolean);
    r.mitigations = lib;
    const dL = lib.reduce((s, c) => s + (c.dL || 0), 0);
    const dI = lib.reduce((s, c) => s + (c.dI || 0), 0);
    r.rL = Math.max(1, r.L - Math.min(3, dL));
    r.rI = Math.max(1, r.I - Math.min(1, dI ? 1 : 0));
    r.rScore = r.rL * r.rI; r.rBand = band(r.rScore);
    r.safety = safetyStatement(m, r);
  });
  return risks;
}

/* ---- patient-safety framing (ISO 14971 / AAMI TIR57 style) ---- */
function safetyStatement(m, r) {
  const target = r.kind === 'flow'
    ? nodeById(m, (m.flows.find(f => f.id === r.ref) || {}).to)
    : nodeById(m, r.ref);
  if (!target) return null;
  const d = ((target.data || []).join(' ') + ' ' + (r.kind === 'flow' ? ((m.flows.find(f => f.id === r.ref) || {}).data || []).join(' ') : '')).toLowerCase();
  let hazard = null, sev = 2;
  if (/therapy|order|drug library/.test(d)) { hazard = 'Unintended or withheld therapy delivery'; sev = 5; }
  else if (/firmware/.test(d)) { hazard = 'Corrupted device behaviour after an update, including loss of therapy'; sev = 5; }
  else if (/delivery log|telemetry|glucose/.test(d)) { hazard = 'Clinical decision made on falsified or missing data'; sev = 4; }
  else if (/phi|pii/.test(d)) { hazard = 'Loss of confidentiality; no direct physical harm'; sev = 2; }
  else if (/credential|key|secret/.test(d)) { hazard = 'Attacker gains a position that enables therapy-affecting actions'; sev = 4; }
  if (!hazard) return null;
  const exploit = r.L >= 4 ? 'High' : r.L >= 3 ? 'Moderate' : 'Low';
  return { hazard, sev, exploit, harm: sev >= 5 ? 'Serious injury or death' : sev >= 4 ? 'Injury requiring intervention' : 'Non-physical harm', scope: target.scope === 'fleet' ? 'Multi-patient' : 'Single patient' };
}

function summary(m, risks) {
  const c = { Low: 0, Medium: 0, High: 0, Critical: 0 }, rc = { Low: 0, Medium: 0, High: 0, Critical: 0 };
  risks.forEach(r => { c[r.band]++; rc[r.rBand]++; });
  const worst = risks[0] ? risks[0].band : 'Low';
  const crossings = m.flows.filter(f => { const a = zoneOf(m, f.from), b = zoneOf(m, f.to); return f.kind !== 'threat' && a && b && a.id !== b.id; }).length;
  const cves = uniq([].concat.apply([], m.nodes.map(n => nodeCves(n).map(v => v.id))));
  const safety = risks.filter(r => r.safety && r.safety.sev >= 4);
  const score = Math.min(100, Math.round((c.Critical * 18 + c.High * 9 + c.Medium * 4 + c.Low * 1) * 100 / Math.max(28, risks.length * 12)));
  return { counts: c, resid: rc, worst, crossings, cves, safety, score, total: risks.length };
}

/* ---- attack graph, derived from the same model ---- */
function buildAttackGraph(m) {
  const gN = [], gE = [];
  const push = (id, label, layer, meta) => { if (!gN.find(n => n.id === id)) gN.push(Object.assign({ id, label, layer }, meta || {})); return id; };
  const entryZones = m.zones.filter(z => TRUST_RANK[z.trust] <= 1);
  const risks = m._risks || analyze(m);
  const riskOfFlow = f => risks.find(r => r.kind === 'flow' && r.ref === f.id);

  // Layer 0: entry points = flows that originate outside a trusted zone
  const entries = m.flows.filter(f => {
    const za = zoneOf(m, f.from); return za && TRUST_RANK[za.trust] <= 1;
  });
  entries.forEach(f => {
    const a = nodeById(m, f.from), b = nodeById(m, f.to); if (!a || !b) return;
    const eid = push('e_' + f.id, (a.kind === 'threat' ? 'Adversary' : a.name) + ' → ' + b.name, 0,
      { tech: f.proto || 'network', band: (riskOfFlow(f) || {}).band || 'Medium', note: 'Entry via ' + (f.proto || 'network') + (noAuth(f.auth) ? ', unauthenticated' : ', auth: ' + f.auth) });
    const fid = push('n_' + b.id, b.name, 1, { band: (riskOfFlow(f) || {}).band || 'Medium', note: 'Foothold on ' + b.name + ' (' + (b.tech || b.kind) + ')' });
    gE.push({ from: eid, to: fid, label: noAuth(f.auth) ? 'no authentication' : noEnc(f.enc) ? 'cleartext channel' : 'credential or protocol abuse' });
  });

  // Layer 2: lateral movement / escalation towards fleet-scope or safety nodes
  const footholds = gN.filter(n => n.layer === 1);
  footholds.forEach(fh => {
    const src = fh.id.slice(2);
    m.flows.filter(f => f.from === src && f.kind !== 'threat').forEach(f => {
      const b = nodeById(m, f.to); if (!b || b.kind === 'threat') return;
      const eid = push('x_' + b.id, b.name, 2, { band: (riskOfFlow(f) || {}).band || 'Medium', note: 'Reached over ' + (f.proto || 'internal') + ' carrying ' + ((f.data || []).join(', ') || 'no declared data') });
      gE.push({ from: fh.id, to: eid, label: (f.data || []).join(', ') || f.proto || 'internal call' });
    });
  });

  // Layer 3: impacts
  const impacts = [];
  const hasTherapy = m.nodes.some(n => /therapy|order/i.test((n.data || []).join(' ')));
  const hasFleet = m.nodes.some(n => n.scope === 'fleet');
  const hasPHI = m.nodes.some(n => /PHI|PII/i.test((n.data || []).join(' ')));
  const hasFw = m.nodes.some(n => /firmware/i.test((n.data || []).join(' ')));
  if (hasTherapy) impacts.push(['i_therapy', 'Unintended or withheld therapy', 'Critical', 'Direct patient harm: over- or under-delivery, or therapy stopped.']);
  if (hasFw && hasFleet) impacts.push(['i_fleet', 'Fleet-wide malicious firmware', 'Critical', 'Signed-update path abused; harm scales to every device in the field.']);
  if (hasPHI) impacts.push(['i_phi', 'Mass PHI disclosure', 'High', 'Breach notification, HIPAA exposure, loss of clinical trust.']);
  impacts.push(['i_dos', 'Loss of availability during care', 'High', 'Devices or servers unavailable when clinicians need them.']);
  impacts.forEach(([id, label, b, note]) => push(id, label, 3, { band: b, note }));

  gN.filter(n => n.layer === 2).forEach(n => {
    const node = m.nodes.find(x => x.id === n.id.slice(2)); if (!node) return;
    const d = (node.data || []).join(' ');
    if (/therapy|order|drug library/i.test(d) && gN.find(x => x.id === 'i_therapy')) gE.push({ from: n.id, to: 'i_therapy', label: 'command or guardrail tampering' });
    if (/firmware/i.test(d) && gN.find(x => x.id === 'i_fleet')) gE.push({ from: n.id, to: 'i_fleet', label: 'update pipeline abuse' });
    if (/PHI|PII/i.test(d) && gN.find(x => x.id === 'i_phi')) gE.push({ from: n.id, to: 'i_phi', label: 'bulk read' });
    if (node.scope === 'fleet') gE.push({ from: n.id, to: 'i_dos', label: 'resource exhaustion' });
  });
  gN.filter(n => n.layer === 1).forEach(n => {
    const node = m.nodes.find(x => x.id === n.id.slice(2)); if (!node) return;
    if (/therapy/i.test((node.data || []).join(' ')) && gN.find(x => x.id === 'i_therapy')) gE.push({ from: n.id, to: 'i_therapy', label: 'local command injection' });
  });

  // layout
  const cols = [0, 1, 2, 3].map(l => gN.filter(n => n.layer === l));
  const CW = 300, CH = 92;
  cols.forEach((col, li) => col.forEach((n, i) => {
    n.w = 250; n.h = 62;
    n.x = 60 + li * CW;
    n.y = 90 + i * CH;
  }));
  const maxRows = Math.max.apply(null, cols.map(c => c.length).concat([1]));
  cols.forEach(col => { const off = (maxRows - col.length) * CH / 2; col.forEach(n => n.y += off); });
  return { nodes: gN, edges: gE.filter(e => gN.find(n => n.id === e.from) && gN.find(n => n.id === e.to)) };
}

/* ---- FDA premarket architecture views ---- */
const FDA_VIEWS = [
  { id: 'global', label: 'Global system view', hint: 'Every element of the system, its interfaces and the boundaries between them. Matches the SV-2 layout.' },
  { id: 'multi', label: 'Multi-patient harm view', hint: 'Only the assets whose compromise can affect more than one patient at a time.' },
  { id: 'update', label: 'Updateability & patchability view', hint: 'The complete path a software update travels, from build to executing on the device.' },
  { id: 'usecase', label: 'Security use case view', hint: 'One end-to-end clinical action, with the security control at each hop.' }
];

function fdaSubset(m, which) {
  if (which === 'multi') {
    const ids = m.nodes.filter(n => n.scope === 'fleet' || /server|cloud|store|registry|library|update|signing|EMR/i.test(n.name)).map(n => n.id);
    return filterModel(m, ids, 'Assets able to affect more than one patient');
  }
  if (which === 'update') {
    const ids = m.nodes.filter(n => /firmware|source|config/i.test((n.data || []).join(' ')) || /update|signing|build|CI|pipeline|distribution|service|pod|pump|PCU/i.test(n.name)).map(n => n.id);
    return filterModel(m, ids, 'Software update path — build, sign, distribute, verify, execute');
  }
  if (which === 'usecase') {
    const ids = m.nodes.filter(n => /therapy|order|PHI/i.test((n.data || []).join(' ')) || n.kind === 'actor').map(n => n.id);
    return filterModel(m, ids, 'Clinical use case — issue a therapy instruction end to end');
  }
  return m;
}
function filterModel(m, ids, caption) {
  const set = new Set(ids);
  const nodes = m.nodes.filter(n => set.has(n.id));
  const zones = m.zones.filter(z => nodes.some(n => n.zone === z.id));
  const flows = m.flows.filter(f => set.has(f.from) && set.has(f.to));
  return { zones, nodes, flows, caption, _parent: m };
}

/* ============================================================
   Ingestion — file tree, repo, pasted notes, new feature
   ============================================================ */
function buildTree(paths) {
  const root = { name: '/', dir: true, kids: {} };
  paths.forEach(p => {
    const parts = String(p).replace(/^[.\/]+/, '').split('/').filter(Boolean);
    let cur = root;
    parts.forEach((part, i) => {
      const leaf = i === parts.length - 1;
      cur.kids[part] = cur.kids[part] || { name: part, dir: !leaf, kids: {}, path: parts.slice(0, i + 1).join('/') };
      cur = cur.kids[part];
      if (!leaf) cur.dir = true;
    });
  });
  return root;
}
function signalsFor(path) { return KB.signals.filter(s => s.re.test(path)); }

function modelFromPaths(paths, product, version) {
  const hits = {};
  paths.forEach(p => signalsFor(p).forEach(s => { (hits[s.tag] = hits[s.tag] || { s, files: [] }).files.push(p); }));
  const zoneDefs = {
    z_edge: ['Device / Edge', 'semi'], z_user: ['User Device', 'semi'], z_net: ['Public Internet', 'untrusted'],
    z_cloud: ['Cloud Services', 'managed'], z_data: ['Data Tier', 'critical'], z_clinic: ['Clinical Systems', 'trusted'],
    z_build: ['Build & Supply Chain', 'critical']
  };
  const used = uniq(Object.values(hits).map(h => h.s.zone)).concat(['z_net']);
  const zones = [], nodes = [], flows = [];
  const perRow = 2, ZW = 330, ZH = 250;
  uniq(used).forEach((zid, i) => {
    const d = zoneDefs[zid] || ['Zone', 'semi'];
    const x = 40 + (i % 3) * (ZW + 40), y = 70 + Math.floor(i / 3) * (ZH + 50);
    zones.push(Z(zid, d[0], d[1], x, y, ZW, ZH, TINT[d[1]]));
  });
  const idx = {};
  Object.values(hits).forEach(h => {
    const z = zones.find(zz => zz.id === h.s.zone) || zones[0];
    idx[z.id] = (idx[z.id] || 0);
    const n = N('n_' + h.s.tag, h.s.name, h.s.name, h.s.kind, z.id, z.x + 25, z.y + 45 + idx[z.id] * 72,
      { w: ZW - 50, proto: h.s.proto, enc: h.s.enc, auth: /api|authn|admin/.test(h.s.tag) ? 'token' : 'none', data: h.s.data, tech: h.files.length + ' matching files', files: h.files.slice(0, 12) });
    if (/store|ota|api|bus/.test(h.s.tag)) n.scope = 'fleet';
    if (h.s.tag === 'rtos') n.sbom = [{ n: 'RTOS / TCP-IP stack', v: 'unknown', k: 'rtos' }];
    if (h.s.tag === 'tls' || h.s.tag === 'api') n.sbom = [{ n: 'OpenSSL', v: 'unknown', k: 'tls' }];
    idx[z.id]++;
    nodes.push(n);
  });
  const inet = N('n_inet', 'Public Internet', 'Transport', 'external', 'z_net', (zones.find(z => z.id === 'z_net') || zones[0]).x + 25, (zones.find(z => z.id === 'z_net') || zones[0]).y + 45, { w: ZW - 50, proto: ['IP'], enc: 'none', auth: 'none', data: ['transit'] });
  const adv = N('n_adv', 'Threat actor', 'Adversary', 'threat', 'z_net', inet.x, inet.y + 72, { w: ZW - 50, proto: ['IP', 'RF'], data: [] });
  nodes.push(inet, adv);
  const has = t => nodes.find(n => n.id === 'n_' + t);
  const link = (a, b, label, o) => { if (has(a) && has(b)) flows.push(F(uid('f'), 'n_' + a, 'n_' + b, label, o)); };
  link('mobile', 'ble', 'Control commands', { proto: 'BLE', enc: 'AES-CCM', auth: 'pairing', data: ['therapy command'] });
  link('ble', 'rtos', 'Device control', { proto: 'internal', enc: 'none', auth: 'none', data: ['therapy command'] });
  link('wifi', 'rtos', 'Network to device', { proto: '802.11', enc: 'AES-CCMP', auth: 'EAP-TLS', data: ['telemetry'] });
  link('mobile', 'api', 'App traffic', { proto: 'HTTPS', enc: 'TLS 1.2', auth: 'token', data: ['PHI'] });
  link('api', 'authn', 'Token check', { proto: 'OIDC', enc: 'TLS 1.3', auth: 'client secret', data: ['credentials'] });
  link('api', 'store', 'Persist', { proto: 'TLS/5432', enc: 'TLS 1.2', auth: 'IAM role', data: ['PHI'] });
  link('bus', 'store', 'Telemetry landing', { proto: 'MQTT', enc: 'TLS 1.2', auth: 'device cert', data: ['telemetry'] });
  link('cicd', 'ota', 'Release artifact', { proto: 'HTTPS', enc: 'TLS 1.3', auth: 'OIDC federation', data: ['firmware'] });
  link('ota', 'rtos', 'Firmware update', { proto: 'HTTPS / DFU', enc: 'TLS 1.3 + signature', auth: 'signature check', data: ['firmware'] });
  link('hl7', 'api', 'Clinical exchange', { proto: 'FHIR R4', enc: 'TLS 1.2', auth: 'mutual TLS', data: ['PHI'] });
  link('usb-service', 'rtos', 'Service session', { proto: 'USB / UART', enc: 'none', auth: 'none', data: ['firmware', 'config'] });
  link('admin', 'store', 'Administrative access', { proto: 'HTTPS', enc: 'TLS 1.3', auth: 'SSO', data: ['PHI'] });
  if (has('api')) flows.push(F(uid('f'), 'n_inet', 'n_api', 'Inbound traffic', { proto: 'HTTPS', enc: 'TLS 1.3', auth: 'token', data: ['PHI'] }));
  if (has('api')) flows.push(F(uid('f'), 'n_adv', 'n_api', 'Internet-facing probing', { proto: 'HTTPS', enc: 'TLS 1.3', auth: 'none', data: [], kind: 'threat' }));
  if (has('ble')) flows.push(F(uid('f'), 'n_adv', 'n_ble', 'Proximity RF attempts', { proto: 'BLE', enc: 'none', auth: 'none', data: [], kind: 'threat' }));

  return { product: product || 'Imported product', version: version || '0.1', kindOfProduct: 'Inferred from source layout', zones, nodes, flows, tree: paths.slice(0, 4000) };
}

/* new feature applied as a change set on the existing model */
function applyFeature(m, name, text) {
  const paths = text.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  const tags = uniq([].concat.apply([], paths.concat([name]).map(p => signalsFor(p).map(s => s.tag))));
  const z = m.zones.find(zz => zz.trust === 'managed') || m.zones[0];
  const n = N(uid('n'), name, name, 'service', z.id, z.x + 30, z.y + z.h - 70,
    {
      w: 210, tech: 'new in this version', proto: uniq([].concat.apply([], tags.map(t => (KB.signals.find(s => s.tag === t) || {}).proto || []))),
      enc: 'TLS 1.3', auth: 'token', data: uniq([].concat.apply([], tags.map(t => (KB.signals.find(s => s.tag === t) || {}).data || []))), isNew: true, notes: text.slice(0, 400)
    });
  if (!n.data.length) n.data = ['config'];
  m.nodes.push(n);
  const target = m.nodes.find(x => /api|gateway|server|PCU|service/i.test(x.name) && x.id !== n.id);
  if (target) m.flows.push(F(uid('f'), target.id, n.id, 'New feature interface', { proto: n.proto[0] || 'HTTPS', enc: 'TLS 1.3', auth: 'token', data: n.data, isNew: true }));
  m.tree = (m.tree || []).concat(paths);
  return n;
}

/* ============================================================
   Renderers — plain SVG, no external assets, so every diagram
   exports cleanly to SVG, PNG, PDF and Word.

const KIND_COLOR = {
  device: '#2c6e8f', app: '#5f7fbf', service: '#4f9d84', store: '#8a6fbe',
  external: '#b08a4a', iface: '#c9663a', actor: '#3f7d9c', threat: '#b03a48'
};
const KIND_LABEL = {
  device: 'Device', app: 'Application', service: 'Service', store: 'Data store',
  external: 'External system', iface: 'Interface', actor: 'Human actor', threat: 'Adversary'
};

function svgDefs() {
  return '' +
  '<defs>' +
  '<filter id="raise" x="-20%" y="-30%" width="150%" height="180%">' +
    '<feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#12212b" flood-opacity="0.10"/>' +
    '<feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#12212b" flood-opacity="0.10"/></filter>' +

function T(x, y, s, o) {
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" font-family="Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" ' +
    'font-size="' + (o.size || 12) + '" font-weight="' + (o.weight || 400) + '" fill="' + (o.fill || '#40525e') + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') + (o.ls ? ' letter-spacing="' + o.ls + '"' : '') + '>' + esc(s) + '</text>';
}
function chip(x, y, label, fill, textFill, w) {
  const cw = w || Math.max(22, label.length * 5.6 + 12);
  return '<g><rect x="' + x + '" y="' + y + '" rx="7" ry="7" width="' + cw + '" height="16" fill="' + fill + '"/>' +
    T(x + cw / 2, y + 11.5, label, { size: 9.5, weight: 600, fill: textFill, anchor: 'middle' }) + '</g>';
}
function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

/* ---------- geometry ---------- */
function edgePoint(box, tx, ty) {
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return { x: cx, y: cy };
  const sx = dx ? (box.w / 2) / Math.abs(dx) : Infinity;
  const sy = dy ? (box.h / 2) / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}
function contentBox(items, pad) {
  if (!items.length) return { x: 0, y: 0, w: 900, h: 600 };
  const x1 = Math.min.apply(null, items.map(i => i.x)), y1 = Math.min.apply(null, items.map(i => i.y));
  const x2 = Math.max.apply(null, items.map(i => i.x + i.w)), y2 = Math.max.apply(null, items.map(i => i.y + i.h));
  const p = pad == null ? 40 : pad;
  return { x: x1 - p, y: y1 - p, w: (x2 - x1) + p * 2, h: (y2 - y1) + p * 2 };
}

/* ---------- threat model (SV-2 / OV-2) ---------- */
function renderThreatModel(m, risks, opt) {
  opt = opt || {};
  const ov = !!S.ov2, O = S.overlays;
  const rByFlow = {}; risks.forEach(r => { if (r.kind === 'flow') rByFlow[r.ref] = r; });
  const rByNode = {}; risks.forEach(r => { if (r.kind === 'component') rByNode[r.ref] = r; });
  let s = '';

  /* zones */
  m.zones.forEach(z => {
    const zr = risks.filter(r => r.boundary && r.boundary.indexOf(z.name) >= 0);
    const worst = zr.length ? zr.reduce((a, b) => a.score >= b.score ? a : b).band : null;
    const selected = S.sel && S.sel.kind === 'zone' && S.sel.id === z.id;
    s += '<g class="zone" data-kind="zone" data-id="' + z.id + '">';
    s += '<rect x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="18" fill="' + (z.tint || '#eef1f5') +
      '" stroke="' + (selected ? '#1b4965' : '#cfdbe4') + '" stroke-width="' + (selected ? 2 : 1.25) + '" stroke-dasharray="7 5" filter="url(#soft)"/>';
    s += T(z.x + 16, z.y + 24, z.name.toUpperCase(), { size: 10, weight: 700, fill: '#5c6f7d', ls: '0.08em' });
    s += T(z.x + 16, z.y + 38, 'trust: ' + z.trust, { size: 9.5, fill: '#8496a2' });
    if (O.risk && worst) s += chip(z.x + z.w - 78, z.y + 12, worst.toUpperCase() + ' RISK', bandColor(worst), '#fff', 66);
    s += '</g>';
  });

  /* flows */
  const pairSeen = {};
  m.flows.forEach(f => {
    if (!O.flows && f.kind !== 'threat') return;
    const a = m.nodes.find(n => n.id === f.from), b = m.nodes.find(n => n.id === f.to);
    if (!a || !b) return;
    if (ov && (a.kind === 'threat' || b.kind === 'threat')) return;
    const p1 = edgePoint(a, b.x + b.w / 2, b.y + b.h / 2);
    const p2 = edgePoint(b, a.x + a.w / 2, a.y + a.h / 2);
    const key = [f.from, f.to].sort().join('|');
    pairSeen[key] = (pairSeen[key] || 0) + 1;
    const bow = (pairSeen[key] - 1) * 26;
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const nx = -(p2.y - p1.y), ny = (p2.x - p1.x);
    const len = Math.hypot(nx, ny) || 1;
    const cx = mx + nx / len * bow, cy = my + ny / len * bow;
    const threat = f.kind === 'threat';
    const risk = rByFlow[f.id];
    const sel = S.sel && S.sel.kind === 'flow' && S.sel.id === f.id;
    const col = threat ? '#b03a48' : sel ? '#1b4965' : '#8fa3b0';
    s += '<g class="flow" data-kind="flow" data-id="' + f.id + '">';
    s += '<path d="M' + p1.x + ',' + p1.y + ' Q' + cx + ',' + cy + ' ' + p2.x + ',' + p2.y + '" fill="none" stroke="transparent" stroke-width="14"/>';
    s += '<path d="M' + p1.x + ',' + p1.y + ' Q' + cx + ',' + cy + ' ' + p2.x + ',' + p2.y + '" fill="none" stroke="' + col +
      '" stroke-width="' + (sel ? 2.6 : threat ? 1.8 : 1.5) + '"' + (threat || f.isNew ? ' stroke-dasharray="6 4"' : '') +
      ' marker-end="url(#' + (threat ? 'arwT' : sel ? 'arwS' : 'arw') + ')"/>';
    const lx = (p1.x + 2 * cx + p2.x) / 4, ly = (p1.y + 2 * cy + p2.y) / 4;
    const lines = [];
    lines.push(truncate(f.label, 34));
    if (!ov) {
      const bits = [];
      if (O.proto && f.proto) bits.push(f.proto);
      if (O.enc && f.enc) bits.push(noEnc(f.enc) ? 'no encryption' : f.enc);
      if (bits.length) lines.push(truncate(bits.join(' · '), 40));
      if (O.data && (f.data || []).length) lines.push(truncate('data: ' + f.data.join(', '), 40));
    } else if (O.data && (f.data || []).length) {
      lines.push(truncate(f.data.join(', '), 36));
    }
    const bw = Math.max.apply(null, lines.map(t => t.length * 5.4)) + 18;
    const bh = lines.length * 13 + 8;
    s += '<rect x="' + (lx - bw / 2) + '" y="' + (ly - bh / 2) + '" width="' + bw + '" height="' + bh + '" rx="7" fill="#ffffff" fill-opacity="0.94" stroke="#e2e9ee"/>';
    lines.forEach((t, i) => { s += T(lx, ly - bh / 2 + 13 + i * 13, t, { size: i ? 9 : 10, weight: i ? 400 : 600, fill: i ? '#7b8b96' : (threat ? '#b03a48' : '#40525e'), anchor: 'middle' }); });
    if (O.risk && risk && risk.boundary && risk.boundary.indexOf('→') > 0) {
      s += chip(lx + bw / 2 + 4, ly - 8, risk.band[0] + ' ' + risk.score, bandColor(risk.band), '#fff', 30);
    }
    s += '</g>';
  });

  /* nodes */
  m.nodes.forEach(n => {
    if (ov && n.kind === 'threat') return;
    const sel = S.sel && S.sel.kind === 'node' && S.sel.id === n.id;
    const col = KIND_COLOR[n.kind] || '#2c6e8f';
    const cves = O.cve ? nodeCves(n) : [];
    const high = cves.filter(v => v.c >= 7).length;
    const r = rByNode[n.id];
    s += '<g class="node" data-kind="node" data-id="' + n.id + '">';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="12" fill="#ffffff" ' +
      'stroke="' + (sel ? '#1b4965' : '#e4ebf0') + '" stroke-width="' + (sel ? 2 : 1) + '" filter="url(#raise)"/>';
    s += '<path d="M' + n.x + ',' + (n.y + 12) + ' a12,12 0 0 1 12,-12 h0 v' + n.h + ' h0 a12,12 0 0 1 -12,-12 z" fill="' + col + '" opacity="' + (n.kind === 'threat' ? '1' : '.9') + '"/>';
    s += T(n.x + 16, n.y + 20, truncate(ov ? (n.ov || n.name) : n.name, Math.floor((n.w - 30) / 6.6)), { size: 12.5, weight: 650, fill: '#12212b' });
    s += T(n.x + 16, n.y + 35, truncate(ov ? n.name : (n.tech || KIND_LABEL[n.kind] || ''), Math.floor((n.w - 30) / 5.4)), { size: 9.5, fill: '#8496a2' });
    let cxp = n.x + 16;
    if (!ov) {
      if (O.proto && (n.proto || []).length) { const t = truncate(n.proto.join(' · '), 22); s += chip(cxp, n.y + 42, t, '#eef3f7', '#4a5f6d'); cxp += Math.max(22, t.length * 5.6 + 12) + 4; }
      if (O.enc) { const e = noEnc(n.enc) ? 'no enc' : truncate(n.enc, 16); s += chip(cxp, n.y + 42, e, noEnc(n.enc) ? '#fdeceb' : '#e9f6ef', noEnc(n.enc) ? '#b03a48' : '#3f7a60'); cxp += Math.max(22, e.length * 5.6 + 12) + 4; }
      if (O.data && (n.data || []).length) { const d = truncate(n.data.join(','), 18); s += chip(cxp, n.y + 42, d, '#f2edf9', '#6b53a0'); }
    } else {
      if (O.data && (n.data || []).length) s += chip(cxp, n.y + 42, truncate('exchanges: ' + n.data.join(', '), 30), '#eef3f7', '#4a5f6d');
    }
    if (O.cve && high) s += chip(n.x + n.w - 54, n.y - 8, high + ' CVE' + (high > 1 ? 's' : ''), '#b03a48', '#fff', 48);
    if (n.scope === 'fleet') s += chip(n.x + n.w - 54, n.y + n.h - 8, 'MULTI-PT', '#8a6fbe', '#fff', 48);
    if (n.isNew) s += chip(n.x - 6, n.y - 8, 'NEW', '#2c6e8f', '#fff', 32);
    if (O.risk && r) s += chip(n.x + n.w - 110, n.y - 8, r.band.toUpperCase(), bandColor(r.band), '#fff', 52);
    s += '</g>';
  });
  return s;
}

/* ---------- attack graph ---------- */
function renderAttackGraph(g) {
  const LAYER = ['Entry point', 'Foothold', 'Movement & escalation', 'Impact on patients or data'];
  const TINTS = ['#fdeceb', '#fdf3e5', '#e9f2fa', '#f2edf9'];
  let s = '';
  const rows = [0, 1, 2, 3].map(l => g.nodes.filter(n => n.layer === l));
  const maxY = Math.max.apply(null, g.nodes.map(n => n.y + n.h).concat([300]));
  rows.forEach((col, i) => {
    const x = 40 + i * 300;
    s += '<rect x="' + x + '" y="40" width="270" height="' + (maxY + 40) + '" rx="18" fill="' + TINTS[i] + '" opacity=".55"/>';
    s += T(x + 16, 64, LAYER[i].toUpperCase(), { size: 10, weight: 700, fill: '#5c6f7d', ls: '0.08em' });
  });
  g.edges.forEach(e => {
    const a = g.nodes.find(n => n.id === e.from), b = g.nodes.find(n => n.id === e.to);
    if (!a || !b) return;
    const p1 = { x: a.x + a.w, y: a.y + a.h / 2 }, p2 = { x: b.x, y: b.y + b.h / 2 };
    const mid = (p1.x + p2.x) / 2;
    s += '<path d="M' + p1.x + ',' + p1.y + ' C' + mid + ',' + p1.y + ' ' + mid + ',' + p2.y + ' ' + p2.x + ',' + p2.y +
      '" fill="none" stroke="#a9bcc7" stroke-width="1.4" marker-end="url(#arw)"/>';
    const t = truncate(e.label, 24);
    s += '<rect x="' + (mid - t.length * 2.7 - 7) + '" y="' + ((p1.y + p2.y) / 2 - 9) + '" width="' + (t.length * 5.4 + 14) + '" height="16" rx="7" fill="#fff" fill-opacity=".93" stroke="#e2e9ee"/>';
    s += T(mid, (p1.y + p2.y) / 2 + 2.5, t, { size: 9.5, fill: '#7b8b96', anchor: 'middle' });
  });
  g.nodes.forEach(n => {
    const sel = S.sel && S.sel.kind === 'anode' && S.sel.id === n.id;
    s += '<g class="anode" data-kind="anode" data-id="' + n.id + '">';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="12" fill="#fff" stroke="' + (sel ? '#1b4965' : '#e4ebf0') + '" stroke-width="' + (sel ? 2 : 1) + '" filter="url(#raise)"/>';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="4" height="' + n.h + '" rx="2" fill="' + bandColor(n.band || 'Medium') + '"/>';
    wrapText(n.label, 30).slice(0, 2).forEach((t, i) => s += T(n.x + 14, n.y + 20 + i * 14, t, { size: 12, weight: 650, fill: '#12212b' }));
    s += T(n.x + 14, n.y + n.h - 12, truncate(n.note || '', 40), { size: 9, fill: '#8496a2' });
    s += '</g>';
  });
  return s;
}

/* ---------- caption band used by FDA views ---------- */
function captionBand(box, title, hint) {
  return '<g><rect x="' + (box.x + 20) + '" y="' + (box.y + 12) + '" width="' + (box.w - 40) + '" height="46" rx="12" fill="#ffffff" stroke="#e4ebf0" filter="url(#raise)"/>' +
    T(box.x + 36, box.y + 32, title, { size: 13, weight: 650, fill: '#1b4965' }) +
    T(box.x + 36, box.y + 48, hint, { size: 10.5, fill: '#7b8b96' }) + '</g>';
}

/* ---------- main draw ---------- */
function draw() {
  const p = P(), svg = $('#svg');
  if (!p) { svg.innerHTML = ''; return; }
  const m = p.model;
  const risks = m._risks = analyze(m);
  let inner = svgDefs(), box;

  if (S.view === 'attack') {
    const g = p.attack && p.attack.custom ? p.attack : buildAttackGraph(m);
    p.attackCache = g;
    inner += renderAttackGraph(g);
    box = contentBox(g.nodes.map(n => ({ x: n.x - 40, y: n.y, w: n.w + 80, h: n.h })), 40);
    box.y = Math.min(box.y, 20);
  } else if (S.view === 'fda') {
    const sub = fdaSubset(m, S.fdaView);
    const meta = FDA_VIEWS.find(v => v.id === S.fdaView);
    inner += renderThreatModel(sub, risks);
    box = contentBox(sub.zones.concat(sub.nodes), 46);
    box.y -= 62; box.h += 62;
    inner += captionBand(box, 'FDA premarket · ' + meta.label + ' — ' + m.product + ' v' + m.version, meta.hint);
  } else {
    inner += renderThreatModel(m, risks);
    box = contentBox(m.zones.concat(m.nodes), 46);
    box.y -= 62; box.h += 62;
    inner += captionBand(box, (S.ov2 ? 'OV-2 operational view' : 'SV-2 systems view') + ' — ' + m.product + ' v' + m.version,
      S.ov2 ? 'Operational nodes and the information they need from each other. Protocol detail is hidden on purpose.'
            : 'Systems, interfaces, protocol versions, encryption and the risk on each boundary crossing.');
  }
  p._box = box;
  const cam = S.camera[S.view] || (S.camera[S.view] = { x: 0, y: 0, k: 0 });
  if (!cam.k) fitCamera(box, cam);
  svg.setAttribute('viewBox', '0 0 ' + Math.max(10, svg.clientWidth || 900) + ' ' + Math.max(10, svg.clientHeight || 600));
  const parsed = new DOMParser().parseFromString(
    '<svg xmlns="http://www.w3.org/2000/svg"><g id="viewport" transform="translate(' + cam.x + ',' + cam.y + ') scale(' + cam.k + ')">' + inner + '</g></svg>', 'image/svg+xml');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  Array.from(parsed.documentElement.childNodes).forEach(n => svg.appendChild(document.importNode(n, true)));
  drawLegend();
  $('#zC').textContent = Math.round((S.camera[S.view].k || 1) * 100) + '%';
}
function fitCamera(box, cam) {
  const svg = $('#svg');
  const W = svg.clientWidth || svg.parentElement.clientWidth || 900, H = svg.clientHeight || svg.parentElement.clientHeight || 600;
  const k = Math.max(0.12, Math.min(W / box.w, H / box.h, 1.6));
  cam.k = k; cam.x = -box.x * k + (W - box.w * k) / 2; cam.y = -box.y * k + (H - box.h * k) / 2;
}
function drawLegend() {
  const L = $('#legend');
  if (S.view === 'attack') {
    L.innerHTML = '<b style="color:#1b4965">Attack path bands</b>' +
      ['Critical', 'High', 'Medium', 'Low'].map(b => '<div><span class="sw" style="background:' + bandColor(b) + '"></span>' + b + ' inherent risk on this step</div>').join('') +
      '<div style="margin-top:5px;color:#7b8b96">Columns are attacker phases: entry, foothold, movement, impact.</div>';
    return;
  }
  const kinds = ['device', 'app', 'service', 'store', 'external', 'iface', 'threat'];
  L.innerHTML = '<b style="color:#1b4965">Elements</b>' +
    kinds.map(k => '<div><span class="sw" style="background:' + KIND_COLOR[k] + '"></span>' + KIND_LABEL[k] + '</div>').join('') +
    '<div style="margin-top:5px"><span class="sw" style="background:#b03a48"></span>Risk badge = inherent score</div>' +
    '<div><span class="sw" style="background:#8a6fbe"></span>MULTI-PT = multi-patient asset</div>';
}

function toModel(ev) {

/* ---------- pan / zoom / select / drag ---------- */
(function bindStage() {
  const stage = $('#stage');
  let mode = null, start = null, moved = false, target = null, orig = null;

  stage.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    const p = P(); if (!p) return;
    const g = ev.target.closest('[data-kind]');
    const cam = S.camera[S.view];
    const mp = toModel(ev);

    if (S.edit && S.tool === 'delete' && g) { deleteEl(g.dataset.kind, g.dataset.id); return; }
    if (S.edit && S.tool === 'flow' && g && (g.dataset.kind === 'node' || g.dataset.kind === 'anode')) {
      if (!S.linkFrom) { S.linkFrom = g.dataset.id; toast('Now click the destination element.'); }
      else if (S.linkFrom !== g.dataset.id) { createFlow(S.linkFrom, g.dataset.id); S.linkFrom = null; }
      return;
    }
    if (S.edit && !g && (S.tool === 'node' || S.tool === 'zone')) { createAt(mp); return; }

    if (g) {
      S.sel = { kind: g.dataset.kind, id: g.dataset.id };
      renderRight(); draw();
      if (S.edit && (g.dataset.kind === 'node' || g.dataset.kind === 'zone' || g.dataset.kind === 'anode')) {
        mode = 'drag'; target = S.sel; moved = false;
        const m = p.model;
        const el = g.dataset.kind === 'zone' ? zoneById(m, g.dataset.id)
          : g.dataset.kind === 'anode' ? (p.attackCache.nodes.find(n => n.id === g.dataset.id))
          : nodeById(m, g.dataset.id);
        orig = { el, x: el.x, y: el.y, mx: mp.x, my: mp.y, kids: g.dataset.kind === 'zone' ? m.nodes.filter(n => n.zone === el.id).map(n => ({ n, x: n.x, y: n.y })) : [] };
      }
      return;
    }
    S.sel = null; renderRight();
    mode = 'pan'; start = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y };
    stage.classList.add('dragging');
  });

  window.addEventListener('mousemove', ev => {
    if (!mode) return;
    if (mode === 'pan') {
      const cam = S.camera[S.view];
      cam.x = start.cx + (ev.clientX - start.x); cam.y = start.cy + (ev.clientY - start.y);
      draw();
    } else if (mode === 'drag' && orig) {
      if (!moved) { snapshot('move ' + (orig.el.name || orig.el.label || 'element')); moved = true; }
      const mp = toModel(ev);
      const dx = Math.round((mp.x - orig.mx) / 5) * 5, dy = Math.round((mp.y - orig.my) / 5) * 5;
      orig.el.x = orig.x + dx; orig.el.y = orig.y + dy;
      orig.kids.forEach(k => { k.n.x = k.x + dx; k.n.y = k.y + dy; });
      draw();
    }
  });

  window.addEventListener('mouseup', () => {
    if (mode === 'drag' && moved) { reparent(); renderRight(); renderStatus(); }
    mode = null; orig = null; stage.classList.remove('dragging');
  });

  stage.addEventListener('wheel', ev => {
    ev.preventDefault();
    const cam = S.camera[S.view]; if (!cam) return;
    const r = $('#svg').getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    const nk = Math.max(0.2, Math.min(3, cam.k * f));
    cam.x = mx - (mx - cam.x) * (nk / cam.k); cam.y = my - (my - cam.y) * (nk / cam.k); cam.k = nk;
    draw();
  }, { passive: false });

  stage.addEventListener('dblclick', ev => {
    const g = ev.target.closest('[data-kind]'); if (!g) return;
    S.sel = { kind: g.dataset.kind, id: g.dataset.id };
    S.rtab = 'inspect'; renderRight(); draw();
  });
})();

function reparent() {
  const m = M(); if (!m) return;
  m.nodes.forEach(n => {
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    const z = m.zones.find(z => cx > z.x && cx < z.x + z.w && cy > z.y && cy < z.y + z.h);
    if (z && z.id !== n.zone) { n.zone = z.id; toast(esc(n.name) + ' now sits in ' + esc(z.name) + '. Boundary risks were recalculated.'); }
  });
}

/* ---------- left frame: tree ---------- */
function renderTree() {
  const p = P(), host = $('#tree');
  if (!p || !p.model.tree || !p.model.tree.length) {
    host.innerHTML = '<div class="empty"><b>No source loaded</b>Pick a sample, read a repo, or paste a file tree above. Files are matched against known security signals.</div>';
    return;
  }
  const root = buildTree(p.model.tree);
  const walk = (node, depth) => {
    const kids = Object.values(node.kids).sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
    return kids.map(k => {
      const sig = signalsFor(k.path || k.name);
      const open = depth < 1 || S.expandAll;
      const id = 'tn_' + (k.path || k.name).replace(/[^\w]/g, '_');
      const kidHTML = k.dir ? '<div class="kids" id="' + id + '" style="display:' + (open ? 'block' : 'none') + '">' + walk(k, depth + 1) + '</div>' : '';
      return '<div><div class="tnode' + (sig.length ? ' hit' : '') + '"' + (sig.length ? ' data-tip="Security signal: ' + esc(sig.map(s => s.name).join(', ')) + '"' : '') + '>' +
        '<span class="tw" ' + (k.dir ? 'data-t="' + id + '"' : '') + '>' + (k.dir ? (open ? '▾' : '▸') : '·') + '</span>' +
        '<span class="tf">' + (k.dir ? '▣' : '▢') + '</span><span class="tname">' + esc(k.name) + '</span>' +
        (sig.length ? '<span class="tsig">' + esc(sig[0].tag) + '</span>' : '') + '</div>' + kidHTML + '</div>';
    }).join('');
  };
  host.innerHTML = walk(root, 0);
  $$('.tw[data-t]', host).forEach(t => t.onclick = () => {
    const k = document.getElementById(t.dataset.t); if (!k) return;
    const open = k.style.display !== 'none';
    k.style.display = open ? 'none' : 'block'; t.textContent = open ? '▸' : '▾';
  });
}

function newProject(model, product, version) {
  const p = {
    id: uid('p'), product: product || model.product, version: version || model.version,
    created: Date.now(), model: model, attack: null
  };
  S.projects.unshift(p); S.pid = p.id; S.undo = []; S.redo = []; S.camera = {};
  normalize(p.model);

}
function normalize(m) {
  m.nodes.forEach(n => { n.h = Math.max(n.h || 0, 64); n.w = n.w || 210; n.proto = n.proto || []; n.data = n.data || []; n.sbom = n.sbom || []; });
  m.zones.forEach(z => { z.tint = z.tint || TINT[z.trust] || '#eef1f5'; });
  m.flows.forEach(f => { f.data = f.data || []; });
}
function openProjects() {
  const rows = S.projects.map(p => '<tr><td><b>' + esc(p.product) + '</b><br><span class="mono">v' + esc(p.version) + '</span></td>' +
    '<td>' + p.model.nodes.length + ' elements<br>' + p.model.flows.length + ' interfaces</td>' +

    '<td style="white-space:nowrap"><button class="btn sm" data-op="open:' + p.id + '">Open</button> ' +

    '<button class="btn sm" data-op="del:' + p.id + '">Delete</button></td></tr>').join('');
  const m = modal('Projects', S.projects.length
    ? '<table class="t"><tr><th>Product</th><th>Model</th><th>Created</th><th></th></tr>' + rows + '</table>' +
      '<div style="margin-top:12px"><button class="btn sm" id="imp">Import a .json project file</button><input type="file" id="impf" accept="application/json" style="display:none"></div>'
    : '<div class="empty"><b>No saved projects</b>Create one from a sample or your own codebase.</div>', [{ label: 'Close' }]);
  $$('[data-op]', m).forEach(b => b.onclick = () => {
    const [op, id] = b.dataset.op.split(':');
    if (op === 'open') { S.pid = id; S.undo = []; S.redo = []; S.camera = {}; normalize(P().model); refreshAll(); closeModal(); }
    if (op === 'dup') {
      const src = S.projects.find(x => x.id === id);
      const copy = clone(src); copy.id = uid('p'); copy.created = Date.now();
      const v = prompt('Version label for the new copy', bumpVersion(src.version));
      if (v == null) return;
      copy.version = v; copy.model.version = v;
      S.projects.unshift(copy); S.pid = copy.id; S.camera = {}; refreshAll(); save(true); closeModal();
      toast('Created ' + esc(copy.product) + ' v' + esc(v) + '. The model was copied so you can diff versions.');
    }
    if (op === 'del') {
      if (!confirm('Delete this project permanently?')) return;
      S.projects = S.projects.filter(x => x.id !== id);
      if (S.pid === id) S.pid = (S.projects[0] || {}).id || null;
      save(true); refreshAll(); closeModal();
    }
  });
  const imp = $('#imp', m);
  if (imp) {
    imp.onclick = () => $('#impf', m).click();
    $('#impf', m).onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const obj = JSON.parse(rd.result);
          obj.id = uid('p'); S.projects.unshift(obj); S.pid = obj.id; normalize(obj.model);
          save(true); refreshAll(); closeModal(); toast('Project imported.');
        } catch (err) { toast('That file could not be read as a ThreatForge project.'); }
      };
      rd.readAsText(file);
    };
  }
}
function bumpVersion(v) {
  const m = String(v).match(/(\d+)(?!.*\d)/);
  return m ? String(v).slice(0, m.index) + (parseInt(m[1], 10) + 1) + String(v).slice(m.index + m[1].length) : v + '.1';
}

function buildInner(view, fdaView) {
  const p = P(), m = p.model, risks = m._risks || analyze(m);
  let inner = svgDefs(), box, title;
  if (view === 'attack') {
    const g = p.attackCache || buildAttackGraph(m);
    inner += renderAttackGraph(g);
    box = contentBox(g.nodes.map(n => ({ x: n.x - 40, y: n.y, w: n.w + 80, h: n.h })), 40);
    box.y = Math.min(box.y, 20);
    title = 'Attack graph';
  } else if (view === 'fda') {
    const sub = fdaSubset(m, fdaView), meta = FDA_VIEWS.find(v => v.id === fdaView);
    inner += renderThreatModel(sub, risks);
    box = contentBox(sub.zones.concat(sub.nodes), 46); box.y -= 62; box.h += 62;
    inner += captionBand(box, 'FDA premarket · ' + meta.label + ' — ' + m.product + ' v' + m.version, meta.hint);
    title = 'FDA premarket — ' + meta.label;
  } else {
    inner += renderThreatModel(m, risks);
    box = contentBox(m.zones.concat(m.nodes), 46); box.y -= 62; box.h += 62;
    inner += captionBand(box, (S.ov2 ? 'OV-2 operational view' : 'SV-2 systems view') + ' — ' + m.product + ' v' + m.version,
      S.ov2 ? 'Operational nodes and the information they exchange.' : 'Systems, protocol versions, encryption and boundary risk.');
    title = S.ov2 ? 'Threat model (OV-2)' : 'Threat model (SV-2)';
  }
  return { inner, box, title };
}
function svgString(view, fdaView) {
  const { inner, box, title } = buildInner(view, fdaView);
  return { title, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="' + Math.round(box.w) + '" height="' + Math.round(box.h) +
    '" viewBox="' + Math.round(box.x) + ' ' + Math.round(box.y) + ' ' + Math.round(box.w) + ' ' + Math.round(box.h) + '">' +
    '<rect x="' + box.x + '" y="' + box.y + '" width="' + box.w + '" height="' + box.h + '" fill="#fbfdfe"/>' + inner + '</svg>' };
}
function svgToPng(svgStr, scale) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width * (scale || 2); c.height = img.height * (scale || 2);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/png'));
    };
    img.onerror = () => rej(new Error('render failed'));
    img.src = url;
  });
}
function allViews() {
  return [{ v: 'tm' }, { v: 'attack' }].concat(FDA_VIEWS.map(f => ({ v: 'fda', f: f.id })));
}

    '## Overall cyber risk', '', '- Composite index: ' + sm.score + '/100 (worst finding ' + sm.worst + ')',
    '- Findings: ' + sm.total + ' (' + ['Critical', 'High', 'Medium', 'Low'].map(b => sm.counts[b] + ' ' + b.toLowerCase()).join(', ') + ')',
    '- After recommended controls: ' + ['Critical', 'High', 'Medium', 'Low'].map(b => sm.resid[b] + ' ' + b.toLowerCase()).join(', '),
    '- Trust boundary crossings: ' + sm.crossings, '- Advisories in scope: ' + sm.cves.join(', '), '');
  L.push('## Trust zones', '');
  m.zones.forEach(z => L.push('- **' + z.name + '** (' + z.trust + '): ' + m.nodes.filter(n => n.zone === z.id).map(n => n.name).join(', ')));
  L.push('', '## Elements', '');
  m.nodes.filter(n => n.kind !== 'threat').forEach(n => L.push('- **' + n.name + '** — ' + (KIND_LABEL[n.kind] || n.kind) + '; ' + (n.tech || 'n/a') +
    '; protocols: ' + ((n.proto || []).join(', ') || 'n/a') + '; encryption: ' + n.enc + '; auth: ' + n.auth +
    '; data: ' + ((n.data || []).join(', ') || 'none') + (n.scope === 'fleet' ? '; multi-patient asset' : '') +
    ((n.sbom || []).length ? '; SBOM: ' + n.sbom.map(c => c.n + ' ' + c.v).join(', ') : '')));
  L.push('', '## Interfaces', '');
  m.flows.filter(f => f.kind !== 'threat').forEach(f => {
    const a = nodeById(m, f.from), b = nodeById(m, f.to);
    L.push('- ' + (a ? a.name : '?') + ' → ' + (b ? b.name : '?') + ': ' + f.label + ' [' + (f.proto || 'n/a') + '; ' + f.enc + '; ' + f.auth + '; data: ' + ((f.data || []).join(', ') || 'none') + ']');
  });
  L.push('', '## Findings, mitigations and residual risk', '');
  risks.forEach((r, i) => {
    L.push('### ' + (i + 1) + '. ' + r.title + ' — ' + r.band + ' (' + r.score + ')', '',
      r.what, '', '- Boundary: ' + (r.boundary || 'n/a'), '- STRIDE: ' + r.stride.map(k => KB.stride[k]).join(', '),
      '- Likelihood ' + r.L + ' x impact ' + r.I,
      r.cves.length ? '- Advisories: ' + r.cves.join(', ') : '- Advisories: none matched');
    r.mitigations.forEach(c => L.push('- ' + c.title + ': ' + c.ctl.join('; ') + ' [' + c.ref + ']'));
    L.push('- Residual after controls: ' + r.rBand + ' (' + r.rScore + ')');
    if (r.safety) L.push('- Patient safety: ' + r.safety.hazard + ' → ' + r.safety.harm + '; severity ' + r.safety.sev + '/5; exploitability ' + r.safety.exploit + '; ' + r.safety.scope);
    L.push('');
  });
  const g = P().attackCache || buildAttackGraph(m);
  L.push('## Attack graph', '');
  g.edges.forEach(e => {
    const a = g.nodes.find(n => n.id === e.from), b = g.nodes.find(n => n.id === e.to);
    if (a && b) L.push('- ' + a.label + ' --[' + e.label + ']--> ' + b.label);
  });
  L.push('', '## FDA premarket architecture views', '');
  FDA_VIEWS.forEach(v => {
    const sub = fdaSubset(m, v.id);
    L.push('### ' + v.label, '', v.hint, '', 'In scope: ' + sub.nodes.map(n => n.name).join(', '), '');
  });
  return L.join('\n');
}

/* ============================================================
   AI analyst — narrative only. Scores stay deterministic.
   ============================================================ */
function modelDigest() {
  const m = M(), risks = m._risks || analyze(m), sm = summary(m, risks);
  return JSON.stringify({
    product: m.product, version: m.version, kind: m.kindOfProduct,
    zones: m.zones.map(z => ({ name: z.name, trust: z.trust })),
    nodes: m.nodes.map(n => ({ name: n.name, kind: n.kind, zone: (zoneById(m, n.zone) || {}).name, proto: n.proto, enc: n.enc, auth: n.auth, data: n.data, scope: n.scope, sbom: (n.sbom || []).map(c => c.n + ' ' + c.v) })),
    flows: m.flows.map(f => ({ from: (nodeById(m, f.from) || {}).name, to: (nodeById(m, f.to) || {}).name, label: f.label, proto: f.proto, enc: f.enc, auth: f.auth, data: f.data })),
    index: sm.score, worst: sm.worst,
    top: risks.slice(0, 10).map(r => ({ title: r.title, band: r.band, score: r.score, residual: r.rBand, cves: r.cves }))
  });
}
function localNarrative() {
  const m = M(), risks = m._risks || analyze(m), sm = summary(m, risks);
  const top = risks.slice(0, 3);
  const cross = m.flows.filter(f => { const a = zoneOf(m, f.from), b = zoneOf(m, f.to); return f.kind !== 'threat' && a && b && a.id !== b.id; });
  return '<p><b>Executive read.</b> ' + esc(m.product) + ' v' + esc(m.version) + ' carries a composite risk index of ' + sm.score +
    ' with ' + sm.counts.Critical + ' critical and ' + sm.counts.High + ' high findings across ' + m.zones.length + ' trust zones and ' +
    cross.length + ' boundary crossings. The controls listed in the risk panel bring the profile down to ' + sm.resid.Critical +
    ' critical and ' + sm.resid.High + ' high.</p>' +
    '<p><b>What to fix first.</b></p><ol>' + top.map(r => '<li>' + esc(r.title) + ' — ' + r.band + ' (' + r.score + '). ' +
      esc((r.mitigations[0] || { ctl: ['Document the acceptance rationale.'] }).ctl[0]) + '</li>').join('') + '</ol>' +
    '<p><b>Safety linkage.</b> ' + (sm.safety.length ? sm.safety.length + ' findings map to a hazardous situation with severity 4 or 5. Those belong in the ISO 14971 risk file, not only in the security register.' : 'No finding currently maps to physical harm; confirm that therapy and firmware data are declared on the right interfaces.') + '</p>' +
    '<p style="color:#7b8b96;font-size:11.5px">Written by the built-in analyst from the deterministic model. Connect a language model for a longer narrative.</p>';
}
function bindAI() {
  const go = $('#ai_go'); if (!go) return;
  go.onclick = async () => {
    const q = $('#ai_q').value.trim() || 'Write the executive summary of this threat model, then the three actions with the greatest risk reduction per unit of effort.';
    const out = $('#ai_out');
    out.innerHTML = '<div style="color:var(--ink3)">Thinking…</div>';
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6', max_tokens: 1000,
          messages: [{
            role: 'user', content:
              'You are a product security architect reviewing a medical-device threat model. Use only the JSON model below; do not invent components or CVEs, and do not restate or change the numeric scores — they are computed deterministically.\n\n' +
              'MODEL:\n' + modelDigest() + '\n\nQUESTION: ' + q + '\n\nAnswer in clean HTML: short paragraphs, <b> for emphasis, <ul>/<ol> for lists. No preamble, no markdown fences.'
          }]
        })
      });
      const data = await res.json();
      const text = (data.content || []).map(c => c.type === 'text' ? c.text : '').join('\n').trim();
      out.innerHTML = text ? text.replace(/```html|```/g, '') : localNarrative();
    } catch (e) {
      out.innerHTML = localNarrative();
    }
  };
}

/* ---------------- scoring knobs ---------------- */

    r.id = r.kind + ':' + r.ref + ':' + String(r.title).toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 26);
    if (CFG.lOff || CFG.iOff) { r.L = cl(r.L + CFG.lOff); r.I = cl(r.I + CFG.iOff); }
    r.score = r.L * r.I; r.band = band(r.score);
    const dL = (r.mitigations || []).reduce((s, c) => s + (c.dL || 0), 0) * CFG.ctlEffect;
    r.rL = Math.max(1, Math.round(r.L - Math.min(3, dL)));

/* ---------------- OV-1: high-level operational concept ---------------- */
function renderOV1(m, risks) {
  const zones = m.zones.filter(z => m.nodes.some(n => n.zone === z.id && n.kind !== 'threat'));
  const agg = {};
  m.flows.forEach(f => {
    if (f.kind === 'threat') return;
    const a = zoneOf(m, f.from), b = zoneOf(m, f.to);
    if (!a || !b || a.id === b.id) return;
    const k = a.id + '>' + b.id;
    const r = risks.find(x => x.kind === 'flow' && x.ref === f.id);
    agg[k] = agg[k] || { a, b, labels: [], data: [], worst: 'Low' };
    agg[k].labels.push(f.label);
    agg[k].data = uniq(agg[k].data.concat(f.data || []));
    if (r && ['Low', 'Medium', 'High', 'Critical'].indexOf(r.band) > ['Low', 'Medium', 'High', 'Critical'].indexOf(agg[k].worst)) agg[k].worst = r.band;
  });
